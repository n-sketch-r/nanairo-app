<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マイクロハーブ</title>
    <link rel="apple-touch-icon" href="images/logo.png">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.9/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // ★ロゴ（カメレオン）の色：輪郭の濃い緑・体の黄緑・生成りの背景
                        'nanairo': { light: '#EEF5E1', DEFAULT: '#8DC63F', dark: '#0F9A44' },
                        'nanairo-accent': '#F7931E',
                        'cream': '#FAF6EC',
                    }
                }
            }
        }
    </script>
    <style>
        summary::-webkit-details-marker { display: none; }
        ::-webkit-scrollbar { display: none; }
        body {
            -ms-overflow-style: none; scrollbar-width: none;
            background-color: #FAF6EC; font-family: "Zen Maru Gothic", -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .app-container {
            max-width: 430px; margin: 0 auto; background-color: #FAF6EC;
            min-height: 100vh; position: relative; display: flex; flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-left-color: #fff; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        /* ロゴのお腹と同じ虹色の線 */
        @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
        .animate-bump { animation: bump 0.35s ease-out; }
        .rainbow { height: 4px; background: linear-gradient(90deg,#E8412F,#F7931E,#FDD835,#4CB848,#00AEEF,#0F75BC,#A0569F); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Icons = {
            X: ({className, onClick}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} onClick={onClick}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            History: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
            Minus: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/></svg>,
            Plus: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            ShoppingCart: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.1-5.38a.5.5 0 0 0-.49-.6h-15.1"/></svg>,
            Store: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"/></svg>,
            Check: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 6 9 17l-5-5"/></svg>,
            AlertCircle: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Truck: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 18H3c-.6 0-1-.4-1-1V7c0-.6.4-1 1-1h10c.6 0 1 .4 1 1v11"/><path d="M14 9h4l4 4v4c0 .6-.4 1-1 1h-2"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>,
            Info: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        };

        const GAS_URL = "https://script.google.com/macros/s/AKfycbwv2XISbajDhH03WIIvr9-Br87CGaQcVYKtzk6flCluhncE6rfxlKS0fTN0vdbV5k-H9Q/exec"; 

        // ★将来再開できるように画像は残しておく
        // ★商品写真（images/ フォルダ。1000px・約120KBに圧縮済み）
        const IMAGE_MAP = {
            "アマランサス": "images/amaranth.jpg",
            "デトロイト": "images/detroit.jpg",
            "にんじん": "images/carrot.jpg",
            "ハーブミックス": "images/herb-mix.jpg",
            "ひまわり": "images/sunflower.jpg",
            "ペッパークレス": "images/pepper-cress.jpg",
            "マスタード": "images/mustard.jpg",
            "レッドケール": "images/red-kale.jpg",
            "レッドラディッシュ": "images/red-radish.jpg",
            "ロケット": "images/rocket.jpg",
            "青じそ": "images/aojiso.jpg"
        };

        // ★画面に出さない商品（スプレッドシートには残したまま、販売だけ止める）
        //   ※今は管理画面の「商品の管理」で切り替え。これは古いGASのときだけ使う予備
        const HIDDEN_PRODUCTS = ["なないろ菜", "レッドソレル"];

        // ★商品の一言説明（商品一覧に表示）
        const PRODUCT_DESC = {
            "アマランサス": "鮮やかな赤紫・やさしい味",
            "デトロイト": "赤い茎がサラダを華やかに",
            "にんじん": "ほのかなにんじんの香り",
            "ハーブミックス": "いろいろな風味を少しずつ",
            "ひまわり": "シャキッと食感・ナッツの風味",
            "ペッパークレス": "ピリッとした辛み",
            "マスタード": "ツンとくる辛み・肉料理に",
            "レッドケール": "クセが少なく彩りに",
            "レッドラディッシュ": "大根の辛み・彩りに",
            "ロケット": "ごまの香り・ピリッと辛い",
            "青じそ": "爽やかな香り"
        };

        // ★特定商取引法に基づく表記（ready を true にすると注文画面の下にリンクが出る）
        const LEGAL = {
            ready: true,
            seller: "株式会社N-SKETCH",
            manager: "佐藤 佑樹",         // 運営責任者
            address: "〒997-0018 山形県鶴岡市茅原町26-23",
            tel: "0235-26-0759",
            hours: "8:30〜17:00",         // 電話の受付時間
            returns: "生鮮食品のため、お客様都合による返品・交換はお受けできません。商品に不備があった場合は、お受け取り日当日中に公式LINEまたはお電話でご連絡ください。", // 返品・交換
        };

        // この数以下で「残りわずか」と表示する
        const LOW_STOCK = 2;

        // ★配送ルール（GAS側の DELIVERY と同じ値にしてください）
        const DELIVERY = {
            days: [1, 2],                // 配送できる曜日（0=日,1=月,2=火 ...）
            time: "16:00-17:00",         // 配送時間帯
            freeThreshold: 1000,         // この金額以上で送料無料（商品合計・税込）
            fee: 500,                    // 送料（税込）
            areas: ["鶴岡市", "酒田市", "三川町", "庄内町", "遊佐町"],
            weeksAhead: 4,               // 何週先まで選べるか
            pickupTimes: ["11:00-12:00", "12:00-13:00", "13:00-14:00", "14:00-15:00", "15:00-16:00", "16:00-17:00"], // 店頭受け取りの時間帯
            closedDays: []               // 休業日（受け取り・配送を止める日）
        };
        // ★管理画面の「設定」の値で上書きする
        const applySettings = (st) => {
            if (!st) return;
            if (Array.isArray(st.deliveryDays)) DELIVERY.days = st.deliveryDays;
            if (st.deliveryTime) DELIVERY.time = st.deliveryTime;
            if (st.deliveryFee != null) DELIVERY.fee = Number(st.deliveryFee);
            if (st.freeThreshold != null) DELIVERY.freeThreshold = Number(st.freeThreshold);
            if (Array.isArray(st.pickupTimes) && st.pickupTimes.length) DELIVERY.pickupTimes = st.pickupTimes;
            if (Array.isArray(st.closedDays)) DELIVERY.closedDays = st.closedDays;
        };
        const METHOD_PICKUP = "店頭受取";
        const METHOD_DELIVERY = "配送";
        const WEEK = ["日", "月", "火", "水", "木", "金", "土"];

        // ★日本時間で「今日から n 日後」を yyyy-MM-dd で返す（toISOStringのUTCずれ対策）
        const jstDateStr = (addDays = 0) => {
            const d = new Date(Date.now() + 9 * 3600 * 1000 + addDays * 86400 * 1000);
            return d.toISOString().split('T')[0];
        };
        const weekdayOf = (dateStr) => {
            const [y, m, d] = String(dateStr).split('-').map(Number);
            return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
        };
        const formatJpDate = (dateStr) => {
            if (!dateStr) return "";
            const [, m, d] = dateStr.split('-').map(Number);
            return `${m}/${d}(${WEEK[weekdayOf(dateStr)]})`;
        };
        // 電話番号をそろえる（iPhoneの自動入力の「+81 80-…」を「080-…」にする）
        const normalizePhone = (v) => String(v || '').trim().replace(/^\+81[\s-]?/, '0').replace(/[^\d-]/g, '');

        // 前日の yyyy-MM-dd（キャンセル期限の表示用）
        const prevDayStr = (dateStr) => {
            const [y, m, d] = String(dateStr).split('-').map(Number);
            return new Date(Date.UTC(y, m - 1, d - 1)).toISOString().slice(0, 10);
        };
        // 明日以降で配送できる日の一覧
        const getDeliveryDates = () => {
            const list = [];
            for (let i = 1; i <= DELIVERY.weeksAhead * 7; i++) {
                const ds = jstDateStr(i);
                if (DELIVERY.days.includes(weekdayOf(ds)) && !DELIVERY.closedDays.includes(ds)) list.push(ds);
            }
            return list;
        };

        // 店頭受取で選べる日（明日から14日分）
        const getPickupDates = () => Array.from({ length: 14 }, (_, i) => jstDateStr(i + 1)).filter(ds => !DELIVERY.closedDays.includes(ds));

        function App() {
            const [userName, setUserName] = useState("読み込み中...");
            const [userId, setUserId] = useState("");
            const [isLiffReady, setIsLiffReady] = useState(false);

            const [activeTab, setActiveTab] = useState('home');
            const [pastOrders, setPastOrders] = useState([]);
            const [isLoadingHistory, setIsLoadingHistory] = useState(false);

            const [productsData, setProductsData] = useState([]);
            const [isLoadingData, setIsLoadingData] = useState(true);

            const [cart, setCart] = useState({});
            const [showConfirm, setShowConfirm] = useState(false);
            const [showComplete, setShowComplete] = useState(false);
            
            const [cancelTarget, setCancelTarget] = useState(null);
            const [isCancelling, setIsCancelling] = useState(false);
            
            const [pickupDate, setPickupDate] = useState("");
            const [minPickupDate, setMinPickupDate] = useState(""); // ★追加: 選択可能な最短日
            const [pickupTime, setPickupTime] = useState("11:00-12:00");
            const [memo, setMemo] = useState("");

            // ★配送対応
            const [deliveryMethod, setDeliveryMethod] = useState(METHOD_PICKUP);
            const [settingsVer, setSettingsVer] = useState(0); // 設定を読み込んだら日付の候補を作り直す
            const deliveryDates = useMemo(() => getDeliveryDates(), [settingsVer]);
            const [deliveryDate, setDeliveryDate] = useState("");
            const [city, setCity] = useState(DELIVERY.areas[0]);
            const [addressDetail, setAddressDetail] = useState("");
            const [phone, setPhone] = useState("");
            const [storeName, setStoreName] = useState(""); // ★飲食店などの店舗名（任意）
            const [errorMsg, setErrorMsg] = useState("");
            const [lastOrder, setLastOrder] = useState(null);
            const pickupDates = useMemo(() => getPickupDates(), [settingsVer]);
            const [detailProduct, setDetailProduct] = useState(null); // 商品の詳しい画面
            const [loadError, setLoadError] = useState(false);        // 商品一覧が読み込めなかった
            const [bumpKey, setBumpKey] = useState(0);                // カートのボタンを弾ませる合図
            const [showLegal, setShowLegal] = useState(false);
            const [showHelp, setShowHelp] = useState(false);
            const [showGuide, setShowGuide] = useState(() => { try { return !localStorage.getItem('nanairo_guide_seen'); } catch (e) { return false; } });
            const closeGuide = () => { setShowGuide(false); try { localStorage.setItem('nanairo_guide_seen', '1'); } catch (e) {} };

            const [isSubmitting, setIsSubmitting] = useState(false);

            // ★お客様の登録情報（初回だけ入力）。undefined=確認中 / null=未登録
            const [customer, setCustomer] = useState(undefined);
            const [showCustomerForm, setShowCustomerForm] = useState(false);
            const [cfName, setCfName] = useState("");
            const [cfPhone, setCfPhone] = useState("");
            const [cfStore, setCfStore] = useState("");
            const [cfError, setCfError] = useState("");
            const [isSavingCustomer, setIsSavingCustomer] = useState(false);

            useEffect(() => {
                // ★修正: 日本時間で「明日」を最短日にする（朝9時前に日付がずれる不具合を修正）
                const minDateStr = jstDateStr(1);

                setPickupDate(minDateStr);     // 初期値を明日にセット
                setMinPickupDate(minDateStr);  // カレンダーの選択ブロック用にセット

                // 前回入力した配送先を復元（この端末のみに保存）
                try {
                    const saved = JSON.parse(localStorage.getItem('nanairo_delivery') || 'null');
                    if (saved) {
                        if (DELIVERY.areas.includes(saved.city)) setCity(saved.city);
                        setAddressDetail(saved.addressDetail || "");
                        setPhone(saved.phone || "");
                        setStoreName(saved.storeName || "");
                    }
                } catch (e) {}

                const savedHistory = JSON.parse(localStorage.getItem('nanairo_history') || '[]');
                setPastOrders(savedHistory);

                liff.init({ liffId: "2010021938-R9EhB5rj" })
                    .then(() => {
                        if (liff.isLoggedIn()) {
                            liff.getProfile().then(profile => {
                                setUserName(profile.displayName);
                                setUserId(profile.userId);
                                setIsLiffReady(true);
                                fetchUserOrders(profile.userId); 
                                fetchCustomer();
                            });
                        } else {
                            if (liff.isInClient()) {
                                liff.login();
                            } else {
                                setUserName("プレビューゲスト");
                                setUserId("");
                                setIsLiffReady(true);
                            }
                        }
                    })
                    .catch(err => {
                        console.error('LIFF init failed', err);
                        setUserName("ゲスト(エラー)");
                        setIsLiffReady(true);
                    });

                loadProducts();
                fetch(`${GAS_URL}?action=getSettings&t=${Date.now()}`)
                    .then(res => res.json())
                    .then(data => { if (data && data.status === 'success') { applySettings(data.settings); setSettingsVer(v => v + 1); } })
                    .catch(err => console.error("設定の取得エラー", err));
            }, []);

            // 設定が変わって、選んでいた日・時間が選べなくなったら選び直す
            useEffect(() => {
                if (!settingsVer) return;
                setPickupDate(prev => pickupDates.includes(prev) ? prev : (pickupDates[0] || ''));
                setPickupTime(prev => DELIVERY.pickupTimes.includes(prev) ? prev : DELIVERY.pickupTimes[0]);
                setDeliveryDate(prev => deliveryDates.includes(prev) ? prev : '');
            }, [settingsVer]);

            const loadProducts = () => {
                setLoadError(false);
                return fetch(`${GAS_URL}?action=getProducts&t=${Date.now()}`)
                    .then(res => res.json())
                    .then(data => {
                        if (Array.isArray(data)) {
                            const formattedData = data
                                .filter(p => p.active === undefined ? !HIDDEN_PRODUCTS.includes(p.name) : p.active !== false) // ★販売停止中の商品は出さない
                                .map(p => ({
                                    ...p,
                                    desc: p.desc || PRODUCT_DESC[p.name] || '',
                                    unit: 'P',
                                    image: p.imageUrl || IMAGE_MAP[p.name] || null // 管理画面で登録した写真 → images/ の写真 → なければ商品名
                                }));
                            setProductsData(formattedData);
                        }
                    })
                    .catch(err => { console.error("データ取得エラー", err); setLoadError(true); })
                    .finally(() => setIsLoadingData(false));
            };

            // ★LINEの本人確認用トークン（GAS側でLINEのサーバーに照会して本人を確認します）
            const getIdToken = () => {
                try { return (window.liff && liff.isLoggedIn()) ? liff.getIDToken() : null; } catch (e) { return null; }
            };

            // ★この端末に保存がないとき（機種変更など）、前回のご注文からお届け先・店舗名を入れておく
            //   ※住所・電話番号はLINEの本人確認が取れたときだけサーバーから返ってきます
            const fillFromLastOrder = (orders) => {
                const lastDelivery = orders.find(o => o.deliveryMethod === METHOD_DELIVERY && o.address);
                if (lastDelivery) {
                    const c = DELIVERY.areas.find(a => lastDelivery.address.startsWith(a));
                    if (c) {
                        setAddressDetail(prev => {
                            if (prev) return prev;
                            setCity(c);
                            return lastDelivery.address.slice(c.length);
                        });
                    }
                    if (lastDelivery.phone) setPhone(prev => prev || lastDelivery.phone);
                }
                const lastStore = orders.find(o => o.storeName);
                if (lastStore) setStoreName(prev => prev || lastStore.storeName);
            };

            const applyCustomer = (c) => {
                setCustomer(c);
                if (c) {
                    // 登録情報をいちばん優先する（この端末に残っている前回の入力より新しいため）
                    if (c.phone) setPhone(c.phone); else setPhone(prev => prev || c.phone);
                    if (c.storeName) setStoreName(c.storeName);
                }
            };

            const fetchCustomer = () => {
                const idToken = getIdToken();
                if (!idToken) return; // LINEの外で開いたときは確認しない
                fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "getProfile", idToken }) })
                    .then(res => res.json())
                    .then(data => {
                        if (!data || data.status !== "success") return;
                        applyCustomer(data.profile || null);
                        if (!data.profile) openCustomerForm(null);
                    })
                    .catch(err => console.error("登録情報の取得エラー", err));
            };

            const openCustomerForm = (c) => {
                setCfName(c ? c.fullName : "");
                setCfPhone(c ? c.phone : phone);
                setCfStore(c ? c.storeName : storeName);
                setCfError("");
                setShowCustomerForm(true);
            };

            const saveCustomer = async () => {
                if (isSavingCustomer) return;
                if (!cfName.trim()) return setCfError("お名前を入力してください");
                if (cfPhone.replace(/[^\d]/g, "").length < 10) return setCfError("電話番号を正しく入力してください");
                setIsSavingCustomer(true); setCfError("");
                try {
                    const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "saveProfile", idToken: getIdToken(), fullName: cfName.trim(), phone: normalizePhone(cfPhone), storeName: cfStore.trim() }) });
                    const data = await res.json();
                    if (!data || data.status !== "success") throw new Error((data && data.message) || "登録できませんでした");
                    setPhone(data.profile.phone); setStoreName(data.profile.storeName);
                    applyCustomer(data.profile);
                    setShowCustomerForm(false);
                } catch (e) {
                    setCfError(String(e.message || e).replace(/^Error:\s*/, ""));
                } finally { setIsSavingCustomer(false); }
            };

            const fetchUserOrders = (uid) => {
                const idToken = getIdToken();
                const fallbackId = uid || userId;
                if (!idToken && !fallbackId) return;
                setIsLoadingHistory(true);
                fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "getUserOrders", idToken, userId: fallbackId })
                })
                    .then(res => res.json())
                    .then(data => {
                        if (Array.isArray(data)) {
                            setPastOrders(data);
                            fillFromLastOrder(data);
                            localStorage.setItem('nanairo_history', JSON.stringify(data.map(({ address, phone, ...rest }) => rest)));
                        }
                    })
                    .catch(err => console.error("履歴取得エラー", err))
                    .finally(() => setIsLoadingHistory(false));
            };

            const updateQuantity = (productId, delta) => {
                if (delta > 0) setBumpKey(k => k + 1);
                setCart(prev => {
                    const next = Math.max(0, (prev[productId] || 0) + delta);
                    const newCart = { ...prev };
                    if (next === 0) delete newCart[productId];
                    else newCart[productId] = next;
                    return newCart;
                });
            };

            const setQuantity = (productId, amount) => { setCart(prev => ({ ...prev, [productId]: amount })); setBumpKey(k => k + 1); };

            const cartSummary = useMemo(() => {
                let totalItems = 0, totalPrice = 0;
                Object.entries(cart).forEach(([id, quantity]) => {
                    const product = productsData.find(p => p.id === id);
                    if (product) { totalItems += quantity; totalPrice += product.price * quantity; }
                });
                // ★配送料（商品合計が基準額以上なら無料）
                const isDelivery = deliveryMethod === METHOD_DELIVERY;
                const shippingFee = isDelivery && totalPrice < DELIVERY.freeThreshold ? DELIVERY.fee : 0;
                const untilFree = Math.max(0, DELIVERY.freeThreshold - totalPrice);
                return { totalItems, totalPrice, shippingFee, untilFree, grandTotal: totalPrice + shippingFee };
            }, [cart, productsData, deliveryMethod]);

            useEffect(() => { if (showConfirm && cartSummary.totalItems === 0) setShowConfirm(false); }, [showConfirm, cartSummary.totalItems]);

            const isDelivery = deliveryMethod === METHOD_DELIVERY;
            const phoneDigits = phone.replace(/[^\d]/g, "");
            // 予約ボタンを押せない理由（なければ空文字）
            const formProblem = isDelivery
                ? (!deliveryDate ? '配送日を選択してください'
                    : !addressDetail.trim() ? 'ご住所を入力してください'
                    : phoneDigits.length < 10 ? '電話番号を入力してください' : '')
                : (!pickupDate ? '来店予定日を入力してください' : '');

            const copyFromHistory = (itemsList) => { 
                const newCart = {};
                if (Array.isArray(itemsList)) {
                    itemsList.forEach(item => {
                        const product = productsData.find(p => item.id && p.id === item.id) || productsData.find(p => p.name === item.name); // 商品IDで探す（名前が変わっても再注文できる）
                        // もし過去履歴になないろ菜があった場合、現在販売してないのでカートには入らない仕様になります
                        if (product) newCart[product.id] = item.qty;
                    });
                }
                setCart(newCart); 
                setActiveTab('home'); 
            };

            const handleOrderSubmit = async () => {
                if (isSubmitting || formProblem) return;
                if (customer === null) { openCustomerForm(null); return; } // 未登録なら先に登録してもらう
                setIsSubmitting(true);
                setErrorMsg("");

                const orderItemsString = Object.entries(cart).map(([id, qty]) => {
                    const p = productsData.find(p => p.id === id);
                    return `${p.name} × ${qty}`;
                }).join('\n');

                const payload = {
                    action: "order", 
                    userName: userName,
                    userId: userId,
                    idToken: getIdToken(),
                    orderItems: orderItemsString,
                    deliveryMethod: deliveryMethod,
                    pickupDate: isDelivery ? deliveryDate : pickupDate,
                    pickupTime: isDelivery ? DELIVERY.time : pickupTime,
                    city: isDelivery ? city : "",
                    addressDetail: isDelivery ? addressDetail.trim() : "",
                    phone: isDelivery ? normalizePhone(phone) : "",
                    storeName: storeName.trim(),
                    memo: memo || "なし",
                    totalPrice: cartSummary.grandTotal // 参考値（金額はサーバー側で再計算します）
                };

                try {
                    const res = await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(payload)
                    });
                    const result = await res.json();
                    // ★修正: エラーなのに「完了」と表示される不具合を修正
                    if (!result || result.status !== "success") {
                        setErrorMsg((result && result.message ? String(result.message).replace(/^Error:\s*/, '') : "ご注文を受け付けられませんでした。") );
                        loadProducts(); // 在庫が変わっている可能性があるので再取得
                        return;
                    }

                    try {
                        const prev = JSON.parse(localStorage.getItem('nanairo_delivery') || '{}') || {};
                        const next = { ...prev, storeName: storeName.trim() };
                        if (isDelivery) Object.assign(next, { city, addressDetail: addressDetail.trim(), phone: phone.trim() });
                        localStorage.setItem('nanairo_delivery', JSON.stringify(next));
                    } catch (e) {}
                    setLastOrder({
                        method: deliveryMethod,
                        date: payload.pickupDate,
                        time: payload.pickupTime,
                        address: isDelivery ? city + addressDetail.trim() : "",
                        total: result.totalPrice ?? cartSummary.grandTotal
                    });
                    fetchUserOrders();
                    loadProducts();

                    setShowConfirm(false);
                    setShowComplete(true);
                    setCart({});
                    setMemo("");
                } catch (error) {
                    console.error("送信エラー:", error);
                    setErrorMsg("通信エラーが発生しました。電波の良い場所で、もう一度お試しください。");
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleCancelOrder = async () => {
                if (!cancelTarget || isCancelling) return;
                setIsCancelling(true);
                
                try {
                    const res = await fetch(GAS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            action: "cancelOrder",
                            orderId: cancelTarget.id,
                            userId: userId,
                            idToken: getIdToken()
                        })
                    });
                    const result = await res.json();
                    if (!result || result.status !== "success") {
                        alert((result && result.message ? String(result.message).replace(/^Error:\s*/, '') : "キャンセルできませんでした。") + "\nお手数ですが公式LINEまたはお電話でご連絡ください。");
                        fetchUserOrders();
                        return;
                    }
                    
                    const newOrders = pastOrders.map(o => 
                        o.id === cancelTarget.id ? { ...o, status: 'キャンセル' } : o
                    );
                    setPastOrders(newOrders);
                    localStorage.setItem('nanairo_history', JSON.stringify(newOrders));
                    loadProducts();
                } catch (error) {
                    console.error("キャンセルエラー:", error);
                    alert("通信エラーが発生しました。もう一度お試しください。");
                } finally {
                    setIsCancelling(false);
                    setCancelTarget(null);
                }
            };

            const closeApp = () => {
                if (liff.isInClient()) { liff.closeWindow(); }
            };

            return (
                <div className="app-container" style={{ paddingBottom: 'calc(56px + env(safe-area-inset-bottom))' }}>
                    
                    <header className="sticky top-0 z-20 bg-cream">
                        <div className="flex items-center gap-2 px-4 pt-3 pb-2">
                            <img src="images/logo.png" alt="" className="w-10 h-10 object-contain" />
                            <div>
                                <div className="font-black text-[17px] leading-none text-nanairo-dark">マイクロハーブ</div>
                                <div className="text-xs text-stone-500 mt-0.5">つみたてを、そのままお届け</div>
                            </div>
                            <button type="button" onClick={() => setShowHelp(true)} className="ml-auto flex items-center gap-1 rounded-full bg-white border border-stone-200 px-3 py-1.5 text-xs font-bold text-nanairo-dark shadow-sm"><span className="w-4 h-4 rounded-full bg-nanairo-dark text-white text-[10px] leading-4 text-center">?</span>使い方</button>
                        </div>
                        <div className="rainbow"></div>
                    </header>

                    <main className="flex-1 overflow-y-auto bg-cream px-4 py-4 space-y-4">
                        {activeTab === 'home' ? (
                            <>
                                <p className="text-stone-700 text-[15px] font-bold">{customer ? customer.fullName : userName}さん、こんにちは🌱</p>

                                <div className="bg-nanairo-light rounded-2xl p-3 flex gap-3 items-center">
                                    <div className="w-9 h-9 rounded-full bg-nanairo flex items-center justify-center text-white shrink-0"><Icons.Truck className="w-5 h-5" /></div>
                                    <div className="text-xs text-stone-700 leading-relaxed">
                                        <p className="font-bold text-nanairo-dark text-[13px]">庄内一円にお届けします</p>
                                        <p>毎週{DELIVERY.days.map(d => WEEK[d]).join('・')} {DELIVERY.time.replace('-', '〜')}／<span className="font-bold">¥{DELIVERY.freeThreshold.toLocaleString()}以上で送料無料</span>（未満は¥{DELIVERY.fee}）</p>
                                    </div>
                                </div>

                                <section>
                                    <h3 className="font-black text-stone-800 mb-3">いま買えるマイクロハーブ</h3>
                                    
                                    {loadError && productsData.length === 0 ? (
                                        <div className="text-center py-10 bg-white rounded-2xl border border-stone-200">
                                            <img src="images/logo.png" alt="" className="w-24 h-24 object-contain mx-auto" />
                                            <p className="font-bold text-stone-700 mt-2">うまくつながりませんでした</p>
                                            <p className="text-xs text-stone-500 mt-1">電波の良い場所で、もう一度お試しください。</p>
                                            <button type="button" onClick={() => { setIsLoadingData(true); loadProducts(); }} className="mt-4 bg-nanairo-dark text-white font-bold px-6 py-2.5 rounded-full">もう一度読み込む</button>
                                        </div>
                                    ) : isLoadingData ? (
                                        <div className="flex flex-col items-center justify-center py-20 text-gray-400">
                                            <div className="spinner mb-2 border-l-nanairo-dark"></div>
                                            <p className="text-xs font-bold">商品データを読み込み中...</p>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-2 gap-3 pb-20">
                                            {productsData.map(product => {
                                                const qty = cart[product.id] || 0;
                                                const isLowStock = product.stock > 0 && product.stock <= LOW_STOCK; // 残りわずか
                                                const isSoldOut = product.stock <= 0;

                                                return (
                                                    <div key={product.id} className="bg-white border border-stone-200 rounded-2xl overflow-hidden shadow-[0_2px_0_rgba(15,154,68,.12)] flex flex-col relative">
                                                        <div className="relative h-28 bg-stone-100 cursor-pointer" onClick={() => setDetailProduct(product)}>
                                                            {product.image ? (
                                                                <img src={product.image} alt={product.name} loading="lazy" decoding="async" className={`w-full h-full object-cover ${isSoldOut ? 'grayscale opacity-60' : ''}`} />
                                                            ) : (
                                                                <div className="w-full h-full flex items-center justify-center bg-nanairo-light text-nanairo-dark font-bold text-sm px-2 text-center">{product.name}</div>
                                                            )}
                                                            {isSoldOut && <span className="absolute top-2 left-2 text-xs font-bold bg-stone-700 text-white px-2 py-0.5 rounded-full">また入荷します</span>}
                                                        </div>
                                                        <div className={`p-2.5 flex-1 flex flex-col ${isSoldOut ? 'opacity-60' : ''}`}>
                                                            <h4 onClick={() => setDetailProduct(product)} className="text-[14px] font-bold text-stone-800 leading-tight line-clamp-2 cursor-pointer">{product.name}</h4>
                                                            {product.desc && <p className="text-xs text-stone-500 mt-0.5 leading-snug">{product.desc}</p>}
                                                            <div className="flex justify-between items-end mt-auto pt-1.5">
                                                                <span className="font-black text-stone-900">¥{product.price}</span>
                                                                {isSoldOut ? <span className="text-xs text-stone-500">売り切れ</span>
                                                                    : isLowStock ? <span className="text-xs font-bold text-nanairo-accent">残りわずか {product.stock}</span>
                                                                    : <span className="text-xs text-stone-500">{product.weight}</span>}
                                                            </div>
                                                            <div className="mt-2 h-8">
                                                                {qty === 0 ? (
                                                                    <button onClick={() => setQuantity(product.id, 1)} disabled={isSoldOut} className={`w-full h-full rounded-full text-[13px] font-bold transition-colors ${isSoldOut ? 'bg-stone-200 text-stone-400' : 'bg-nanairo-dark text-white active:opacity-80'}`}>{isSoldOut ? '売り切れ' : 'カートに入れる'}</button>
                                                                ) : (
                                                                    <div className="flex items-center justify-between bg-nanairo-light rounded-full h-full px-0.5">
                                                                        <button onClick={() => updateQuantity(product.id, -1)} className="w-7 h-7 rounded-full bg-white flex items-center justify-center text-nanairo-dark"><Icons.Minus className="w-4 h-4" /></button>
                                                                        <span className="font-bold text-sm text-stone-800">{qty}</span>
                                                                        <button onClick={() => updateQuantity(product.id, 1)} disabled={qty >= product.stock} className={`w-7 h-7 rounded-full flex items-center justify-center text-white ${qty >= product.stock ? 'bg-stone-300' : 'bg-nanairo-dark'}`}><Icons.Plus className="w-4 h-4" /></button>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </section>
                                {LEGAL.ready && <button type="button" onClick={() => setShowLegal(true)} className="block mx-auto text-[11px] text-stone-400 underline pb-24">特定商取引法に基づく表記・個人情報の取り扱い</button>}
                            </>
                        ) : (
                            <div className="pb-20">
                                {(() => {
                                    const today = jstDateStr(0);
                                    // これからのご注文：受取日が今日以降で、キャンセル・お渡し済みでないもの（日付の近い順）
                                    const upcoming = pastOrders.filter(o => o.status !== 'キャンセル' && o.status !== '受渡済' && o.pickupDate >= today)
                                        .sort((a, b) => (a.pickupDate + a.pickupTime).localeCompare(b.pickupDate + b.pickupTime));
                                    const finished = pastOrders.filter(o => !upcoming.includes(o));
                                    const timeText = (o) => o.deliveryMethod === METHOD_DELIVERY ? `${formatJpDate(o.pickupDate)} ${String(o.pickupTime).replace('-', '〜')}頃` : `${formatJpDate(o.pickupDate)} ${String(o.pickupTime).replace('-', '〜')}`;
                                    const itemsText = (o) => (o.itemsList || []).map(i => `${i.name} × ${i.qty}`).join('、');
                                    return (
                                        <>
                                            <div className="flex justify-between items-center mb-2">
                                                <h2 className="font-black text-stone-800">これからのご注文</h2>
                                                {isLoadingHistory && <div className="spinner border-l-nanairo-dark w-4 h-4"></div>}
                                            </div>
                                            {upcoming.length === 0 ? (
                                                <div className="text-center py-8 bg-white rounded-2xl border border-stone-200 mb-5">
                                                    <img src="images/logo.png" alt="" className="w-20 h-20 object-contain mx-auto opacity-80" />
                                                    <p className="text-stone-500 text-sm mt-2">これからのご注文はありません</p>
                                                    <button type="button" onClick={() => setActiveTab('home')} className="mt-3 text-sm font-bold text-nanairo-dark underline">商品を見る</button>
                                                </div>
                                            ) : upcoming.map(order => {
                                                const isDeliv = order.deliveryMethod === METHOD_DELIVERY;
                                                const isCancellable = order.status === '未対応' && order.pickupDate > today; // 前日23:59まで
                                                const steps = ['受付', '準備完了', isDeliv ? 'お届け' : 'お渡し'];
                                                const cur = order.status === '準備完了' ? 1 : 0;
                                                return (
                                                    <div key={order.id} className="bg-white rounded-2xl border border-stone-200 overflow-hidden mb-3">
                                                        <div className={`px-4 py-3 ${isDeliv ? 'bg-blue-50' : 'bg-nanairo-light'}`}>
                                                            <div className={`text-xs font-bold ${isDeliv ? 'text-blue-600' : 'text-nanairo-dark'}`}>{isDeliv ? '🚚 配送' : '🏪 店頭でお受け取り'}</div>
                                                            <div className="text-lg font-black text-stone-800 leading-tight mt-0.5">{timeText(order)}</div>
                                                        </div>
                                                        <div className="px-4 py-3">
                                                            <div className="flex items-center mb-3">
                                                                {steps.map((label, i) => (
                                                                    <React.Fragment key={label}>
                                                                        {i > 0 && <div className={`flex-1 h-0.5 -mt-5 ${i <= cur ? 'bg-nanairo-dark' : 'bg-stone-200'}`}></div>}
                                                                        <div className="flex flex-col items-center w-16">
                                                                            <div className={`w-5 h-5 rounded-full flex items-center justify-center ${i <= cur ? 'bg-nanairo-dark text-white' : 'bg-stone-200 text-stone-400'}`}>{i <= cur ? <Icons.Check className="w-3 h-3" /> : <span className="text-xs">{i + 1}</span>}</div>
                                                                            <span className={`text-xs mt-1 whitespace-nowrap ${i <= cur ? 'text-nanairo-dark font-bold' : 'text-stone-400'}`}>{label}</span>
                                                                        </div>
                                                                    </React.Fragment>
                                                                ))}
                                                            </div>
                                                            <div className="text-sm text-stone-700">{itemsText(order)}</div>
                                                            <div className="flex justify-between items-end mt-1">
                                                                <span className="text-xs text-stone-500">{isDeliv ? '配達時に現金' : 'お受け取り時に現金'}{order.shippingFee > 0 ? `（送料¥${order.shippingFee}込）` : ''}</span>
                                                                <span className="font-black text-stone-900">¥{(order.totalPrice || 0).toLocaleString()}</span>
                                                            </div>
                                                            {isCancellable ? (
                                                                <>
                                                                    <button type="button" onClick={() => setCancelTarget(order)} className="mt-3 w-full rounded-full py-2 border border-red-300 text-red-500 text-sm font-bold active:bg-red-50">キャンセルする</button>
                                                                    <p className="text-xs text-stone-500 text-center mt-1">{formatJpDate(prevDayStr(order.pickupDate))} 23:59 までキャンセルできます</p>
                                                                </>
                                                            ) : (
                                                                <button type="button" onClick={closeApp} className="mt-3 w-full rounded-full py-2 bg-stone-100 text-stone-700 text-sm font-bold">💬 変更・キャンセルはトークで連絡</button>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}

                                            {finished.length > 0 && (
                                                <details className="mt-5 mb-4" open={upcoming.length === 0}>
                                                    <summary className="font-black text-stone-800 mb-2 cursor-pointer">これまでのご注文（{finished.length}件）</summary>
                                                    <div className="bg-white rounded-2xl border border-stone-200 divide-y divide-stone-100">
                                                        {finished.map(order => {
                                                            const isCancelled = order.status === 'キャンセル';
                                                            const label = isCancelled ? 'キャンセル' : order.status === '受渡済' ? (order.deliveryMethod === METHOD_DELIVERY ? 'お届け済み' : 'お受け取り済み') : 'ご注文';
                                                            return (
                                                                <div key={order.id} className={`flex items-center justify-between gap-2 px-4 py-3 ${isCancelled ? 'opacity-50' : ''}`}>
                                                                    <div className="min-w-0">
                                                                        <div className="text-sm font-bold text-stone-800">{formatJpDate(order.pickupDate)} {label}</div>
                                                                        <div className={`text-xs text-stone-500 truncate ${isCancelled ? 'line-through' : ''}`}>{itemsText(order)}　¥{(order.totalPrice || 0).toLocaleString()}</div>
                                                                    </div>
                                                                    {!isCancelled && <button type="button" onClick={() => copyFromHistory(order.itemsList)} className="shrink-0 text-xs font-bold text-nanairo-dark border border-nanairo-dark rounded-full px-3 py-1.5 whitespace-nowrap">もう一度注文</button>}
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </details>
                                            )}

                                            {customer && (
                                                <button type="button" onClick={() => openCustomerForm(customer)} className="w-full text-xs text-stone-500 underline py-2">ご登録情報（{customer.fullName} 様）の変更</button>
                                            )}
                                            <button type="button" onClick={() => setShowHelp(true)} className="w-full text-xs text-stone-500 underline py-2">使い方・よくある質問</button>
                                        </>
                                    );
                                })()}
                            </div>
                        )}
                    </main>

                    {cartSummary.totalItems > 0 && !showConfirm && !showComplete && (
                        <div className="fixed left-0 right-0 mx-auto w-full max-w-[430px] px-4 py-3 z-30 animate-slide-up box-border" style={{ bottom: 'calc(56px + env(safe-area-inset-bottom))' }}>
                            <div className="bg-white/95 rounded-2xl shadow-md px-3 py-2 mb-2 border border-stone-200">
                                {cartSummary.untilFree > 0 ? (
                                    <p className="text-xs text-stone-600">配送なら <b className="text-nanairo-accent">あと¥{cartSummary.untilFree.toLocaleString()}</b> で送料無料</p>
                                ) : (
                                    <p className="text-xs font-bold text-nanairo-dark">🎉 配送の送料が無料になります</p>
                                )}
                                <div className="h-1.5 bg-stone-200 rounded-full mt-1 overflow-hidden"><div className="h-full bg-nanairo rounded-full transition-all" style={{ width: `${Math.min(100, cartSummary.totalPrice / DELIVERY.freeThreshold * 100)}%` }}></div></div>
                            </div>
                            <button key={bumpKey} onClick={() => setShowConfirm(true)} className={`w-full bg-nanairo-dark text-white rounded-full py-3 px-5 flex justify-between items-center font-bold shadow-lg active:opacity-90 transition-opacity ${bumpKey ? 'animate-bump' : ''}`}>
                                <div className="flex items-center gap-2"><Icons.ShoppingCart className="w-5 h-5" /><span>カートを見る</span></div>
                                <div className="flex items-center gap-2"><span className="text-sm font-normal">{cartSummary.totalItems}点</span><span className="text-lg font-black">¥{cartSummary.totalPrice.toLocaleString()}</span></div>
                            </button>
                        </div>
                    )}

                    <div className="fixed bottom-0 left-0 right-0 mx-auto w-full max-w-[430px] bg-white border-t border-stone-200 flex z-20 box-border" style={{ height: 'calc(56px + env(safe-area-inset-bottom))', paddingBottom: 'env(safe-area-inset-bottom)' }}>
                        <button onClick={() => setActiveTab('home')} className={`flex-1 flex flex-col items-center justify-center gap-0.5 ${activeTab === 'home' ? 'text-nanairo-dark' : 'text-stone-400'}`}>
                            <Icons.Store className="w-5 h-5" />
                            <span className="text-xs font-bold">注文する</span>
                        </button>
                        <button onClick={() => setActiveTab('history')} className={`flex-1 flex flex-col items-center justify-center gap-0.5 ${activeTab === 'history' ? 'text-nanairo-dark' : 'text-stone-400'}`}>
                            <Icons.History className="w-5 h-5" />
                            <span className="text-xs font-bold">ご注文</span>
                        </button>
                    </div>

                                        ['お引き渡し時期', 'ご指定のお受け取り日・配送日'],
                                        ['ご注文の締切', 'お受け取り日・配送日の前日 23:59'],
                                        ['キャンセル', '前日 23:59 まで、注文画面の「ご注文」から。それ以降は公式LINEまたはお電話でご連絡ください'],
                                        ['返品・交換', LEGAL.returns],
                                    ].filter(([, v]) => v).map(([k, v]) => <div key={k} className="px-4 py-2.5"><dt className="text-xs font-bold text-stone-500">{k}</dt><dd className="mt-0.5">{v}</dd></div>)}
                                </dl>
                                <h2 className="font-black text-lg text-stone-800 mt-6 mb-3">個人情報の取り扱い</h2>
                                <div className="bg-white rounded-2xl border border-stone-200 p-4 space-y-2 leading-relaxed">
                                    <p>ご登録いただいたお名前・電話番号・店舗名・ご住所・ご注文内容・LINEのユーザー情報は、次の目的にのみ使用します。</p>
                                    <ul className="list-disc pl-5 space-y-1"><li>ご注文の受付・商品のご用意・お届け</li><li>ご注文に関するご連絡（公式LINE・お電話）</li><li>請求書・領収書の発行</li></ul>
                                    <p>法令にもとづく場合を除き、ご本人の同意なく第三者に提供することはありません。情報の確認・訂正・削除をご希望の場合は、上記のお問い合わせ先までご連絡ください。</p>
                                </div>
                                <p className="text-center text-xs text-stone-400 mt-6">{LEGAL.seller}</p>
                            </div>
                        </div>
                    )}

                    {showGuide && !showCustomerForm && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-5 animate-fade-in">
                            <div className="bg-cream rounded-3xl p-5 w-full max-w-[360px] text-center">
                                <img src="images/logo.png" alt="" className="w-24 h-24 object-contain mx-auto" />
                                <h3 className="font-black text-xl text-nanairo-dark mt-1">かんたん3ステップ</h3>
                                <div className="text-left mt-4 space-y-3">
                                    {[['商品を選ぶ', '「カートに入れる」を押します'], ['カートを見る', '画面の下の緑のボタンです'], ['受け取り方法と日時を選ぶ', '「予約する」で完了。LINEにお知らせが届きます']].map(([t, d], i) => (
                                        <div key={t} className="flex gap-3 items-center bg-white rounded-2xl p-3">
                                            <span className="w-8 h-8 rounded-full bg-nanairo-dark text-white font-black flex items-center justify-center shrink-0">{i + 1}</span>
                                            <div><b className="text-stone-800">{t}</b><div className="text-xs text-stone-500">{d}</div></div>
                                        </div>
                                    ))}
                                </div>
                                <p className="text-xs text-stone-500 mt-3">注文の確認・キャンセルは、下の「ご注文」からできます。<br/>困ったときは、右上の「<b>？使い方</b>」をご覧ください。</p>
                                <button type="button" onClick={closeGuide} className="mt-4 w-full rounded-full py-3 bg-nanairo-dark text-white font-bold">はじめる</button>
                            </div>
                        </div>
                    )}

                    {detailProduct && (() => {
                        const p = productsData.find(x => x.id === detailProduct.id) || detailProduct;
                        const qty = cart[p.id] || 0;
                        const soldOut = p.stock <= 0;
                        return (
                            <div className="fixed inset-0 bg-black/50 z-40 flex flex-col justify-end items-center" onClick={() => setDetailProduct(null)}>
                                <div className="bg-cream rounded-t-3xl w-full max-w-[430px] overflow-hidden animate-slide-up" onClick={e => e.stopPropagation()} style={{ paddingBottom: 'calc(16px + env(safe-area-inset-bottom))' }}>
                                    <div className="relative">
                                        {p.image ? <img src={p.image} alt={p.name} className={`w-full h-64 object-cover ${soldOut ? 'grayscale' : ''}`} /> : <div className="w-full h-40 bg-nanairo-light flex items-center justify-center text-nanairo-dark font-bold">{p.name}</div>}
                                        <button type="button" aria-label="閉じる" onClick={() => setDetailProduct(null)} className="absolute top-3 right-3 w-9 h-9 rounded-full bg-white/90 flex items-center justify-center shadow"><Icons.X className="w-5 h-5" /></button>
                                    </div>
                                    <div className="px-5 pt-4">
                                        <h3 className="text-xl font-black text-stone-800">{p.name}</h3>
                                        {p.desc && <p className="text-sm text-stone-600 mt-1">{p.desc}</p>}
                                        <div className="flex items-end justify-between mt-3">
                                            <span className="text-2xl font-black text-stone-900">¥{p.price}<span className="text-sm font-normal text-stone-500 ml-1">（税込）</span></span>
                                            <span className="text-sm text-stone-500">内容量 {p.weight}{p.stock > 0 && p.stock <= LOW_STOCK ? `・残りわずか ${p.stock}` : ''}</span>
                                        </div>
                                        <div className="mt-4 h-12">
                                            {soldOut ? (
                                                <div className="w-full h-full rounded-full bg-stone-200 text-stone-500 font-bold flex items-center justify-center">売り切れ（また入荷します）</div>
                                            ) : qty === 0 ? (
                                                <button type="button" onClick={() => setQuantity(p.id, 1)} className="w-full h-full rounded-full bg-nanairo-dark text-white font-bold">カートに入れる</button>
                                            ) : (
                                                <div className="flex items-center justify-between bg-nanairo-light rounded-full h-full px-1.5">
                                                    <button type="button" onClick={() => updateQuantity(p.id, -1)} className="w-10 h-10 rounded-full bg-white flex items-center justify-center text-nanairo-dark"><Icons.Minus className="w-5 h-5" /></button>
                                                    <span className="font-bold text-lg">カートに {qty}</span>
                                                    <button type="button" onClick={() => updateQuantity(p.id, 1)} disabled={qty >= p.stock} className={`w-10 h-10 rounded-full flex items-center justify-center text-white ${qty >= p.stock ? 'bg-stone-300' : 'bg-nanairo-dark'}`}><Icons.Plus className="w-5 h-5" /></button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {showCustomerForm && (
                        <div className="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white rounded-2xl w-full max-w-[360px] p-5 shadow-xl">
                                <h3 className="text-lg font-bold text-gray-900 mb-1">{customer ? 'ご登録情報の変更' : 'はじめにご登録ください'}</h3>
                                <p className="text-xs text-gray-500 mb-4 leading-relaxed">{customer ? '次回以降のご注文に使われます。' : 'お受け取り・お届けの際の確認に使います。登録は初回だけです。'}</p>
                                <div className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1">お名前（フルネーム） <span className="text-red-500">*</span></label>
                                        <input type="text" value={cfName} onChange={e => setCfName(e.target.value)} maxLength={30} placeholder="例：山田 花子" autoComplete="name" className="block w-full border border-gray-300 rounded-lg p-3 text-base bg-gray-50 outline-none focus:ring-2 focus:ring-nanairo-dark box-border" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1">電話番号 <span className="text-red-500">*</span></label>
                                        <input type="tel" inputMode="tel" value={cfPhone} onChange={e => setCfPhone(e.target.value)} placeholder="090-1234-5678" autoComplete="tel" className="block w-full border border-gray-300 rounded-lg p-3 text-base bg-gray-50 outline-none focus:ring-2 focus:ring-nanairo-dark box-border" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-500 mb-1">店舗名・会社名 <span className="font-normal">（飲食店・法人のお客様）任意</span></label>
                                        <input type="text" value={cfStore} onChange={e => setCfStore(e.target.value)} maxLength={50} placeholder="例：カフェ○○" autoComplete="organization" className="block w-full border border-gray-300 rounded-lg p-3 text-base bg-gray-50 outline-none focus:ring-2 focus:ring-nanairo-dark box-border" />
                                    </div>
                                    <p className="text-xs text-gray-500 leading-relaxed">ご登録いただいた情報は、ご注文の準備・お届け・ご連絡のためにのみ使用します。</p>
                                </div>
                                {cfError && <p role="alert" className="mt-3 text-xs font-bold text-red-600">{cfError}</p>}
                                <div className="flex gap-2 mt-4">
                                    {customer && <button type="button" onClick={() => setShowCustomerForm(false)} disabled={isSavingCustomer} className="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl">閉じる</button>}
                                    <button type="button" onClick={saveCustomer} disabled={isSavingCustomer} className="flex-1 bg-nanairo-dark text-white font-bold py-3 rounded-xl active:bg-green-700 flex justify-center items-center">{isSavingCustomer ? <div className="spinner w-4 h-4"></div> : '登録する'}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {cancelTarget && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white rounded-2xl w-full max-w-[320px] p-5 shadow-xl animate-slide-up">
                                <div className="flex flex-col items-center text-center mb-4">
                                    <div className="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mb-3">
                                        <Icons.AlertCircle className="w-7 h-7" />
                                    </div>
                                    <h3 className="text-lg font-bold text-gray-900 mb-1">注文をキャンセルしますか？</h3>
                                    <p className="text-xs text-gray-500">この操作は元に戻せません。<br/>在庫はシステムに返却されます。</p>
                                </div>
                                
                                <div className="bg-gray-50 rounded-lg p-3 text-xs text-gray-700 font-medium border border-gray-200 mb-5">
                                    <div>{cancelTarget.deliveryMethod === METHOD_DELIVERY ? '配送予定' : '受取予定'}: {formatJpDate(cancelTarget.pickupDate)} {cancelTarget.pickupTime}</div>
                                    <div className="mt-1 line-clamp-2 text-gray-500">
                                        {cancelTarget.itemsList?.map(i => `${i.name}×${i.qty}`).join(', ')}
                                    </div>
                                </div>
                                
                                <div className="flex gap-2">
                                    <button onClick={() => setCancelTarget(null)} disabled={isCancelling} className="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl active:bg-gray-200">
                                        閉じる
                                    </button>
                                    <button onClick={handleCancelOrder} disabled={isCancelling} className="flex-1 bg-red-500 text-white font-bold py-3 rounded-xl active:bg-red-600 flex justify-center items-center gap-2">
                                        {isCancelling ? <div className="spinner border-l-white w-4 h-4"></div> : 'キャンセル'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showComplete && (
                        <div className="fixed inset-0 z-50 flex justify-center bg-cream">
                            <div className="w-full max-w-[430px] bg-cream h-full flex flex-col items-center justify-center p-6 text-center pb-safe">
                                <img src="images/logo.png" alt="" className="w-40 h-40 object-contain -mb-2" />
                                <div className="rainbow w-24 rounded-full mb-5"></div>
                                <h2 className="text-2xl font-black text-nanairo-dark mb-2">ご注文ありがとう！</h2>
                                <p className="text-stone-600 mb-4 text-sm">LINEに内容をお送りしました。</p>
                                {lastOrder && (
                                    <div className="w-full bg-white border border-stone-200 rounded-2xl p-4 text-left text-sm space-y-1.5">
                                        <div className="flex items-center gap-1.5 font-bold text-gray-800">
                                            {lastOrder.method === METHOD_DELIVERY ? <><Icons.Truck className="w-4 h-4 text-nanairo-dark" />配送：{formatJpDate(lastOrder.date)} {lastOrder.time.replace('-', '〜')}頃</> : <><Icons.Store className="w-4 h-4 text-nanairo-dark" />ご来店：{formatJpDate(lastOrder.date)} {lastOrder.time.replace('-', '〜')}</>}
                                        </div>
                                        {lastOrder.address && <div className="text-xs text-gray-600">お届け先：{lastOrder.address}</div>}
                                        <div className="text-xs text-gray-600">お支払い合計：<span className="font-bold text-gray-900">¥{Number(lastOrder.total).toLocaleString()}</span></div>
                                    </div>
                                )}
                                <p className="text-gray-500 mt-4 text-xs leading-relaxed">
                                    {lastOrder && lastOrder.method === METHOD_DELIVERY ? <>配送日時の調整などで、公式LINEから<br/>個別にご連絡する場合があります。</> : 'ご来店をお待ちしております。'}
                                </p>
                                <button onClick={closeApp} className="w-full bg-nanairo-dark text-white rounded-full py-3.5 font-bold text-lg active:opacity-90 mt-8">トーク画面に戻る</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
