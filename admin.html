<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【管理者用】なないろ菜 ダッシュボード</title>
    
    <link rel="apple-touch-icon" href="images/logo.png">
    <link rel="icon" type="image/png" href="images/logo.png">
    
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.9/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // ★ロゴ（カメレオン）の色にそろえる
                        'nanairo': { light: '#EEF5E1', DEFAULT: '#8DC63F', dark: '#0F9A44' },
                        'nanairo-accent': '#f97316',
                        'agency': { light: '#fff7ed', DEFAULT: '#f97316', dark: '#c2410c' },
                        'line': '#06C755'
                    }
                }
            }
        }
    </script>
    
    <style>
        ::-webkit-scrollbar { display: none; }
        body { background-color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        .app-container { max-width: 600px; margin: 0 auto; background-color: #f3f4f6; min-height: 100vh; position: relative; display: flex; flex-direction: column; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-left-color: #fff; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        .spinner-dark { border-color: rgba(0,0,0,0.1); border-left-color: #16a34a; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .rainbow { height: 3px; background: linear-gradient(90deg,#E8412F,#F7931E,#FDD835,#4CB848,#00AEEF,#0F75BC,#A0569F); }

        /* 印刷用スタイル */
        @media print {
            @page { margin: 0; size: auto; } 
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background-color: white; } 
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area { position: absolute; left: 0; top: 0; width: 100%; background-color: white; margin: 0; padding: 0; }
            .no-print { display: none !important; }
            .page-break { page-break-after: always; margin-bottom: 0 !important; border: none !important; }
            .app-container { max-width: 100%; background-color: white; box-shadow: none; }
            
            .receipt-print {
                width: 100%; max-width: 80mm; margin: 0 auto;
                font-family: 'Helvetica Neue', monospace, sans-serif; color: #000;
            }
            .receipt-print * { visibility: visible; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // すべてのアイコンを完全に定義（エラー防止）
        const Icons = {
            Plus: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Minus: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/></svg>,
            Check: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 6 9 17l-5-5"/></svg>,
            Box: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
            ClipboardList: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>,
            TrendingUp: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>,
            Clock: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            User: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            AlertTriangle: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
            ShoppingBag: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>,
            Calendar: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
            RefreshCw: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
            Printer: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>,
            FileText: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>,
            X: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            Award: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>,
            History: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
            MapPin: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>,
            Phone: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>,
            Truck: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 18H3c-.6 0-1-.4-1-1V7c0-.6.4-1 1-1h10c.6 0 1 .4 1 1v11"/><path d="M14 9h4l4 4v4c0 .6-.4 1-1 1h-2"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>,
            Store: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"/></svg>,
            XCircle: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>,
            BarChart: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>,
            PieChart: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>,
            Activity: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        };

        // ★画面に出さない商品（index.html の HIDDEN_PRODUCTS と同じにしてください）
        const HIDDEN_PRODUCTS = ["なないろ菜", "レッドソレル"];

        const GAS_URL = "https://script.google.com/macros/s/AKfycbwv2XISbajDhH03WIIvr9-Br87CGaQcVYKtzk6flCluhncE6rfxlKS0fTN0vdbV5k-H9Q/exec"; 

        const toWareki = (dateStr) => {
            if (!dateStr) return "";
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return `R${d.getFullYear() - 2018}.${d.getMonth() + 1}.${d.getDate()}`;
        };

        function App() {
            // アクティブタブ (orders, inventory, agency, analytics) ※hub(印刷)は非表示
            const [activeTab, setActiveTab] = useState('orders'); 
            
            // データ群
            const [products, setProducts] = useState([]);
            const [orders, setOrders] = useState([]);
            const [analytics, setAnalytics] = useState(null);
            const [stockLogs, setStockLogs] = useState([]); 
            const [agencies, setAgencies] = useState([]);
            const [agencyPrices, setAgencyPrices] = useState([]);
            const [agencyDeliveries, setAgencyDeliveries] = useState([]);
            
            const [isLoadingData, setIsLoadingData] = useState(true);
            const [isFetchingData, setIsFetchingData] = useState(false);

            // メッセージ表示用
            const [message, setMessage] = useState('');
            const showMessage = (text, duration = 4000) => {
                setMessage(text);
                setTimeout(() => setMessage(''), duration);
            };

            // 在庫手動調整用
            const [selectedProductId, setSelectedProductId] = useState('');
            const [type, setType] = useState('add'); 
            const [amount, setAmount] = useState(1);
            const [stockMemo, setStockMemo] = useState(''); 
            const [isSubmitting, setIsSubmitting] = useState(false);
            
            // モーダル・キャンセル関連
            const [showBulkLossModal, setShowBulkLossModal] = useState(false);
            const [isBulkSubmitting, setIsBulkSubmitting] = useState(false);
            const [cancelTargetLog, setCancelTargetLog] = useState(null);
            const [isCancelling, setIsCancelling] = useState(false);
            const [cancelDeliveryTarget, setCancelDeliveryTarget] = useState(null);
            const [cancelInventoryTarget, setCancelInventoryTarget] = useState(null);

            // 期間フィルター
            const todayStr = new Date(Date.now() + 9 * 3600 * 1000).toISOString().split('T')[0]; // ★日本時間
            const todayMonth = todayStr.slice(0, 7);
            const [viewStartMonth, setViewStartMonth] = useState(todayMonth);
            const [viewEndMonth, setViewEndMonth] = useState(todayMonth);

            // UIトグル
            const [isPastOrdersOpen, setIsPastOrdersOpen] = useState(false);
            const [showAllProductsModal, setShowAllProductsModal] = useState(false);
            const [showAllCustomersModal, setShowAllCustomersModal] = useState(false);
            const [searchCustomer, setSearchCustomer] = useState("");
            const [showCustomerModal, setShowCustomerModal] = useState(null); 
            const [chartType, setChartType] = useState('line');
            const [insights, setInsights] = useState(null); // ★分析強化
            const [trendHover, setTrendHover] = useState(null);
            const [showTrendTable, setShowTrendTable] = useState(false);

            // 印刷・月次請求書用
            const [printOrders, setPrintOrders] = useState([]); 
            const [printType, setPrintType] = useState('invoice'); 
            const [printName, setPrintName] = useState(''); 
            const [printHonorific, setPrintHonorific] = useState('御中');
            const [reportStartDate, setReportStartDate] = useState('');
            const [reportEndDate, setReportEndDate] = useState('');
            const [reportClosingDate, setReportClosingDate] = useState('');

            // 委託販売用のState
            const [selectedAgencyId, setSelectedAgencyId] = useState('');
            const [deliveryDate, setDeliveryDate] = useState(todayStr); 
            const [deliveryCart, setDeliveryCart] = useState({});
            const [isSubmittingDelivery, setIsSubmittingDelivery] = useState(false);
            const [inventoryModal, setInventoryModal] = useState(null); 
            const [invSalesQty, setInvSalesQty] = useState(0);
            const [invLossQty, setInvLossQty] = useState(0);

            // ★管理者パスワード（この端末にだけ保存。GASでハッシュ照合します）
            const readSavedKey = () => { try { return localStorage.getItem('nanairo_admin_key') || ''; } catch (e) { return ''; } };
            const [adminKey, setAdminKey] = useState(readSavedKey);
            const adminKeyRef = React.useRef(adminKey);
            adminKeyRef.current = adminKey;
            const getAdminKey = () => adminKeyRef.current;
            const [loginInput, setLoginInput] = useState('');
            const [loginError, setLoginError] = useState('');
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const logout = (msg) => {
                try { localStorage.removeItem('nanairo_admin_key'); } catch (e) {}
                setAdminKey(''); setIsLoadingData(true); setLoginError(msg || '');
            };
            const handleLogin = async (e) => {
                e.preventDefault();
                if (!loginInput || isLoggingIn) return;
                setIsLoggingIn(true); setLoginError('');
                try {
                    const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "checkAdmin", adminKey: loginInput }) });
                    const d = await res.json();
                    if (d.status === 'success') {
                        try { localStorage.setItem('nanairo_admin_key', loginInput); } catch (e) {}
                        adminKeyRef.current = loginInput;
                        setAdminKey(loginInput); setLoginInput('');
                    } else setLoginError('パスワードが違います。');
                } catch (err) { setLoginError('通信エラーが発生しました。'); }
                finally { setIsLoggingIn(false); }
            };

            // ★管理用の送信。GASがエラーを返したら例外にする（失敗したのに「記録しました」と出さないため）
            const postAdmin = async (body) => {
                const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ ...body, adminKey: getAdminKey() }) });
                let data = null;
                try { data = await res.json(); } catch (e) { throw new Error('サーバーからの応答を読み取れませんでした'); }
                if (data && data.message === 'AUTH_REQUIRED') {
                    logout('パスワードが変更されたか、正しくありません。もう一度入力してください。');
                    throw new Error('ログインし直してください');
                }
                if (!data || data.status === 'error') throw new Error(String((data && data.message) || '処理に失敗しました').replace(/^Error:\s*/, ''));
                return data;
            };

            const fetchData = async (startMonth, endMonth) => {
                if (!adminKeyRef.current) { setIsLoadingData(false); return; }
                setIsFetchingData(true);
                try {
                    const response = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "getAdminData", adminKey: getAdminKey(), month: startMonth, endMonth: endMonth }) });
                    const data = await response.json();
                    if (data.message === 'AUTH_REQUIRED') return logout('パスワードが変更されたか、正しくありません。もう一度入力してください。');
                    if (data.status === 'error') return showMessage("データの取得に失敗しました。");
                    
                    if (data.products) setProducts(data.products.filter(p => !HIDDEN_PRODUCTS.includes(p.name)));
                    if (data.orders) setOrders(data.orders);
                    if (data.analytics) setAnalytics(data.analytics);
                    setInsights(data.insights || null);
                    if (data.stockLogs) setStockLogs(data.stockLogs);
                    if (data.agencies) setAgencies(data.agencies);
                    if (data.agencyPrices) setAgencyPrices(data.agencyPrices);
                    if (data.agencyDeliveries) setAgencyDeliveries(data.agencyDeliveries);
                } catch (error) {
                    console.error("通信エラー:", error);
                } finally {
                    setIsLoadingData(false); setIsFetchingData(false);
                }
            };

            useEffect(() => {
                if (viewStartMonth > viewEndMonth) setViewEndMonth(viewStartMonth);
                fetchData(viewStartMonth, viewEndMonth);
            }, [viewStartMonth, viewEndMonth, adminKey]);

            const handleRefresh = () => fetchData(viewStartMonth, viewEndMonth);

            const handleActionClick = (productId, actionType) => {
                setSelectedProductId(productId); setType(actionType); setAmount(1); setStockMemo(''); 
                setTimeout(() => {
                    const formEl = document.getElementById('manual-input-form');
                    if (formEl) window.scrollTo({ top: formEl.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' });
                }, 50);
            };

            const handleSubmitStock = async () => {
                if (!selectedProductId) return showMessage("商品を選択してください");
                setIsSubmitting(true);
                try {
                    await postAdmin({ action: "stockUpdate", productId: selectedProductId, type: type, amount: amount, memo: stockMemo });
                    const actionName = type === 'add' ? '収穫(追加)' : type === 'sale' ? '店頭販売' : 'ロス(破棄)';
                    showMessage(`${amount}件の「${actionName}」を記録しました！`);
                    fetchData(viewStartMonth, viewEndMonth); setAmount(1); setStockMemo(''); 
                } catch(error) { showMessage("記録できませんでした: " + error.message, 6000); } 
                finally { setIsSubmitting(false); }
            };

            const handleBulkLoss = async () => {
                setIsBulkSubmitting(true);
                try {
                    await postAdmin({ action: "bulkLoss" });
                    showMessage(`現在在庫がある全商品を一括でロス(破棄)にしました！`);
                    fetchData(viewStartMonth, viewEndMonth);
                } catch(error) { showMessage("一括ロスを記録できませんでした: " + error.message, 6000); } 
                finally { setIsBulkSubmitting(false); setShowBulkLossModal(false); }
            };

            const handleCancelStockLog = async () => {
                if (!cancelTargetLog || isCancelling) return;
                setIsCancelling(true);
                try {
                    await postAdmin({ action: "cancelStockLog", rowIndex: cancelTargetLog.rowIndex });
                    showMessage(`記録を取り消し、在庫を元に戻しました。`); fetchData(viewStartMonth, viewEndMonth);
                } catch(error) { showMessage("取消エラー: " + error.message, 6000); } 
                finally { setIsCancelling(false); setCancelTargetLog(null); }
            };

            const toggleOrderStatus = async (orderId, currentStatus) => {
                if(currentStatus === 'キャンセル') return; 
                const nextStatus = currentStatus === '未対応' ? '準備完了' : currentStatus === '準備完了' ? '受渡済' : '未対応';
                setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: nextStatus } : o));
                try {
                    await postAdmin({ action: "statusUpdate", orderId: orderId, newStatus: nextStatus });
                    fetchData(viewStartMonth, viewEndMonth);
                } catch(error) {
                    showMessage("ステータス更新に失敗しました: " + error.message, 6000);
                    setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: currentStatus } : o));
                }
            };

            const toggleCheck = async (orderId, role, isChecked) => {

            const renderAnalyticsTab = () => {
                const formatMonth = (m) => m ? m.replace('-', '年') + '月' : '';
                const isSingleMonth = viewStartMonth === viewEndMonth;
                const periodText = isSingleMonth ? formatMonth(viewStartMonth) : `${formatMonth(viewStartMonth)} 〜 ${formatMonth(viewEndMonth)}`;

                const anData = analytics || {};
                const topCustomers = anData.topCustomers || [];
                const I = insights;
                const yen = (n) => `¥${Math.round(Number(n || 0)).toLocaleString()}`;
                const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
                // 系列の色（識別用・固定順）：LINE注文 / 店頭販売 / 委託
                const CH = [
                    { key: 'line', label: 'LINE注文', color: '#16a34a' },
                    { key: 'store', label: '店頭販売', color: '#2563eb' },
                    { key: 'agency', label: '委託', color: '#f97316' }
                ];

                const Delta = ({ cur, prev, unit = '%', inverse = false, pt = false }) => {
                    if (prev == null || cur == null || (!pt && !prev)) return <span className="text-[10px] text-gray-400">前期比 —</span>;
                    const d = pt ? (cur - prev) : Math.round((cur - prev) / prev * 100);
                    if (d === 0) return <span className="text-[10px] text-gray-500">前期比 ±0{pt ? 'pt' : unit}</span>;
                    const good = inverse ? d < 0 : d > 0;
                    return <span className={`text-[10px] font-bold ${good ? 'text-green-700' : 'text-red-600'}`}>{d > 0 ? '▲' : '▼'} {Math.abs(d)}{pt ? 'pt' : unit} <span className="font-normal text-gray-500">前期比</span></span>;
                };

                const Kpi = ({ label, value, sub, children, tone }) => (
                    <div className={`p-3.5 rounded-xl border shadow-sm ${tone === 'bad' ? 'bg-red-50/60 border-red-200' : 'bg-white border-gray-200'}`}>
                        <div className={`text-[11px] font-bold mb-1 ${tone === 'bad' ? 'text-red-700' : 'text-gray-500'}`}>{label}</div>
                        <div className={`text-xl font-bold tracking-tight ${tone === 'bad' ? 'text-red-800' : 'text-gray-900'}`}>{value}</div>
                        {sub && <div className="text-[10px] text-gray-500 mt-0.5">{sub}</div>}
                        <div className="mt-1">{children}</div>
                    </div>
                );

                const header = (
                    <>
                        <div className="flex justify-between items-center mb-4">
                            <div className="flex flex-wrap items-center gap-2 bg-white px-3 py-2 rounded-lg border border-gray-200 shadow-sm w-fit">
                                <Icons.Calendar className="w-4 h-4 text-gray-500" />
                                <input type="month" value={viewStartMonth} onChange={(e) => setViewStartMonth(e.target.value)} className="bg-transparent font-bold text-gray-700 outline-none text-sm cursor-pointer w-24" />
                                <span className="text-gray-400 font-bold">〜</span>
                                <input type="month" value={viewEndMonth} onChange={(e) => setViewEndMonth(e.target.value)} className="bg-transparent font-bold text-gray-700 outline-none text-sm cursor-pointer w-24" />
                            </div>
                            <button type="button" onClick={handleRefresh} disabled={isFetchingData} className="p-2 bg-white rounded-full shadow-sm text-gray-500 active:bg-gray-100">
                                <Icons.RefreshCw className={`w-5 h-5 ${isFetchingData ? 'animate-spin' : ''}`} />
                            </button>
                        </div>
                        <div className="flex justify-between items-end border-l-4 border-blue-600 pl-2">
                            <h1 className="text-xl font-bold text-gray-800">経営ダッシュボード</h1>
                            <span className="text-xs font-bold text-gray-500">{periodText}{I ? `（前期：${formatMonth(I.period.prevStart)}${I.period.prevStart !== I.period.prevEnd ? '〜' + formatMonth(I.period.prevEnd) : ''}）` : ''}</span>
                        </div>
                    </>
                );

                if (!I) {
                    return (
                        <div className="animate-slide-up space-y-5 relative z-10">
                            {header}
                            <div className="bg-yellow-50 border border-yellow-200 rounded-xl p-4 text-sm text-yellow-800">分析データがありません。GASを最新版に更新（新バージョンでデプロイ）してから、右上の更新ボタンを押してください。</div>
                        </div>
                    );
                }

                const C = I.current, P = I.previous;
                const products = I.products || [];
                const reduceList = products.filter(p => p.action === 'reduce').sort((a, b) => b.lossAmount - a.lossAmount);
                const increaseList = products.filter(p => p.action === 'increase');
                // 推奨どおりに収穫した場合の、月あたりのロス削減見込み（販売価格ベース）
                const monthlySaving = Math.round(reduceList.reduce((a, p) => a + Math.max(0, p.weeklyHarvest - p.suggestedWeekly) * p.price, 0) * 4.3);
                const wd = I.weekday || [];
                const wdTotal = wd.reduce((a, w) => a + w.sales, 0);
                const wdTop = wd.length ? [...wd].sort((a, b) => b.sales - a.sales)[0] : null;
                const followUp = I.customers.followUp || [];

                // --- 気づき（自動コメント） ---
                const notes = [];
                if (C.lossAmount > 0 && C.sales > 0 && C.lossAmount >= C.sales * 0.3) {
                    notes.push({ tone: 'bad', title: `廃棄額 ${yen(C.lossAmount)} は売上の ${Math.round(C.lossAmount / C.sales * 100)}% です`, body: `収穫した ${C.harvest}P のうち ${C.loss}P（${C.lossRate}%）が廃棄。売上を伸ばすより、収穫量を合わせるほうが早く利益が改善します。` });
                }
                if (reduceList.length > 0) {
                    notes.push({ tone: 'action', title: `収穫を減らす候補：${reduceList.slice(0, 3).map(p => p.name).join('・')}${reduceList.length > 3 ? ` ほか${reduceList.length - 3}品` : ''}`, body: `下の「収穫の最適化」の推奨量に合わせると、廃棄を月あたり約 ${yen(monthlySaving)} 減らせる見込みです（販売価格ベース）。` });
                }
                if (increaseList.length > 0) {
                    notes.push({ tone: 'good', title: `品切れ気味：${increaseList.map(p => p.name).join('・')}`, body: 'ほぼ完売しています。収穫を少し増やすと売上が伸びる可能性があります。' });
                }
                if (P.sales > 0) {
                    const d = Math.round((C.sales - P.sales) / P.sales * 100);
                    notes.push({ tone: d >= 0 ? 'good' : 'info', title: `売上は前期比 ${d >= 0 ? '+' : ''}${d}%（${yen(P.sales)} → ${yen(C.sales)}）`, body: `内訳：店頭 ${yen(C.store)} ／ LINE ${yen(C.line)} ／ 委託 ${yen(C.agency)}${I.period.end === I.period.today.slice(0, 7) ? '　※今月は途中経過です' : ''}` });
                }
                if (wdTop && wdTotal > 0) {
                    notes.push({ tone: 'info', title: `いちばん売れる曜日は ${WEEK[wdTop.day]}曜（売上の ${Math.round(wdTop.sales / wdTotal * 100)}%）`, body: '収穫はこの曜日の前日〜当日に合わせると、鮮度も廃棄も改善しやすくなります。' });
                }
                if (followUp.length > 0) {
                    notes.push({ tone: 'action', title: `${followUp.length}名のお客様が しばらく注文していません`, body: '下の「要フォロー」から、公式LINEで新商品や配送開始のお知らせを送るのがおすすめです。' });
                }
                const noteStyle = { bad: 'border-red-200 bg-red-50', action: 'border-blue-200 bg-blue-50', good: 'border-green-200 bg-green-50', info: 'border-gray-200 bg-gray-50' };
                const noteIcon = { bad: <Icons.AlertTriangle className="w-4 h-4 text-red-600" />, action: <Icons.ClipboardList className="w-4 h-4 text-blue-600" />, good: <Icons.TrendingUp className="w-4 h-4 text-green-700" />, info: <Icons.Activity className="w-4 h-4 text-gray-500" /> };

                // --- 12か月推移チャート（SVG） ---
                // データが始まる前の空の月は表示しない
                const allMonths = I.monthly || [];
                const firstIdx = allMonths.findIndex(m => m.line + m.store + m.agency + m.lossAmount + m.harvest > 0);
                const months = firstIdx > 0 ? allMonths.slice(firstIdx) : allMonths;
                const W = 360, H = 190, padL = 38, padR = 8, padT = 14, padB = 26;
                const maxY = Math.max(1000, ...months.map(m => Math.max(m.line + m.store + m.agency, m.lossAmount)));
                const niceStep = (() => { const raw = maxY / 4; const pow = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / pow; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * pow; })();
                const yMax = niceStep * Math.ceil(maxY / niceStep);
                const yOf = v => padT + (H - padT - padB) * (1 - v / yMax);
                const slot = (W - padL - padR) / Math.max(1, months.length);
                const barW = Math.min(18, slot * 0.6);
                const xOf = i => padL + slot * i + slot / 2;
                const ticks = []; for (let v = 0; v <= yMax; v += niceStep) ticks.push(v);
                const shortYen = v => v >= 10000 ? `${(v / 10000).toFixed(v % 10000 ? 1 : 0)}万` : v.toLocaleString();
                const lossPath = months.map((m, i) => `${i ? 'L' : 'M'}${xOf(i).toFixed(1)},${yOf(m.lossAmount).toFixed(1)}`).join(' ');
                const hoverM = trendHover != null ? months[trendHover] : null;

                // --- 商品の並び：減らす → 増やす → 適正、各グループ内は廃棄額順 ---
                const order = { reduce: 0, increase: 1, keep: 2 };
                const productRows = [...products].sort((a, b) => (order[a.action] - order[b.action]) || (b.lossAmount - a.lossAmount));
                const actionBadge = {
                    reduce: <span className="inline-flex items-center gap-0.5 text-[10px] font-bold text-red-700 bg-red-50 border border-red-200 rounded px-1.5 py-0.5">▼ 減らす</span>,
                    increase: <span className="inline-flex items-center gap-0.5 text-[10px] font-bold text-green-700 bg-green-50 border border-green-200 rounded px-1.5 py-0.5">▲ 増やす</span>,
                    keep: <span className="inline-flex items-center gap-0.5 text-[10px] font-bold text-gray-600 bg-gray-50 border border-gray-200 rounded px-1.5 py-0.5">● 適正</span>
                };
                const wdMax = Math.max(1, ...wd.map(w => w.sales));

                return (
                    <div className="animate-slide-up space-y-5 relative z-10">
                        {header}

                        {/* ① KPI */}
                        <div className="grid grid-cols-2 gap-3">
                            <Kpi label="売上合計（税込）" value={yen(C.sales)} sub={`店頭 ${yen(C.store)}・LINE ${yen(C.line)}・委託 ${yen(C.agency)}`}><Delta cur={C.sales} prev={P.sales} /></Kpi>
                            <Kpi label="販売数" value={<>{C.qty.toLocaleString()} <span className="text-sm font-normal text-gray-500">P</span></>} sub={`収穫 ${C.harvest}P に対して`}><Delta cur={C.qty} prev={P.qty} /></Kpi>
                            <Kpi label="販売率（売れた割合）" value={C.sellThrough == null ? '—' : `${C.sellThrough}%`} sub="販売数 ÷ 収穫数"><Delta cur={C.sellThrough} prev={P.sellThrough} pt /></Kpi>
                            <Kpi label="廃棄額（販売価格換算）" tone={C.sales > 0 && C.lossAmount >= C.sales * 0.3 ? 'bad' : undefined} value={yen(C.lossAmount)} sub={`${C.loss}P・収穫の ${C.lossRate ?? '—'}%`}><Delta cur={C.lossAmount} prev={P.lossAmount} inverse /></Kpi>
                            <Kpi label="LINE注文" value={<>{C.lineOrders} <span className="text-sm font-normal text-gray-500">件</span></>} sub={`平均 ${yen(C.avgLineOrder)} ／ 配送 ${C.delivery}件・店頭 ${C.pickup}件`}><Delta cur={C.lineOrders} prev={P.lineOrders} /></Kpi>
                            <Kpi label="店頭販売" value={<>{C.storeTx} <span className="text-sm font-normal text-gray-500">回</span></>} sub={`1回あたり ${yen(C.storeTx ? C.store / C.storeTx : 0)}`}><Delta cur={C.storeTx} prev={P.storeTx} /></Kpi>
                        </div>

                        {/* ② 気づき */}
                        {notes.length > 0 && (
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                                <h3 className="font-bold text-gray-800 text-sm mb-3 flex items-center gap-2"><Icons.Award className="w-4 h-4 text-blue-600" /> 今期の気づき・打ち手</h3>
                                <div className="space-y-2">
                                    {notes.map((n, i) => (
                                        <div key={i} className={`rounded-lg border p-3 ${noteStyle[n.tone]}`}>
                                            <div className="flex items-start gap-2"><span className="mt-0.5 shrink-0">{noteIcon[n.tone]}</span><div><div className="text-sm font-bold text-gray-900 leading-snug">{n.title}</div><div className="text-[11px] text-gray-600 mt-1 leading-relaxed">{n.body}</div></div></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ③ 12か月推移 */}
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                            <div className="flex justify-between items-center mb-2">
                                <h3 className="font-bold text-gray-800 text-sm">売上と廃棄の推移（月別）</h3>
                                <button type="button" onClick={() => setShowTrendTable(!showTrendTable)} className="text-[11px] font-bold text-blue-600">{showTrendTable ? 'グラフで見る' : '表で見る'}</button>
                            </div>
                            <div className="flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-gray-700 mb-2">
                                {CH.map(c => <span key={c.key} className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm" style={{ background: c.color }}></span>{c.label}</span>)}
                                <span className="flex items-center gap-1"><svg width="16" height="6"><line x1="0" y1="3" x2="16" y2="3" stroke="#6b7280" strokeWidth="2" strokeDasharray="4 2" /></svg>廃棄額</span>
                            </div>
                            {showTrendTable ? (
                                <div className="overflow-x-auto">
                                    <table className="w-full text-[11px] text-right">
                                        <thead className="text-gray-500"><tr><th className="text-left py-1">月</th><th>店頭</th><th>LINE</th><th>委託</th><th>合計</th><th>廃棄額</th></tr></thead>
                                        <tbody>{months.map(m => (<tr key={m.month} className="border-t border-gray-100"><td className="text-left py-1 font-bold">{m.month.slice(2).replace('-', '/')}</td><td>{m.store.toLocaleString()}</td><td>{m.line.toLocaleString()}</td><td>{m.agency.toLocaleString()}</td><td className="font-bold">{(m.store + m.line + m.agency).toLocaleString()}</td><td className="text-gray-500">{m.lossAmount.toLocaleString()}</td></tr>))}</tbody>
                                    </table>
                                </div>
                            ) : (
                                <div className="relative">
                                    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img" aria-label="直近12か月の月別売上（チャネル別）と廃棄額の推移">
                                        {ticks.map(v => (<g key={v}><line x1={padL} x2={W - padR} y1={yOf(v)} y2={yOf(v)} stroke="#e5e7eb" strokeWidth="1" /><text x={padL - 4} y={yOf(v) + 3} textAnchor="end" fontSize="9" fill="#6b7280">{shortYen(v)}</text></g>))}
                                        {months.map((m, i) => {
                                            let acc = 0;
                                            const segs = CH.map(c => { const v = m[c.key]; const y0 = yOf(acc), y1 = yOf(acc + v); acc += v; return { c, v, y: y1, h: Math.max(0, y0 - y1) }; }).filter(sg => sg.v > 0);
                                            return (
                                                <g key={m.month} onMouseEnter={() => setTrendHover(i)} onMouseLeave={() => setTrendHover(null)} onClick={() => setTrendHover(trendHover === i ? null : i)} style={{ cursor: 'pointer' }}>
                                                    <rect x={xOf(i) - slot / 2} y={padT} width={slot} height={H - padT - padB} fill={trendHover === i ? '#f3f4f6' : 'transparent'} />
                                                    {segs.map((sg, k) => {
                                                        const isTop = k === segs.length - 1;
                                                        // 2pxの隙間で積み上げを区切り、いちばん上だけ角を丸める
                                                        const h = Math.max(0, sg.h - (k > 0 ? 2 : 0));
                                                        return isTop
                                                            ? <path key={sg.c.key} d={`M${xOf(i) - barW / 2},${sg.y + h} V${sg.y + Math.min(3, h)} Q${xOf(i) - barW / 2},${sg.y} ${xOf(i) - barW / 2 + 3},${sg.y} H${xOf(i) + barW / 2 - 3} Q${xOf(i) + barW / 2},${sg.y} ${xOf(i) + barW / 2},${sg.y + Math.min(3, h)} V${sg.y + h} Z`} fill={sg.c.color} />
                                                            : <rect key={sg.c.key} x={xOf(i) - barW / 2} y={sg.y} width={barW} height={h} fill={sg.c.color} />;
                                                    })}
                                                    <text x={xOf(i)} y={H - padB + 12} textAnchor="middle" fontSize="9" fill={m.month.endsWith('-01') ? '#374151' : '#6b7280'} fontWeight={m.month.endsWith('-01') ? 'bold' : 'normal'}>{m.month.endsWith('-01') ? m.month.slice(2, 4) + '/1' : Number(m.month.slice(5)) + '月'}</text>
                                                </g>
                                            );
                                        })}
                                        <path d={lossPath} fill="none" stroke="#6b7280" strokeWidth="2" strokeDasharray="4 3" pointerEvents="none" />
                                        {months.map((m, i) => m.lossAmount > 0 && <circle key={i} cx={xOf(i)} cy={yOf(m.lossAmount)} r="3" fill="#fff" stroke="#6b7280" strokeWidth="2" pointerEvents="none" />)}
                                        <line x1={padL} x2={W - padR} y1={yOf(0)} y2={yOf(0)} stroke="#9ca3af" strokeWidth="1" />
                                    </svg>
                                    {hoverM && (
                                        <div className={`absolute top-0 ${trendHover > months.length / 2 - 1 ? 'left-10' : 'right-0'} bg-gray-900/95 text-white text-[11px] rounded-lg px-3 py-2 shadow-lg pointer-events-none`}>
                                            <div className="font-bold mb-1">{hoverM.month.replace('-', '年')}月</div>
                                            {CH.map(c => <div key={c.key} className="flex justify-between gap-4"><span className="flex items-center gap-1"><span className="w-2 h-2 rounded-sm" style={{ background: c.color }}></span>{c.label}</span><span>{yen(hoverM[c.key])}</span></div>)}
                                            <div className="flex justify-between gap-4 border-t border-white/20 mt-1 pt-1 font-bold"><span>合計</span><span>{yen(hoverM.line + hoverM.store + hoverM.agency)}</span></div>
                                            <div className="flex justify-between gap-4 text-gray-300"><span>廃棄額</span><span>{yen(hoverM.lossAmount)}</span></div>
                                        </div>
                                    )}
                                </div>
                            )}
                            <p className="text-[10px] text-gray-500 mt-1">棒グラフをタップすると内訳が出ます。廃棄額が売上の棒を上回る月は、収穫しすぎのサインです。</p>
                        </div>

                        {/* ④ 収穫の最適化 */}
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                            <h3 className="font-bold text-gray-800 text-sm mb-1">商品別 収穫の最適化</h3>
                            <p className="text-[10px] text-gray-500 mb-3">推奨収穫量 ＝ 週平均の販売数 × 1.15（品切れを防ぐ15%の余裕）。バーは収穫量の内訳（<span className="text-green-700 font-bold">販売</span>／<span className="text-gray-600 font-bold">廃棄</span>／残り）です。</p>
                            <div className="space-y-3">
                                {productRows.map(p => {
                                    const soldPct = p.harvest ? Math.min(100, p.sold / p.harvest * 100) : 0;
                                    const lossPct = p.harvest ? Math.min(100 - soldPct, p.loss / p.harvest * 100) : 0;
                                    return (
                                        <div key={p.id} className="border-b border-gray-100 pb-3 last:border-0 last:pb-0">
                                            <div className="flex justify-between items-center mb-1.5 gap-2">
                                                <div className="flex items-center gap-1.5 min-w-0"><span className="text-sm font-bold text-gray-800 truncate">{p.name}</span>{actionBadge[p.action]}</div>
                                                <div className="text-[11px] text-gray-500 shrink-0">売上 <span className="font-bold text-gray-800">{yen(p.sales)}</span></div>
                                            </div>
                                            <div className="w-full h-2.5 rounded-full bg-gray-100 overflow-hidden flex gap-[2px]" title={`販売 ${p.sold}P / 廃棄 ${p.loss}P / 収穫 ${p.harvest}P`}>
                                                {soldPct > 0 && <div className="h-full bg-green-600 rounded-l-full" style={{ width: `${soldPct}%` }}></div>}
                                                {lossPct > 0 && <div className="h-full bg-gray-400" style={{ width: `${lossPct}%` }}></div>}
                                            </div>
                                            <div className="flex justify-between items-center mt-1.5 text-[11px] text-gray-600">
                                                <span>販売率 <span className="font-bold text-gray-900">{p.sellThrough ?? '—'}%</span>・廃棄 {p.loss}P（{yen(p.lossAmount)}）</span>
                                                <span className="shrink-0">週 <span className="font-bold">{p.weeklyHarvest}P</span> → 推奨 <span className={`font-bold ${p.action === 'reduce' ? 'text-red-700' : p.action === 'increase' ? 'text-green-700' : 'text-gray-900'}`}>{p.suggestedWeekly}P</span></span>
                                            </div>
                                        </div>
                                    );
                                })}
                                {productRows.length === 0 && <p className="text-sm text-gray-500 text-center py-4">データがありません</p>}
                            </div>
                        </div>

                        {/* ⑤ 曜日別 */}
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                            <h3 className="font-bold text-gray-800 text-sm mb-1">曜日別の売上（店頭販売＋LINE注文）</h3>
                            <p className="text-[10px] text-gray-500 mb-3">店頭は記録した日、LINEは受取日で集計しています。</p>
                            <div className="flex items-end gap-2 h-28">
                                {[1, 2, 3, 4, 5, 6, 0].map(d => {
                                    const w = wd[d] || { sales: 0, qty: 0 };
                                    const isTop = wdTop && d === wdTop.day && w.sales > 0;
                                    return (
                                        <div key={d} className="flex-1 flex flex-col items-center justify-end h-full" title={`${WEEK[d]}曜 ${yen(w.sales)}（${w.qty}P）`}>
                                            <span className={`text-[10px] mb-0.5 ${isTop ? 'font-bold text-gray-900' : 'text-gray-500'}`}>{w.sales ? shortYen(w.sales) : ''}</span>
                                            <div className={`w-full max-w-[28px] rounded-t ${isTop ? 'bg-blue-600' : 'bg-blue-300'}`} style={{ height: `${Math.max(w.sales ? 4 : 0, w.sales / wdMax * 80)}%` }}></div>
                                            <span className={`text-[11px] mt-1 ${d === 1 ? 'text-gray-400' : 'text-gray-700'} font-bold`}>{WEEK[d]}</span>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* ⑥ 顧客 */}
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                            <h3 className="font-bold text-gray-800 text-sm mb-3">LINE顧客の状況</h3>
                            <div className="grid grid-cols-3 gap-2 mb-4 text-center">
                                <div className="bg-gray-50 rounded-lg p-2"><div className="text-[10px] text-gray-500 font-bold">累計顧客</div><div className="text-lg font-bold text-gray-900">{I.customers.total}<span className="text-xs font-normal">人</span></div></div>
                                <div className="bg-gray-50 rounded-lg p-2"><div className="text-[10px] text-gray-500 font-bold">今期 注文者</div><div className="text-lg font-bold text-gray-900">{I.customers.active}<span className="text-xs font-normal">人</span></div><div className="text-[10px] text-gray-500">うち新規 {I.customers.newCount}</div></div>
                                <div className="bg-gray-50 rounded-lg p-2"><div className="text-[10px] text-gray-500 font-bold">リピート率</div><div className="text-lg font-bold text-gray-900">{I.customers.repeatRate}<span className="text-xs font-normal">%</span></div><div className="text-[10px] text-gray-500">2回以上 {I.customers.repeaters}人</div></div>
                            </div>
                            <div className="text-xs font-bold text-gray-700 mb-2">要フォロー（しばらく注文がないお客様）</div>
                            {followUp.length > 0 ? (
                                <div className="space-y-1.5">
                                    {followUp.map(c => (
                                        <div key={c.id} className="flex justify-between items-center bg-orange-50/50 border border-orange-100 rounded-lg px-3 py-2">
                                            <div><div className="text-sm font-bold text-gray-800">{c.name} 様</div><div className="text-[10px] text-gray-500">注文 {c.orders}回・累計 {yen(c.spend)}{c.avgGapDays ? `・いつもは${c.avgGapDays}日ごと` : ''}</div></div>
                                            <div className="text-right"><div className="text-sm font-bold text-orange-700">{c.daysSince}日</div><div className="text-[10px] text-gray-500">前が最後</div></div>
                                        </div>
                                    ))}
                                </div>
                            ) : <p className="text-xs text-gray-500 bg-gray-50 rounded-lg p-3">該当なし。みなさん定期的に注文されています。</p>}
                        </div>

                        <div className="bg-white p-4 rounded-xl shadow-sm border border-yellow-200">
                            <h3 className="font-bold text-gray-800 text-sm mb-3 flex items-center gap-2"><Icons.Award className="w-4 h-4 text-yellow-500"/> LINE優良顧客ランキング</h3>
                            <p className="text-[10px] text-gray-500 mb-3">※店頭販売分はここには含まれません。リストをタップすると「購入カルテ・請求明細書」が開きます。</p>
                            <div className="space-y-2">
                                {topCustomers.length > 0 ? (
                                    <>
                                        {topCustomers.slice(0, 5).map((customer, idx) => (
                                            <div key={customer.userId || idx} role="button" tabIndex={0} onClick={() => setShowCustomerModal(customer)} className="flex justify-between items-center bg-gray-50 p-2.5 rounded-lg border border-gray-100 cursor-pointer hover:bg-gray-100 active:bg-gray-200 transition-colors">
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${idx === 0 ? 'bg-yellow-400 text-yellow-900' : idx === 1 ? 'bg-gray-300 text-gray-800' : idx === 2 ? 'bg-orange-300 text-orange-900' : 'bg-gray-200 text-gray-600'}`}>{idx + 1}</div>
                                                    <div><div className="font-bold text-sm text-gray-800">{customer.userName} 様</div><div className="text-[10px] text-gray-500">注文回数: {customer.orderCount}回</div></div>
                                                </div>
                                                <div className="font-bold text-nanairo-dark">¥{Number(customer.totalSpend || 0).toLocaleString()}</div>
                                            </div>
                                        ))}
                                        {topCustomers.length > 5 && (
                                            <button type="button" onClick={() => setShowAllCustomersModal(true)} className="w-full text-center text-xs font-bold text-yellow-600 py-2 bg-yellow-50 rounded-lg active:bg-yellow-100 mt-2">すべて見る ({topCustomers.length}件)</button>
                                        )}
                                    </>
                                ) : <p className="text-sm text-gray-500 text-center py-4">データがありません</p>}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderCustomerModal = () => {
                if (!showCustomerModal) return null;
                const c = showCustomerModal;
                return (
                    <div className="fixed inset-0 z-[100] bg-black/50 flex flex-col justify-end items-center no-print">
                        <div className="bg-white rounded-t-2xl w-full max-w-[600px] max-h-[80vh] flex flex-col animate-slide-up shadow-2xl">
                            <div className="px-4 py-3 border-b flex justify-between items-center sticky top-0 bg-white rounded-t-2xl z-10 shrink-0">
                                <h2 className="font-bold text-base flex items-center gap-2"><Icons.User className="w-5 h-5" />購入カルテ</h2>
                                <div className="flex items-center gap-2">
                                    <button type="button" onClick={() => openMonthlyReportPreview(c)} className="bg-nanairo-dark text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm active:bg-blue-700 flex items-center gap-1"><Icons.FileText className="w-3.5 h-3.5"/> 請求明細書を作成</button>
                                    <button type="button" onClick={() => setShowCustomerModal(null)} className="p-1.5 bg-gray-100 rounded-full active:bg-gray-200"><Icons.X className="w-5 h-5" /></button>
                                </div>
                            </div>
                            <div className="overflow-y-auto p-5 pb-10">
                                <h3 className="text-xl font-bold text-gray-900 border-b-2 border-gray-800 inline-block pb-1 pr-4 mb-6">{c.userName} 様</h3>
                                <div className="grid grid-cols-2 gap-3 mb-6">
                                    <div className="bg-blue-50 p-3 rounded-lg border border-blue-100"><div className="text-xs font-bold text-blue-700 mb-1">期間内 累計購入額</div><div className="text-xl font-bold text-blue-900">¥{Number(c.totalSpend || 0).toLocaleString()}</div></div>
                                    <div className="bg-green-50 p-3 rounded-lg border border-green-100"><div className="text-xs font-bold text-green-700 mb-1">期間内 注文回数</div><div className="text-xl font-bold text-green-900">{c.orderCount || 0} <span className="text-sm">回</span></div></div>
                                </div>
                                <h4 className="font-bold text-gray-700 text-sm mb-3 border-b border-gray-200 pb-2">商品別の購入内訳</h4>
                                <ul className="space-y-2">
                                    {c.items && Object.entries(c.items).sort((a,b)=>b[1]-a[1]).map(([itemName, qty]) => (
                                        <li key={itemName} className="flex justify-between items-center p-2.5 bg-gray-50 rounded-lg border border-gray-100"><span className="font-bold text-sm text-gray-800">{itemName}</span><span className="font-bold text-gray-600 bg-white px-2 py-1 rounded shadow-sm text-xs">累計 {qty} P</span></li>
                                    ))}
                                </ul>
                            </div>
                        </div>
                    </div>
                );
            }

            const renderAllProductsModal = () => {
                if (!showAllProductsModal) return null;
                const topProducts = analytics?.topProducts || [];
                const maxQty = topProducts.length > 0 ? topProducts[0].qty : 1;
                return (
                    <div className="fixed inset-0 z-[100] bg-black/50 flex flex-col justify-end items-center no-print">
                        <div className="bg-white rounded-t-2xl w-full max-w-[600px] max-h-[80vh] flex flex-col animate-slide-up shadow-2xl">
                            <div className="px-4 py-3 border-b flex justify-between items-center sticky top-0 bg-white rounded-t-2xl z-10 shrink-0">
                                <h2 className="font-bold text-base flex items-center gap-2"><Icons.ShoppingBag className="w-5 h-5 text-blue-500" />商品ランキング全件</h2>
                                <button type="button" onClick={() => setShowAllProductsModal(false)} className="p-1.5 bg-gray-100 rounded-full active:bg-gray-200"><Icons.X className="w-5 h-5" /></button>
                            </div>
                            <div className="overflow-y-auto p-5 pb-10 space-y-4">
                                {topProducts.map((p, idx) => {
                                    const percent = Math.max(5, Math.round((p.qty / maxQty) * 100));
                                    return (
                                        <div key={p.name}>
                                            <div className="flex justify-between items-center mb-1"><div className="text-sm font-bold text-gray-800 flex items-center gap-2"><span className="text-gray-400">{idx + 1}.</span> {p.name}</div><div className="text-sm font-bold text-gray-600">{p.qty} P</div></div>
                                            <div className="w-full bg-gray-100 h-1.5 rounded-full overflow-hidden"><div className="bg-blue-400 h-full" style={{ width: `${percent}%` }}></div></div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                )
            }

            const renderAllCustomersModal = () => {
                if (!showAllCustomersModal) return null;
                const allCustomers = analytics?.topCustomers || [];
                const filtered = allCustomers.filter(c => c.userName && c.userName.toLowerCase().includes(searchCustomer.toLowerCase()));
                return (
                    <div className="fixed inset-0 z-[100] bg-black/50 flex flex-col justify-end items-center no-print">
                        <div className="bg-white rounded-t-2xl w-full max-w-[600px] max-h-[90vh] flex flex-col animate-slide-up shadow-2xl">
                            <div className="px-4 py-3 border-b flex justify-between items-center sticky top-0 bg-white rounded-t-2xl z-10 shrink-0">
                                <h2 className="font-bold text-base flex items-center gap-2"><Icons.Award className="w-5 h-5 text-yellow-500" />顧客ランキング全件</h2>
                                <button type="button" onClick={() => {setShowAllCustomersModal(false); setSearchCustomer("");}} className="p-1.5 bg-gray-100 rounded-full active:bg-gray-200"><Icons.X className="w-5 h-5" /></button>
                            </div>
                            <div className="p-4 border-b bg-gray-50 shrink-0">
                                <input type="text" placeholder="お客様の名前で検索..." value={searchCustomer} onChange={(e) => setSearchCustomer(e.target.value)} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:border-nanairo-dark" />
                            </div>
                            <div className="overflow-y-auto p-4 pb-10 space-y-2">
                                {filtered.length === 0 ? <p className="text-center text-sm text-gray-500 py-4">該当するお客様が見つかりません</p> : (
                                    filtered.map((customer, idx) => {
                                        const rank = allCustomers.findIndex(c => c.userId === customer.userId) + 1;
                                        return (
                                            <div key={customer.userId || idx} role="button" tabIndex={0} onClick={() => {setShowAllCustomersModal(false); setShowCustomerModal(customer);}} className="flex justify-between items-center bg-white p-3 rounded-lg border border-gray-200 cursor-pointer active:bg-gray-50 shadow-sm transition-colors">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold bg-gray-200 text-gray-600">{rank}</div>
                                                    <div><div className="font-bold text-sm text-gray-800">{customer.userName} 様</div><div className="text-[10px] text-gray-500">注文回数: {customer.orderCount}回</div></div>
                                                </div>
                                                <div className="font-bold text-nanairo-dark">¥{Number(customer.totalSpend || 0).toLocaleString()}</div>
                                            </div>
                                        )
                                    })
                                )}
                            </div>
                        </div>
                    </div>
                )
            }

            return (
                <div className="app-container">
                    <header className="no-print sticky top-0 z-30 bg-white shadow-sm">
                        <div className="px-4 py-2 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <img src="images/logo.png" alt="" className="w-8 h-8 object-contain" />
                                <span className="font-bold text-nanairo-dark">マイクロハーブ</span>
                                <span className="text-[10px] font-bold text-white bg-nanairo-dark px-1.5 py-0.5 rounded">管理</span>
                            </div>
                        </div>
                        <div className="rainbow"></div>
                    </header>

                    {message && (
                        <div className="no-print pointer-events-none fixed top-16 left-0 right-0 mx-auto w-11/12 max-w-[500px] z-[90] bg-nanairo-light border border-nanairo text-nanairo-dark px-4 py-3 rounded-xl flex items-center gap-2 animate-slide-up shadow-lg">
                            <Icons.Check className="w-5 h-5 shrink-0" />
                            <span className="font-bold text-sm">{message}</span>
                        </div>
                    )}

                    <main className="no-print flex-1 px-4 pt-4 pb-[120px] relative z-0">
                        {activeTab === 'orders' && renderOrdersTab()}
                        {activeTab === 'inventory' && renderInventoryTab()}
                        {activeTab === 'agency' && renderAgencyTab()}
                        {activeTab === 'analytics' && renderAnalyticsTab()}
                    </main>

                    {renderPrintView()}
                    {renderCustomerModal()}
                    {renderAllProductsModal()}
                    {renderAllCustomersModal()}

                    <div className="no-print fixed bottom-0 left-0 right-0 mx-auto w-full max-w-[600px] bg-white border-t border-gray-200 flex h-[76px] z-40 pb-[env(safe-area-inset-bottom)] box-border">
                        <button type="button" onClick={() => setActiveTab('orders')} className={`flex-1 flex flex-col items-center justify-center gap-1.5 ${activeTab === 'orders' ? 'text-nanairo-dark' : 'text-gray-400'}`}>
                            <div className="relative">
                                <Icons.ClipboardList className="w-6 h-6" />
                                {orders.filter(o=>o.status==='未対応').length > 0 && (
                                    <div className="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-white"></div>
                                )}
                            </div>
                            <span className="text-[11px] font-bold">注文対応</span>
                        </button>
                        <button type="button" onClick={() => setActiveTab('inventory')} className={`flex-1 flex flex-col items-center justify-center gap-1.5 ${activeTab === 'inventory' ? 'text-nanairo-dark' : 'text-gray-400'}`}>
                            <Icons.Box className="w-6 h-6" />
                            <span className="text-[11px] font-bold">在庫・販売</span>
                        </button>
                        <button type="button" onClick={() => setActiveTab('agency')} className={`flex-1 flex flex-col items-center justify-center gap-1.5 ${activeTab === 'agency' ? 'text-agency' : 'text-gray-400'}`}>
                            <div className="relative">
                                <Icons.Store className="w-6 h-6" />
                                {agencyDeliveries && agencyDeliveries.filter(d => d.status === "納品済").length > 0 && (
                                    <div className="absolute -top-1 -right-1 w-3 h-3 bg-agency rounded-full border-2 border-white"></div>
                                )}
                            </div>
                            <span className="text-[11px] font-bold">委託(卸し)</span>
                        </button>
                        <button type="button" onClick={() => setActiveTab('analytics')} className={`flex-1 flex flex-col items-center justify-center gap-1.5 ${activeTab === 'analytics' ? 'text-blue-600' : 'text-gray-400'}`}>
                            <Icons.TrendingUp className="w-6 h-6" />
                            <span className="text-[11px] font-bold">分析</span>
                        </button>
                    </div>

                    {showBulkLossModal && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 animate-fade-in no-print">
                            <div className="bg-white rounded-2xl w-full max-w-[320px] p-5 shadow-xl animate-slide-up">
                                <div className="flex flex-col items-center text-center mb-4">
                                    <div className="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mb-3"><Icons.AlertTriangle className="w-7 h-7" /></div>
                                    <h3 className="text-lg font-bold text-gray-900 mb-1">在庫を一括ロスしますか？</h3>
                                    <p className="text-xs text-gray-500">現在在庫が残っているすべての商品の在庫を「0」にし、一括でロス（破棄）として記録します。<br/><span className="text-red-500 mt-1 inline-block">この操作は一度に多数のデータを更新します。</span></p>
                                </div>
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => setShowBulkLossModal(false)} disabled={isBulkSubmitting} className="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl active:bg-gray-200">キャンセル</button>
                                    <button type="button" onClick={handleBulkLoss} disabled={isBulkSubmitting} className="flex-1 bg-red-500 text-white font-bold py-3 rounded-xl active:bg-red-600 flex justify-center items-center gap-2">{isBulkSubmitting ? <div className="spinner border-l-white w-4 h-4"></div> : '一括ロス実行'}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {cancelTargetLog && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 animate-fade-in no-print">
                            <div className="bg-white rounded-2xl w-full max-w-[320px] p-5 shadow-xl animate-slide-up">
                                <div className="flex flex-col items-center text-center mb-4">
                                    <div className="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mb-3"><Icons.AlertTriangle className="w-7 h-7" /></div>
                                    <h3 className="text-lg font-bold text-gray-900 mb-1">この記録を取り消しますか？</h3>
                                    <p className="text-xs text-gray-500">在庫数は自動的に元に戻ります。<br/>店頭販売の場合は売上からも除外されます。</p>
                                </div>
                                <div className="bg-gray-50 rounded-lg p-3 text-sm text-gray-700 font-bold border border-gray-200 mb-5 text-center">{cancelTargetLog.type}：{cancelTargetLog.name} {cancelTargetLog.amount}P</div>
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => setCancelTargetLog(null)} disabled={isCancelling} className="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl active:bg-gray-200">閉じる</button>
                                    <button type="button" onClick={handleCancelStockLog} disabled={isCancelling} className="flex-1 bg-red-500 text-white font-bold py-3 rounded-xl active:bg-red-600 flex justify-center items-center gap-2">{isCancelling ? <div className="spinner border-l-white w-4 h-4"></div> : '取り消す'}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {cancelDeliveryTarget && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 animate-fade-in no-print">
                            <div className="bg-white rounded-2xl w-full max-w-[320px] p-5 shadow-xl animate-slide-up">
                                <div className="flex flex-col items-center text-center mb-4">
                                    <div className="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mb-3"><Icons.X className="w-7 h-7" /></div>
                                    <h3 className="text-lg font-bold text-gray-900 mb-1">納品を取り消しますか？</h3>
                                    <p className="text-xs text-gray-500">商品はシステム在庫に戻ります。<br/>※すでに精算されている場合は取り消せません。</p>
                                </div>
                                <div className="bg-gray-50 rounded-lg p-3 text-sm text-gray-700 font-bold border border-gray-200 mb-5 text-center">
                                    <div className="text-xs text-gray-500 mb-1">{cancelDeliveryTarget.agencyName}</div>
                                    {cancelDeliveryTarget.productName} ({cancelDeliveryTarget.deliveryQty}P)
                                </div>
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => setCancelDeliveryTarget(null)} disabled={isCancelling} className="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl active:bg-gray-200">閉じる</button>
                                    <button type="button" onClick={handleCancelAgencyDelivery} disabled={isCancelling} className="flex-1 bg-red-500 text-white font-bold py-3 rounded-xl active:bg-red-600 flex justify-center items-center gap-2">{isCancelling ? <div className="spinner border-l-white w-4 h-4"></div> : '取り消す'}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {cancelInventoryTarget && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 animate-fade-in no-print">
                            <div className="bg-white rounded-2xl w-full max-w-[320px] p-5 shadow-xl animate-slide-up">
                                <div className="flex flex-col items-center text-center mb-4">
                                    <div className="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mb-3"><Icons.X className="w-7 h-7" /></div>
                                    <h3 className="text-lg font-bold text-gray-900 mb-1">精算を取り消しますか？</h3>
                                    <p className="text-xs text-gray-500">未精算の状態に戻ります。<br/>売上から除外され、回収したロスも元に戻ります。</p>
                                </div>
                                <div className="bg-gray-50 rounded-lg p-3 text-sm text-gray-700 font-bold border border-gray-200 mb-5 text-center">
                                    <div className="text-xs text-gray-500 mb-1">{cancelInventoryTarget.agencyName}</div>
                                    {cancelInventoryTarget.productName}
                                </div>
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => setCancelInventoryTarget(null)} disabled={isCancelling} className="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl active:bg-gray-200">閉じる</button>
                                    <button type="button" onClick={handleCancelAgencyInventory} disabled={isCancelling} className="flex-1 bg-red-500 text-white font-bold py-3 rounded-xl active:bg-red-600 flex justify-center items-center gap-2">{isCancelling ? <div className="spinner border-l-white w-4 h-4"></div> : '取り消す'}</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {inventoryModal && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 animate-fade-in no-print">
                            <div className="bg-white rounded-2xl w-full max-w-[320px] p-5 shadow-xl animate-slide-up">
                                <div className="mb-4">
                                    <h3 className="text-lg font-bold text-gray-900 mb-1">棚卸し入力</h3>
                                    <p className="text-sm text-gray-600 bg-gray-50 p-2 rounded">{inventoryModal.agencyName}<br/><span className="font-bold text-black">{inventoryModal.productName}</span> (納品数: {inventoryModal.deliveryQty})</p>
                                </div>
                                <div className="space-y-4 mb-6">
                                    <div>
                                        <label className="block text-sm font-bold text-blue-600 mb-1">売れた数 (実売数)</label>
                                        <div className="flex items-center border-2 border-blue-200 rounded-xl bg-blue-50 h-12 overflow-hidden">
                                            <button type="button" onClick={() => { const next = Math.max(0, invSalesQty - 1); setInvSalesQty(next); setInvLossQty(inventoryModal.deliveryQty - next); }} className="w-12 h-full flex justify-center items-center text-blue-600 bg-blue-100 active:bg-blue-200"><Icons.Minus className="w-4 h-4" /></button>
                                            <div className="flex-1 text-center font-bold text-lg text-blue-900 pt-1">{invSalesQty}</div>
                                            <button type="button" onClick={() => { const next = Math.min(inventoryModal.deliveryQty, invSalesQty + 1); setInvSalesQty(next); setInvLossQty(inventoryModal.deliveryQty - next); }} className="w-12 h-full flex justify-center items-center text-blue-600 bg-blue-100 active:bg-blue-200"><Icons.Plus className="w-4 h-4" /></button>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-red-600 mb-1">回収した数 (ロス)</label>
                                        <div className="flex items-center border-2 border-red-200 rounded-xl bg-red-50 h-12 overflow-hidden">
                                            <button type="button" onClick={() => { const next = Math.max(0, invLossQty - 1); setInvLossQty(next); setInvSalesQty(inventoryModal.deliveryQty - next); }} className="w-12 h-full flex justify-center items-center text-red-600 bg-red-100 active:bg-red-200"><Icons.Minus className="w-4 h-4" /></button>
                                            <div className="flex-1 text-center font-bold text-lg text-red-900 pt-1">{invLossQty}</div>
                                            <button type="button" onClick={() => { const next = Math.min(inventoryModal.deliveryQty, invLossQty + 1); setInvLossQty(next); setInvSalesQty(inventoryModal.deliveryQty - next); }} className="w-12 h-full flex justify-center items-center text-red-600 bg-red-100 active:bg-red-200"><Icons.Plus className="w-4 h-4" /></button>
                                        </div>
                                    </div>
                                    <div className="text-center text-xs font-bold text-gray-500 bg-gray-100 p-2 rounded">
                                        合計: {invSalesQty + invLossQty} / 納品数: {inventoryModal.deliveryQty}
                                        {invSalesQty + invLossQty !== inventoryModal.deliveryQty && <span className="block text-red-500 mt-1">※合計が納品数と一致しません</span>}
                                    </div>
                                </div>
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => setInventoryModal(null)} className="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl active:bg-gray-200">キャンセル</button>
                                    <button type="button" onClick={handleAgencyInventory} disabled={isSubmittingDelivery || (invSalesQty + invLossQty !== inventoryModal.deliveryQty)} className={`flex-1 font-bold py-3 rounded-xl flex justify-center items-center gap-2 ${isSubmittingDelivery || (invSalesQty + invLossQty !== inventoryModal.deliveryQty) ? 'bg-gray-300 text-gray-500' : 'bg-agency text-white active:bg-orange-600'}`}>{isSubmittingDelivery ? <div className="spinner border-l-white w-4 h-4"></div> : '精算確定'}</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
