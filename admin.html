                            <div className="fixed inset-0 bg-black/40 z-[60] flex flex-col justify-end items-center" onClick={() => !isSubmitting && setStockSheetOpen(false)}>
                                <div className="bg-white rounded-t-3xl w-full max-w-[600px] p-4 animate-slide-up" onClick={e => e.stopPropagation()} style={{ paddingBottom: 'calc(16px + env(safe-area-inset-bottom))' }}>
                                    <div className="flex items-center gap-3">
                                        {imgOf(p) && <img src={imgOf(p)} alt="" className="w-12 h-12 rounded-lg object-cover" />}
                                        <div className="flex-1"><b className="text-gray-900">{p.name}</b><div className="text-xs text-gray-500">いまの在庫 {p.stock}</div></div>
                                        <button type="button" onClick={() => setStockSheetOpen(false)} className="p-1.5 bg-gray-100 rounded-full"><Icons.X className="w-5 h-5" /></button>
                                    </div>
                                    <div className="grid grid-cols-3 gap-1 bg-gray-100 rounded-xl p-1 mt-3 text-sm font-bold">
                                        {TYPES.map(([k, label, bg]) => (
                                            <button key={k} type="button" onClick={() => setType(k)} className={`rounded-lg py-2.5 ${type === k ? `${bg} text-white shadow-sm` : 'text-gray-600'}`}>{label}</button>
                                        ))}
                                    </div>
                                    <div className="flex items-center justify-between mt-4 px-2">
                                        <button type="button" onClick={() => setAmount(Math.max(1, amount - 1))} className="w-14 h-14 rounded-full border border-gray-300 flex items-center justify-center text-gray-600"><Icons.Minus className="w-6 h-6" /></button>
                                        <input type="number" inputMode="numeric" min="1" value={amount} onChange={e => setAmount(Math.max(1, parseInt(e.target.value, 10) || 1))} className="w-28 text-center text-5xl font-bold text-gray-900 outline-none bg-transparent" />
                                        <button type="button" onClick={() => setAmount(amount + 1)} className="w-14 h-14 rounded-full bg-nanairo-dark flex items-center justify-center text-white"><Icons.Plus className="w-6 h-6" /></button>
                                    </div>
                                    <div className="flex gap-2 justify-center mt-3">
                                        {[5, 10, 20].map(n => <button key={n} type="button" onClick={() => setAmount(amount + n)} className="px-4 py-1.5 rounded-full bg-gray-100 text-sm font-bold text-gray-700 active:bg-gray-200">+{n}</button>)}
                                        <button type="button" onClick={() => setAmount(1)} className="px-4 py-1.5 rounded-full text-sm font-bold text-gray-400">1に戻す</button>
                                    </div>
                                    <input type="text" value={stockMemo} onChange={e => setStockMemo(e.target.value)} placeholder="メモ（任意）例：鮮度落ち" className="w-full mt-3 border border-gray-200 rounded-lg px-3 py-2 text-sm bg-gray-50 outline-none focus:ring-2 focus:ring-nanairo-dark" />
                                    {after < 0 && <p className="text-xs font-bold text-red-600 mt-2">在庫（{p.stock}）より多い数です。数を確認してください。</p>}
                                    <button type="button" onClick={handleSubmitStock} disabled={isSubmitting || after < 0} className={`w-full mt-3 rounded-xl py-3.5 text-white font-bold flex justify-center items-center gap-2 ${isSubmitting || after < 0 ? 'bg-gray-300' : cur[2]}`}>
                                        {isSubmitting ? <><div className="spinner"></div> 記録中...</> : `${cur[1].slice(2)} ${amount} を記録（在庫 ${p.stock} → ${after}）`}
                                    </button>
                                    <p className="text-xs text-center text-gray-500 mt-2">間違えたときは、下の「最近の記録」から取り消せます</p>
                                </div>
                            </div>
                        );
                    })()}
                    {(() => {
                        const selectedOrder = orders.find(o => o.id === selectedOrderId);
                        if (!selectedOrder) return null;
                        return (
                            <div className={`no-print fixed inset-0 bg-black/50 z-[60] flex flex-col justify-end lg:justify-center lg:items-center ${activeTab === 'orders' ? 'lg:hidden' : ''}`} onClick={() => setSelectedOrderId(null)}>
                                <div className="relative bg-gray-50 rounded-t-3xl lg:rounded-3xl w-full lg:max-w-[560px] max-h-[92vh] overflow-y-auto p-4 animate-slide-up" onClick={e => e.stopPropagation()} style={{ paddingBottom: 'calc(20px + env(safe-area-inset-bottom))' }}>
                                    <div className="flex justify-center mb-2 lg:hidden"><div className="w-10 h-1 rounded-full bg-gray-300"></div></div>
                                    <button type="button" onClick={() => setSelectedOrderId(null)} className="absolute top-3 right-3 p-1.5 bg-white rounded-full shadow-sm z-10" aria-label="閉じる"><Icons.X className="w-5 h-5" /></button>
                                    {renderOrderDetail(selectedOrder)}
                                </div>
                            </div>
                        );
                    })()}
                    {renderPrintView()}
                    {renderCustomerModal()}
                    {renderAllProductsModal()}
                    {renderAllCustomersModal()}

                    <div className="no-print lg:hidden fixed bottom-0 left-0 right-0 mx-auto w-full max-w-[600px] bg-white border-t border-gray-200 flex h-[76px] z-40 pb-[env(safe-area-inset-bottom)] box-border">
                        {TABS.map(([k, label, Icon]) => {
                            const dot = k === 'orders' ? orders.some(o => o.status === '未対応') : k === 'agency' ? (agencyDeliveries || []).some(d => d.status === '納品済') : false;
                            return (
                                <button key={k} type="button" onClick={() => goTab(k)} className={`flex-1 flex flex-col items-center justify-center gap-1 ${activeTab === k ? 'text-nanairo-dark' : 'text-gray-400'}`}>
                                    <div className="relative">
                                        <Icon className="w-6 h-6" />
                                        {dot && <div className="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-white"></div>}
                                        {k === 'more' && unpaidBadge > 0 && <div className="absolute -top-1.5 -right-2.5 min-w-[18px] h-[18px] px-1 bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white">{unpaidBadge}</div>}
                                    </div>
                                    <span className="text-[11px] font-bold">{label}</span>
                                </button>
                            );
                        })}
                    </div>

                    {showBulkLossModal && (() => {
                        const targets = allProducts.filter(p => p.stock > 0);
                        const close = () => !isBulkSubmitting && setShowBulkLossModal(false);
                        return sheetWrap(close, <>
                            <div className="text-center"><div className="w-12 h-12 rounded-full bg-red-50 text-red-500 text-2xl flex items-center justify-center mx-auto">🗑</div><h3 className="text-lg font-bold text-gray-900 mt-2">残りを全部ロスにしますか？</h3><p className="text-xs text-gray-500">今ある在庫を0にして、ロスとして記録します</p></div>
                            {targets.length === 0 ? <div className="text-center text-sm text-gray-400 py-6">在庫が残っている商品はありません</div> : (
                                <div className="bg-white rounded-2xl border border-gray-200 mt-3 divide-y divide-gray-100 text-sm">
                                    {targets.map(p => <div key={p.id} className="flex justify-between px-3 py-2"><span>{p.name}</span><b>{p.stock}</b></div>)}
                                    <div className="flex justify-between px-3 py-2 bg-gray-50 rounded-b-2xl"><b>合計 {targets.length}商品</b><b className="text-red-500">{targets.reduce((a, p) => a + p.stock, 0)}個（¥{targets.reduce((a, p) => a + p.stock * p.price, 0).toLocaleString()}）</b></div>
                                </div>
                            )}
                            <div className="grid grid-cols-2 gap-2 mt-4 font-bold">
                                <button type="button" onClick={close} className="py-3 rounded-xl bg-gray-100 text-gray-700">やめる</button>
                                <button type="button" onClick={handleBulkLoss} disabled={isBulkSubmitting || targets.length === 0} className={`py-3 rounded-xl flex justify-center items-center gap-2 text-white ${isBulkSubmitting || targets.length === 0 ? 'bg-gray-300' : 'bg-red-500'}`}>{isBulkSubmitting ? <div className="spinner w-4 h-4"></div> : '全部ロスにする'}</button>
                            </div>
                        </>);
                    })()}

                    {logSheet && (() => {
                        const it = logSheet;
                        const live = it.logs.filter(l => l.status !== '取消');
                        const m = { '収穫': ['bg-nanairo-dark', '＋', '収穫'], '店頭販売': ['bg-blue-500', '¥', '店頭販売'], 'ロス': ['bg-red-500', '−', 'ロス'] }[it.type] || ['bg-gray-400', '•', it.type];
                        const after = (l) => { const p = allProducts.find(x => x.id === l.productId); if (!p) return null; return it.type === '収穫' ? p.stock - l.amount : p.stock + l.amount; };
                        const close = () => !confirmBusy && setLogSheet(null);
                        return sheetWrap(close, <>
                            <div className="flex items-center gap-3"><span className={`w-10 h-10 rounded-full text-white flex items-center justify-center ${m[0]}`}>{m[1]}</span><div><b className="text-gray-900">{live.length > 1 ? `${it.memo === '一括ロス' ? '残りを全部ロス' : 'まとめて' + m[2]}（${live.length}商品）` : `${live[0] ? live[0].name : ''} を${m[2]}`}</b><div className="text-xs text-gray-500">{it.d} {it.t}{it.memo && live.length === 1 ? `　${it.memo}` : ''}</div></div></div>
                            <div className="bg-white rounded-2xl border border-gray-200 mt-3 divide-y divide-gray-100 text-sm">
                                <div className="flex justify-between px-3 py-2 text-[11px] font-bold text-gray-500"><span>取り消すと在庫は</span><span>いま → 取り消し後</span></div>
                                {live.map(l => { const p = allProducts.find(x => x.id === l.productId); return <div key={l.rowIndex} className="flex justify-between px-3 py-2"><span>{l.name} <span className="text-gray-400">{it.type === '収穫' ? '+' : '−'}{l.amount}</span></span><b>{p ? `${p.stock} → ${after(l)}` : '—'}</b></div>; })}
                            </div>
                            <div className="grid grid-cols-2 gap-2 mt-4 font-bold">
                                <button type="button" onClick={close} className="py-3 rounded-xl bg-gray-100 text-gray-700">閉じる</button>
                                <button type="button" disabled={confirmBusy} onClick={async () => { setConfirmBusy(true); await undoLogs(live.map(l => l.rowIndex)); setConfirmBusy(false); setLogSheet(null); }} className="py-3 rounded-xl bg-white border border-red-300 text-red-600 flex justify-center items-center">{confirmBusy ? <div className="spinner spinner-dark w-4 h-4"></div> : 'この記録を取り消す'}</button>
                            </div>
                        </>);
                    })()}

                    {settleSheet && (() => {
                        const a = agencies.find(x => x.id === settleSheet.agencyId);
                        if (!a) return null;
                        const pending = agencyStats(a).pending;
                        const calc = (d) => { const sold = settleSheet.sold[d.id] || 0; const ex = Math.floor(agencyPriceOf(a.id, d.productId) / 1.08); const salesEx = ex * sold; const fee = Math.floor(salesEx * a.feeRate); return { sold, loss: d.deliveryQty - sold, fee, pure: salesEx - fee }; };
                        const rows = pending.map(d => ({ d, ...calc(d) }));
                        const pureTotal = rows.reduce((s, r) => s + r.pure, 0);
                        const billing = pureTotal + Math.floor(pureTotal * 0.08);
                        const setSold = (id, v, max) => setSettleSheet(prev => ({ ...prev, sold: { ...prev.sold, [id]: Math.max(0, Math.min(max, v)) } }));
                        const submit = async () => {
                            setIsSubmittingDelivery(true);
                            let done = 0;
                            try {
                                for (const r of rows) { await postAdmin({ action: "agencyInventory", deliveryId: r.d.id, salesQty: r.sold, lossQty: r.loss }); done++; }
                                showMessage(`${a.name} の精算を記録しました`);
                                printAgencyDoc(a, rows.map(r => ({ ...r.d, salesQty: r.sold, lossQty: r.loss, feeAmountExTax: r.fee, pureSalesExTax: r.pure })), 'settle');
                                setSettleSheet(null);
                            } catch (e) { showMessage(`${done}件まで精算しました。残りは記録できませんでした: ${e.message}`, 8000); }
                            finally { setIsSubmittingDelivery(false); fetchData(viewStartMonth, viewEndMonth); }
                        };
                        return sheetWrap(() => !isSubmittingDelivery && setSettleSheet(null), <>
                            <h3 className="text-lg font-bold text-gray-900">{a.name} を精算</h3>
                            <p className="text-xs text-gray-500">お店で数えた<b>売れた数</b>を入れてください。残りはロス（回収）になります。</p>
                            <div className="mt-3 space-y-2">
                                {rows.map(r => (
                                    <div key={r.d.id} className="bg-white rounded-2xl border border-gray-200 p-3">
                                        <div className="flex justify-between items-center gap-2">
                                            <div className="min-w-0"><b className="text-sm">{r.d.productName}</b><div className="text-[11px] text-gray-500">{shortDate(r.d.date)} 納品 {r.d.deliveryQty}個・店頭 {agencyPriceOf(a.id, r.d.productId) ? `¥${agencyPriceOf(a.id, r.d.productId)}` : '価格未設定'}</div></div>
                                            <div className="flex items-center gap-2 shrink-0">
                                                <button type="button" onClick={() => setSold(r.d.id, r.sold - 1, r.d.deliveryQty)} className="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center text-gray-500"><Icons.Minus className="w-4 h-4" /></button>
                                                <b className="w-6 text-center text-lg">{r.sold}</b>
                                                <button type="button" onClick={() => setSold(r.d.id, r.sold + 1, r.d.deliveryQty)} className="w-8 h-8 rounded-full bg-nanairo-dark text-white flex items-center justify-center"><Icons.Plus className="w-4 h-4" /></button>
                                            </div>
                                        </div>
                                        <div className="text-[11px] text-gray-500 mt-1 text-right">売れた {r.sold}・ロス <b className={r.loss ? 'text-red-500' : 'text-gray-700'}>{r.loss}</b></div>
                                    </div>
                                ))}
                            </div>
                            <div className="bg-white rounded-2xl border border-gray-200 mt-3 px-3 py-2.5 text-sm space-y-1">
                                <div className="flex justify-between"><span className="text-gray-500">売れた合計</span><b>{rows.reduce((s, r) => s + r.sold, 0)}個</b></div>
                                <div className="flex justify-between"><span className="text-gray-500">ロス（回収）</span><b className="text-red-500">{rows.reduce((s, r) => s + r.loss, 0)}個</b></div>
                                <div className="flex justify-between pt-1 border-t border-gray-100"><span className="text-gray-500">ご請求（手数料{Math.round(a.feeRate * 100)}%を引いた額・税込）</span><b className="text-lg">¥{billing.toLocaleString()}</b></div>
                            </div>
                            <button type="button" onClick={submit} disabled={isSubmittingDelivery} className={`mt-3 w-full py-3.5 rounded-xl text-white font-bold flex justify-center items-center gap-2 ${isSubmittingDelivery ? 'bg-gray-300' : 'bg-orange-500'}`}>{isSubmittingDelivery ? <><div className="spinner"></div> 記録中…</> : 'まとめて精算して、精算明細書を出す'}</button>
                        </>);
                    })()}

                    {deliveryDone && sheetWrap(() => setDeliveryDone(null), <>
                        <div className="text-center py-2"><div className="w-14 h-14 rounded-full bg-nanairo-dark text-white text-3xl flex items-center justify-center mx-auto">✓</div><h3 className="text-lg font-bold text-gray-900 mt-2">{deliveryDone.agency.name} に納品しました</h3><p className="text-xs text-gray-500">{shortDate(deliveryDone.date)}・{deliveryDone.items.length}商品 {deliveryDone.items.reduce((s, i) => s + i.qty, 0)}個</p></div>
                        <div className="bg-white rounded-2xl border border-gray-200 divide-y divide-gray-100 text-sm mt-2">{deliveryDone.items.map(i => <div key={i.productId} className="flex justify-between px-3 py-2"><span>{i.productName}</span><b>{i.qty}</b></div>)}</div>
                        <div className="mt-4 space-y-2 font-bold">
                            <button type="button" onClick={() => { setPrintOrders([deliveryDone.invoiceData]); setPrintType('agency_invoice'); setDeliveryDone(null); }} className="w-full py-3.5 rounded-xl bg-nanairo-dark text-white">🖨 納品書を印刷・PDF保存</button>
                            <button type="button" onClick={() => setDeliveryDone(null)} className="w-full py-3 rounded-xl bg-gray-100 text-gray-700">あとで（履歴からいつでも出せます）</button>
                        </div>
                    </>)}

                    {batchMenu && (() => {
                        const a = agencies.find(x => x.id === batchMenu.agencyId);
                        const b = a ? agencyStats(a).batchList.find(x => x.key === batchMenu.key) : null;
                        if (!b) return null;
                        const settled = b.items.filter(d => d.status === '精算済');
                        const pending = b.items.filter(d => d.status === '納品済');
                        const close = () => setBatchMenu(null);
                        const runAll = async (action, list, msg) => {
                            try { for (const d of list) await postAdmin({ action, rowIndex: d.rowIndex }); showMessage(msg); }
                            catch (e) { showMessage('取り消せませんでした: ' + e.message, 7000); }
                            fetchData(viewStartMonth, viewEndMonth);
                        };
                        const item = (label, onClick, cls = '', disabledReason = null) => (
                            <button type="button" disabled={!!disabledReason} onClick={onClick} className={`w-full text-left px-4 py-3 ${disabledReason ? 'text-gray-300' : cls}`}>{label}{disabledReason && <span className="block text-[11px]">{disabledReason}</span>}</button>
                        );
                        return sheetWrap(close, <>
                            <b className="text-gray-900">{shortDate(b.date)} の納品</b>
                            <div className="text-xs text-gray-500">{b.items.map(d => `${d.productName}${d.deliveryQty}`).join('・')}</div>
                            <div className="bg-white rounded-2xl border border-gray-200 mt-3 divide-y divide-gray-100 text-sm">
                                {item('🖨 納品書を再発行', () => { printAgencyDoc(a, b.items, 'deliver'); close(); })}
                                {settled.length > 0 && item('🖨 精算明細書', () => { printAgencyDoc(a, settled, 'settle'); close(); })}
                                {settled.length > 0 && item('↩ 精算を取り消す（未精算に戻す）', () => { close(); setConfirmSheet({ title: '精算を取り消しますか？', body: '未精算の状態に戻ります。売上から外れ、回収したロスも元に戻ります。', rows: settled.map(d => [d.productName, `売れた${d.salesQty}・ロス${d.lossQty}`]), confirmLabel: '精算を取り消す', danger: true, onConfirm: () => runAll('cancelAgencyInventory', settled, '精算を取り消しました') }); }, 'text-red-600')}
                                {item('↩ 納品を取り消す（在庫に戻す）', () => { close(); setConfirmSheet({ title: '納品を取り消しますか？', body: '納品した商品は在庫に戻ります。', rows: pending.map(d => [d.productName, `${d.deliveryQty}個`]), confirmLabel: '納品を取り消す', danger: true, onConfirm: () => runAll('cancelAgencyDelivery', pending, '納品を取り消して、在庫に戻しました') }); }, 'text-red-600', settled.length ? '精算済みの商品があるため不可（先に精算を取り消してください）' : null)}
                            </div>
                            <button type="button" onClick={close} className="w-full mt-3 py-3 rounded-xl bg-gray-100 text-gray-700 font-bold">閉じる</button>
                        </>);
                    })()}

                    {renderConfirmSheet()}

                    {toast && (
                        <div key={toast.id} className="no-print fixed left-3 right-3 lg:left-auto lg:right-6 lg:w-[420px] bottom-[88px] lg:bottom-6 z-[80] mx-auto max-w-[560px] bg-gray-900 text-white rounded-2xl px-4 py-3 flex items-center gap-3 shadow-xl animate-slide-up">
                            <span className="text-lg">✓</span>
                            <div className="flex-1 min-w-0 text-sm"><b>{toast.text}</b>{toast.sub && <div className="text-[11px] text-gray-300">{toast.sub}</div>}</div>
                            {toast.undo && <button type="button" onClick={() => { const u = toast.undo; setToast(null); u(); }} className="text-sm font-bold text-nanairo shrink-0">取り消す</button>}
                            <button type="button" onClick={() => setToast(null)} className="text-gray-400 shrink-0" aria-label="閉じる"><Icons.X className="w-4 h-4" /></button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
