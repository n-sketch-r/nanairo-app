<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【管理者用】なないろ菜 ダッシュボード</title>
    
    <link rel="apple-touch-icon" href="images/logo.png">
    <link rel="icon" type="image/png" href="images/logo.png">
    
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.9/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // ★ロゴ（カメレオン）の色にそろえる
                        'nanairo': { light: '#EEF5E1', DEFAULT: '#8DC63F', dark: '#0F9A44' },
                        'nanairo-accent': '#f97316',
                        'agency': { light: '#fff7ed', DEFAULT: '#f97316', dark: '#c2410c' },
                        'line': '#06C755'
                    }
                }
            }
        }
    </script>
    
    <style>
        ::-webkit-scrollbar { display: none; }
        body { background-color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        @media (min-width: 1024px) { .app-container { max-width: 1120px !important; } }
        .app-container { max-width: 600px; margin: 0 auto; background-color: #f3f4f6; min-height: 100vh; position: relative; display: flex; flex-direction: column; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-left-color: #fff; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        .sk { background: linear-gradient(90deg,#ececec 25%,#f5f5f5 50%,#ececec 75%); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 8px; }
        @keyframes sh { to { background-position: -200% 0; } }
        @keyframes walk { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-4px) rotate(3deg); } }
        .walk { animation: walk .8s ease-in-out infinite; }
        .spinner-dark { border-color: rgba(0,0,0,0.1); border-left-color: #16a34a; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .rainbow { height: 3px; background: linear-gradient(90deg,#E8412F,#F7931E,#FDD835,#4CB848,#00AEEF,#0F75BC,#A0569F); }

        /* 印刷用スタイル */
        @media print {
            @page { margin: 0; size: auto; } 
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; background-color: white; } 
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area { position: absolute; left: 0; top: 0; width: 100%; background-color: white; margin: 0; padding: 0; }
            .no-print { display: none !important; }
            .page-break { page-break-after: always; margin-bottom: 0 !important; border: none !important; }
            .app-container { max-width: 100%; background-color: white; box-shadow: none; }
            
            .receipt-print {
                width: 100%; max-width: 80mm; margin: 0 auto;
                font-family: 'Helvetica Neue', monospace, sans-serif; color: #000;
            }
            .receipt-print * { visibility: visible; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // すべてのアイコンを完全に定義（エラー防止）
        const Icons = {
            Plus: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Minus: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/></svg>,
            Check: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 6 9 17l-5-5"/></svg>,
            Box: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>,
            ClipboardList: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>,
            TrendingUp: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>,
            Clock: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            User: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            AlertTriangle: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
            ShoppingBag: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>,
            Calendar: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
            RefreshCw: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
            Printer: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>,
            FileText: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>,
            X: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            Award: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>,
            History: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>,
            MapPin: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>,
            Phone: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>,
            Truck: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 18H3c-.6 0-1-.4-1-1V7c0-.6.4-1 1-1h10c.6 0 1 .4 1 1v11"/><path d="M14 9h4l4 4v4c0 .6-.4 1-1 1h-2"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>,
            Store: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"/></svg>,
            XCircle: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>,
            BarChart: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>,
            PieChart: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>,
            Activity: ({className}) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        };

        // ★画面に出さない商品（index.html の HIDDEN_PRODUCTS と同じにしてください）
        const HIDDEN_PRODUCTS = ["なないろ菜", "レッドソレル"];

        // ★商品写真（注文画面と同じ images/ を使う）
        const IMAGE_MAP = {
            "アマランサス": "images/amaranth.jpg", "デトロイト": "images/detroit.jpg", "にんじん": "images/carrot.jpg",
            "ハーブミックス": "images/herb-mix.jpg", "ひまわり": "images/sunflower.jpg", "ペッパークレス": "images/pepper-cress.jpg",
            "マスタード": "images/mustard.jpg", "レッドケール": "images/red-kale.jpg", "レッドラディッシュ": "images/red-radish.jpg",
            "ロケット": "images/rocket.jpg", "青じそ": "images/aojiso.jpg"
        };

        const GAS_URL = "https://script.google.com/macros/s/AKfycbwv2XISbajDhH03WIIvr9-Br87CGaQcVYKtzk6flCluhncE6rfxlKS0fTN0vdbV5k-H9Q/exec"; 

        const toWareki = (dateStr) => {
            if (!dateStr) return "";
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return `R${d.getFullYear() - 2018}.${d.getMonth() + 1}.${d.getDate()}`;
        };

        function App() {
            // アクティブタブ (orders, inventory, agency, analytics) ※hub(印刷)は非表示
            const [activeTab, setActiveTab] = useState('orders'); 
            
            // データ群
            const [products, setProducts] = useState([]);
            const [orders, setOrders] = useState([]);
            const [analytics, setAnalytics] = useState(null);
            const [stockLogs, setStockLogs] = useState([]); 
            const [agencies, setAgencies] = useState([]);
            const [agencyPrices, setAgencyPrices] = useState([]);
            const [agencyDeliveries, setAgencyDeliveries] = useState([]);
            
            const [isLoadingData, setIsLoadingData] = useState(true);
            const [isFetchingData, setIsFetchingData] = useState(false);

            // メッセージ表示用
            const [message, setMessage] = useState('');
            const showMessage = (text, duration = 4000) => {
                setMessage(text);
                setTimeout(() => setMessage(''), duration);
            };

            // 在庫手動調整用
            const [selectedProductId, setSelectedProductId] = useState('');
            const [type, setType] = useState('add'); 
            const [amount, setAmount] = useState(1);
            const [stockMemo, setStockMemo] = useState(''); 
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [stockSheetOpen, setStockSheetOpen] = useState(false); // 在庫の入力（下から出る画面）
            const [selectedOrderId, setSelectedOrderId] = useState(null); // 詳細を開いている注文
            const [moreView, setMoreView] = useState(null);               // 「その他」の中の画面
            const [orderSearch, setOrderSearch] = useState('');
            const [prepDay, setPrepDay] = useState('today');
            const [doneFilter, setDoneFilter] = useState('all');
            const [selectedCustomerKey, setSelectedCustomerKey] = useState(null);
            const [customerSearch, setCustomerSearch] = useState('');
            const [customerFilter, setCustomerFilter] = useState('all');
            const [bulkMode, setBulkMode] = useState(false);              // 在庫のまとめて入力
            const [bulkType, setBulkType] = useState('add');
            const [bulkQty, setBulkQty] = useState({});
            const [bulkRunning, setBulkRunning] = useState(false);
            const [bulkProgress, setBulkProgress] = useState(0);
            
            // モーダル・キャンセル関連
            const [showBulkLossModal, setShowBulkLossModal] = useState(false);
            const [isBulkSubmitting, setIsBulkSubmitting] = useState(false);
            const [cancelTargetLog, setCancelTargetLog] = useState(null);
            const [isCancelling, setIsCancelling] = useState(false);
            const [cancelDeliveryTarget, setCancelDeliveryTarget] = useState(null);
            const [cancelInventoryTarget, setCancelInventoryTarget] = useState(null);

            // 期間フィルター
            const todayStr = new Date(Date.now() + 9 * 3600 * 1000).toISOString().split('T')[0]; // ★日本時間
            const todayMonth = todayStr.slice(0, 7);
            const [viewStartMonth, setViewStartMonth] = useState(todayMonth);
            const [viewEndMonth, setViewEndMonth] = useState(todayMonth);

            // UIトグル
            const [isPastOrdersOpen, setIsPastOrdersOpen] = useState(false);
            const [showAllProductsModal, setShowAllProductsModal] = useState(false);
            const [showAllCustomersModal, setShowAllCustomersModal] = useState(false);
            const [searchCustomer, setSearchCustomer] = useState("");
            const [showCustomerModal, setShowCustomerModal] = useState(null); 
            const [chartType, setChartType] = useState('line');
            const [insights, setInsights] = useState(null); // ★分析強化
            const [trendHover, setTrendHover] = useState(null);
            const [showTrendTable, setShowTrendTable] = useState(false);

            // 印刷・月次請求書用
            const [printOrders, setPrintOrders] = useState([]); 
            const [printType, setPrintType] = useState('invoice'); 
            const [printName, setPrintName] = useState(''); 
            const [printHonorific, setPrintHonorific] = useState('御中');
            const [reportStartDate, setReportStartDate] = useState('');
            const [reportEndDate, setReportEndDate] = useState('');
            const [reportClosingDate, setReportClosingDate] = useState('');

            // 委託販売用のState
            const [selectedAgencyId, setSelectedAgencyId] = useState('');
            const [deliveryDate, setDeliveryDate] = useState(todayStr); 
            const [deliveryCart, setDeliveryCart] = useState({});
            const [isSubmittingDelivery, setIsSubmittingDelivery] = useState(false);
            const [inventoryModal, setInventoryModal] = useState(null); 
            const [invSalesQty, setInvSalesQty] = useState(0);
            const [invLossQty, setInvLossQty] = useState(0);

            // ★管理者パスワード（この端末にだけ保存。GASでハッシュ照合します）
            const readSavedKey = () => { try { return localStorage.getItem('nanairo_admin_key') || ''; } catch (e) { return ''; } };
            const [adminKey, setAdminKey] = useState(readSavedKey);
            const adminKeyRef = React.useRef(adminKey);
            adminKeyRef.current = adminKey;
            const getAdminKey = () => adminKeyRef.current;
            const [loginInput, setLoginInput] = useState('');
            const [loginError, setLoginError] = useState('');
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const logout = (msg) => {
                try { localStorage.removeItem('nanairo_admin_key'); } catch (e) {}
                setAdminKey(''); setIsLoadingData(true); setLoginError(msg || '');
            };
            const handleLogin = async (e) => {
                e.preventDefault();
                if (!loginInput || isLoggingIn) return;
                setIsLoggingIn(true); setLoginError('');
                try {
                    const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "checkAdmin", adminKey: loginInput }) });
                    const d = await res.json();
                    if (d.status === 'success') {
                        try { localStorage.setItem('nanairo_admin_key', loginInput); } catch (e) {}
                        adminKeyRef.current = loginInput;
                        setAdminKey(loginInput); setLoginInput('');
                    } else setLoginError('パスワードが違います。');
                } catch (err) { setLoginError('通信エラーが発生しました。'); }
                finally { setIsLoggingIn(false); }
            };

            // ★管理用の送信。GASがエラーを返したら例外にする（失敗したのに「記録しました」と出さないため）
            const postAdmin = async (body) => {
                const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ ...body, adminKey: getAdminKey() }) });
                let data = null;
                try { data = await res.json(); } catch (e) { throw new Error('サーバーからの応答を読み取れませんでした'); }
                if (data && data.message === 'AUTH_REQUIRED') {
                    logout('パスワードが変更されたか、正しくありません。もう一度入力してください。');
                    throw new Error('ログインし直してください');
                }
                if (!data || data.status === 'error') throw new Error(String((data && data.message) || '処理に失敗しました').replace(/^Error:\s*/, ''));
                return data;
            };

            const fetchData = async (startMonth, endMonth) => {
                if (!adminKeyRef.current) { setIsLoadingData(false); return; }
                setIsFetchingData(true);
                try {
                    const response = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "getAdminData", adminKey: getAdminKey(), month: startMonth, endMonth: endMonth }) });
                    const data = await response.json();
                    if (data.message === 'AUTH_REQUIRED') return logout('パスワードが変更されたか、正しくありません。もう一度入力してください。');
                    if (data.status === 'error') return showMessage("データの取得に失敗しました。");
                    
                    if (data.products) setProducts(data.products.filter(p => !HIDDEN_PRODUCTS.includes(p.name)));
                    if (data.orders) setOrders(data.orders);
                    if (data.analytics) setAnalytics(data.analytics);
                    setInsights(data.insights || null);
                    if (data.stockLogs) setStockLogs(data.stockLogs);
                    if (data.agencies) setAgencies(data.agencies);
                    if (data.agencyPrices) setAgencyPrices(data.agencyPrices);
                    if (data.agencyDeliveries) setAgencyDeliveries(data.agencyDeliveries);
                } catch (error) {
                    console.error("通信エラー:", error);
                } finally {
                    setIsLoadingData(false); setIsFetchingData(false);
                }
            };

            useEffect(() => {
                if (viewStartMonth > viewEndMonth) setViewEndMonth(viewStartMonth);
                fetchData(viewStartMonth, viewEndMonth);
            }, [viewStartMonth, viewEndMonth, adminKey]);

            const handleRefresh = () => fetchData(viewStartMonth, viewEndMonth);

            // 商品をタップ → 在庫の入力画面を開く
            const openStockSheet = (productId) => {
                setSelectedProductId(productId); setType('add'); setAmount(1); setStockMemo(''); setStockSheetOpen(true);
            };

            const handleSubmitStock = async () => {
                if (!selectedProductId) return showMessage("商品を選択してください");
                setIsSubmitting(true);
                try {
                    await postAdmin({ action: "stockUpdate", productId: selectedProductId, type: type, amount: amount, memo: stockMemo });
                    const actionName = type === 'add' ? '収穫' : type === 'sale' ? '店頭販売' : 'ロス';

                                                <thead className="bg-gray-100"><tr><th className="border border-gray-300 p-2 text-center w-10 text-xs">No.</th><th className="border border-gray-300 p-2 text-xs">品名</th><th className="border border-gray-300 p-2 text-right w-20 text-xs">納品数</th><th className="border border-gray-300 p-2 text-right w-24 text-[10px]">店頭単価<br/>(税込)</th><th className="border border-gray-300 p-2 text-right w-24 text-[10px]">委託手数料<br/>(税抜/個)</th><th className="border border-gray-300 p-2 text-right w-24 text-[10px]">卸単価<br/>(税抜/個)</th><th className="border border-gray-300 p-2 text-right w-28 text-xs">卸金額<br/>(税抜)</th></tr></thead>
                                                <tbody>
                                                    {order.itemsList.map((item, i) => (
                                                        <tr key={i}><td className="border border-gray-300 p-2 text-center">{i + 1}</td><td className="border border-gray-300 p-2 font-bold">{item.name}</td><td className="border border-gray-300 p-2 text-right">{item.qty} P</td><td className="border border-gray-300 p-2 text-right text-gray-500">¥{Number(item.storePriceTaxIn || 0).toLocaleString()}</td><td className="border border-gray-300 p-2 text-right text-red-500">-¥{Number(item.feeAmountExTax || 0).toLocaleString()}</td><td className="border border-gray-300 p-2 text-right font-bold">¥{Number(item.billingExTax || 0).toLocaleString()}</td><td className="border border-gray-300 p-2 text-right font-bold text-gray-900">¥{(Number(item.billingExTax || 0) * Number(item.qty || 0)).toLocaleString()}</td></tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                            <div className="mt-8 text-[11px] text-gray-600 p-4 border border-gray-300 rounded">
                                                <p className="font-bold mb-1">【消費税の処理に関する特記事項】</p>
                                                <p className="leading-relaxed">当取引は軽減税率対象商品（飲食料品）の委託販売となります。国税庁の指針に基づき、売上金額（軽減8%）と委託販売手数料（標準10%）の税率が異なるため、相殺（純額処理）を行わず、卸金額を税抜ベースで算出した上で別途消費税を計算しております。</p>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="fixed inset-0 z-[100] bg-gray-100 flex flex-col print-area h-screen overflow-y-auto">
                        <div className="no-print bg-white shadow-md p-4 flex flex-col sm:flex-row justify-between items-center gap-3 sticky top-0 z-10 border-b border-gray-200">
                            <button onClick={() => setPrintOrders([])} className="text-gray-500 hover:text-gray-800 font-bold flex items-center gap-1"><Icons.X className="w-5 h-5"/> 閉じる</button>
                            {printOrders.length === 1 && (
                                <div className="flex items-center gap-2 flex-1 max-w-sm">
                                    <label className="text-sm font-bold text-gray-600 whitespace-nowrap">宛名編集:</label>
                                    <input type="text" value={printName} onChange={e => setPrintName(e.target.value)} className="border border-gray-300 rounded p-1.5 w-full text-sm font-bold bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                </div>
                            )}
                            <button onClick={executePrint} className="px-5 py-2 rounded-lg font-bold shadow-sm flex items-center gap-2 bg-nanairo-dark text-white active:opacity-90"><Icons.Printer className="w-5 h-5"/> 印刷を実行</button>
                        </div>
                        <div className="p-4 sm:p-8 mt-4 overflow-x-auto flex-1">
                            {printOrders.map((order, index) => {
                                const targetName = printOrders.length === 1 ? printName : (order.storeName || order.userName || '');
                                return (
                                    <div key={order.id} className="page-break bg-white p-8 sm:p-12 shadow-sm rounded-lg border border-gray-200 mb-8 w-[800px] min-w-[800px] max-w-[800px] mx-auto text-gray-800 relative min-h-[250mm] pt-12 print:w-full print:min-w-0 print:max-w-none">
                                        <div className="text-right text-sm text-gray-500 mb-6">発行日: {todayText}<br/><span className="font-bold">登録番号: T390001016462</span></div>
                                        <div className="flex justify-between items-start mb-10 border-b-2 border-gray-800 pb-4">
                                            <div><h1 className="text-2xl font-bold border-b border-gray-400 inline-block pb-1 min-w-[200px]">{targetName} <span className="text-lg">様</span></h1></div>
                                            <div className="text-right">
                                                <h2 className="text-3xl font-bold tracking-widest text-gray-800 mb-2">{printType === 'invoice' ? '納 品 書' : '領 収 書'}</h2>
                                                <div className="font-bold text-base">（株）NーSKETCH　のぞみの家</div>
                                                <div className="text-xs text-gray-600 mt-1">〒997-0018 山形県鶴岡市茅原町26-23<br/>TEL 0235-26-0759 / FAX 0235-26-0758</div>
                                            </div>
                                        </div>
                                        {printType === 'receipt' ? (
                                            <div className="mb-12">
                                                <div className="flex items-end gap-4 mb-4 border-b border-gray-400 pb-2"><span className="text-gray-600 font-bold">金額</span><span className="text-4xl font-bold">¥{Number(order.totalPrice || 0).toLocaleString()} <span className="text-lg">-</span></span></div>
                                                <div className="text-gray-600">但 マイクロハーブ代{Number(order.shippingFee || 0) > 0 ? '（配送料を含む）' : ''}として 上記正に領収いたしました。</div>
                                            </div>
                                        ) : (
                                            <div className="mb-10">
                                                <div className="font-bold text-gray-700 mb-2">下記の通り納品申し上げます。</div>
                                                <div className="flex items-end gap-4 mb-6"><span className="text-gray-600 font-bold">御請求金額</span><span className="text-3xl font-bold border-b border-gray-400 pb-1 px-4">¥{Number(order.totalPrice || 0).toLocaleString()}</span><span className="text-sm text-gray-500">(税込)</span></div>
                                            </div>
                                        )}
                                        <table className="w-full text-left border-collapse border border-gray-300 text-sm">
                                            <thead className="bg-gray-100"><tr><th className="border border-gray-300 p-2 text-center w-10">No.</th><th className="border border-gray-300 p-2">品名</th><th className="border border-gray-300 p-2 text-right w-20">数量</th><th className="border border-gray-300 p-2 text-right w-24">単価(税込)</th><th className="border border-gray-300 p-2 text-right w-28">金額(税込)</th></tr></thead>
                                            <tbody>
                                                {order.itemsList && order.itemsList.map((item, i) => {
                                                    const p = products.find(p => p.name === item.name); const up = p ? Number(p.price) : 0;
                                                    return (<tr key={i}><td className="border border-gray-300 p-2 text-center">{i + 1}</td><td className="border border-gray-300 p-2 font-bold">{item.name} <span className="text-[10px] font-normal text-gray-500">※</span></td><td className="border border-gray-300 p-2 text-right">{item.qty} P</td><td className="border border-gray-300 p-2 text-right">¥{up.toLocaleString()}</td><td className="border border-gray-300 p-2 text-right">¥{(up * Number(item.qty)).toLocaleString()}</td></tr>)
                                                })}
                                                {Number(order.shippingFee || 0) > 0 && (
                                                    <tr><td className="border border-gray-300 p-2 text-center">{(order.itemsList ? order.itemsList.length : 0) + 1}</td><td className="border border-gray-300 p-2 font-bold">配送料</td><td className="border border-gray-300 p-2 text-right">1</td><td className="border border-gray-300 p-2 text-right">¥{Number(order.shippingFee).toLocaleString()}</td><td className="border border-gray-300 p-2 text-right">¥{Number(order.shippingFee).toLocaleString()}</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                        {(() => {
                                            const ship = Number(order.shippingFee || 0);
                                            const food = Number(order.totalPrice || 0) - ship;
                                            return (
                                                <div className="mt-3 ml-auto w-72 text-xs text-gray-700 border border-gray-300 rounded p-2 space-y-0.5">
                                                    <div className="flex justify-between"><span>※ 8%対象（軽減税率）</span><span>¥{food.toLocaleString()}（内消費税 ¥{Math.floor(food * 8 / 108).toLocaleString()}）</span></div>
                                                    {ship > 0 && <div className="flex justify-between"><span>10%対象</span><span>¥{ship.toLocaleString()}（内消費税 ¥{Math.floor(ship * 10 / 110).toLocaleString()}）</span></div>}
                                                </div>
                                            );
                                        })()}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            /* ===================== ★管理画面の刷新（v5） ===================== */
            const custKey = (o) => o.userId || ('name:' + (o.storeName || o.userName || ''));
            const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
            const isUnpaid = (o) => o.status === '受渡済' && !o.paidChecked;
            const shortDate = (d) => fmtWhen(d, '').trim();

            // お客様ごとの集計（注文データから作る）
            const customerList = (() => {
                const map = {};
                [...orders].sort((a, b) => String(a.pickupDate).localeCompare(String(b.pickupDate))).forEach(o => {
                    const k = custKey(o);
                    const c = map[k] || (map[k] = { key: k, userName: '', storeName: '', phone: '', address: '', orders: [], count: 0, spend: 0, unpaid: 0, unpaidCount: 0, first: '', last: '', items: {} });
                    c.orders.push(o);
                    if (o.userName) c.userName = o.userName;
                    if (o.storeName) c.storeName = o.storeName;
                    if (o.phone) c.phone = o.phone;
                    if (o.address) c.address = o.address;
                    if (o.status === 'キャンセル') return;
                    c.count++; c.spend += Number(o.totalPrice || 0);
                    if (!c.first) c.first = o.pickupDate;
                    c.last = o.pickupDate;
                    if (isUnpaid(o)) { c.unpaid += Number(o.totalPrice || 0); c.unpaidCount++; }
                    (o.itemsList || []).forEach(i => { c.items[i.name] = (c.items[i.name] || 0) + i.qty; });
                });
                return Object.values(map).map(c => {
                    const dates = c.orders.filter(o => o.status !== 'キャンセル').map(o => o.pickupDate).sort();
                    const gap = dates.length >= 2 ? Math.round(daysBetween(dates[0], dates[dates.length - 1]) / (dates.length - 1)) : null;
                    const since = c.last ? daysBetween(c.last, todayStr) : null;
                    const followUp = since != null && since >= (gap ? Math.max(21, gap * 2) : 30);
                    const favorites = Object.entries(c.items).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([n]) => n);
                    return { ...c, name: c.storeName || c.userName || '（名前なし）', avgGap: gap, daysSince: since, followUp, favorites };
                }).sort((a, b) => String(b.last).localeCompare(String(a.last)));
            })();
            const customerOf = (o) => customerList.find(c => c.key === custKey(o));

            // 状態を直接変える（詳細の①②③、まとめて準備完了で使う）
            const setOrderStatus = async (order, newStatus) => {
                if (!order || order.status === newStatus || order.status === 'キャンセル') return;
                const prev = order.status;
                setOrders(p => p.map(o => o.id === order.id ? { ...o, status: newStatus } : o));
                try { await postAdmin({ action: "statusUpdate", orderId: order.id, newStatus }); }
                catch (e) { showMessage("状態の更新に失敗しました: " + e.message, 6000); setOrders(p => p.map(o => o.id === order.id ? { ...o, status: prev } : o)); }
            };

            // お客様ごとの請求明細書（指定した注文から作る）
            const openCustomerReport = (c, list) => {
                const valid = list.filter(o => o.status !== 'キャンセル').sort((a, b) => a.pickupDate.localeCompare(b.pickupDate));
                if (valid.length === 0) return showMessage('対象の注文がありません。');
                const detailedOrders = [];
                valid.forEach(o => {
                    (o.itemsList || []).forEach(i => { const p = products.find(x => x.name === i.name); detailedOrders.push({ date: o.pickupDate, name: i.name, qty: i.qty, unitPrice: p ? Number(p.price) : 0 }); });
                    if (o.shippingFee > 0) detailedOrders.push({ date: o.pickupDate, name: '配送料', qty: 1, unitPrice: o.shippingFee, isShipping: true });
                });
                setPrintOrders([{ id: 'report-' + c.key, userName: c.name, detailedOrders }]); setPrintType('monthly_report');
                setPrintName(c.name); setPrintHonorific(c.storeName ? '御中' : '様');
                const last = valid[valid.length - 1].pickupDate;
                setReportStartDate(valid[0].pickupDate); setReportEndDate(last); setReportClosingDate(last);
            };

            // 選んだ月の注文をCSVで保存（会計・税理士さん向け）
            const downloadCsv = () => {
                const rows = [['注文ID', '注文日時', '受取日', '時間', '受取方法', 'お名前', '店舗名', '商品', '合計', '配送料', '状態', '集金', '住所', '電話']];
                orders.filter(inViewPeriod).sort((a, b) => a.pickupDate.localeCompare(b.pickupDate)).forEach(o => rows.push([
                    o.id, o.orderDate, o.pickupDate, o.pickupTime, o.deliveryMethod, o.userName, o.storeName,
                    (o.itemsList || []).map(i => `${i.name}×${i.qty}`).join(' / '), o.totalPrice, o.shippingFee, o.status, o.paidChecked ? '済' : '', o.address, o.phone
                ]));
                const csv = '﻿' + rows.map(r => r.map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
                a.download = `注文_${viewStartMonth}.csv`;
                a.click();
            };

            // 準備リストを印刷（別の画面を開いて印刷）
            const printPrepList = (label, rows) => {
                const w = window.open('', '_blank');
                if (!w) return showMessage('ポップアップを許可してください');
                w.document.write(`<html><head><meta charset="utf-8"><title>準備リスト</title><style>body{font-family:sans-serif;padding:24px}h2{margin:0 0 12px}td{padding:8px 16px;border-bottom:1px solid #ddd;font-size:20px}</style></head><body><h2>準備リスト ${label}</h2><table>${rows.map(r => `<tr><td>${r.name}</td><td style="text-align:right"><b>${r.qty}</b></td></tr>`).join('')}</table></body></html>`);
                w.document.close(); w.print();
            };

            // 在庫のまとめて入力
            const submitBulk = async () => {
                const items = products.filter(p => (bulkQty[p.id] || 0) > 0);
                if (items.length === 0) return;
                if (bulkType !== 'add') {
                    const over = items.find(p => bulkQty[p.id] > p.stock);
                    if (over) return showMessage(`${over.name} は在庫（${over.stock}）より多い数です`, 5000);
                }
                setBulkRunning(true);
                let done = 0;
                try {
                    for (const p of items) {
                        await postAdmin({ action: "stockUpdate", productId: p.id, type: bulkType, amount: bulkQty[p.id], memo: 'まとめて入力' });
                        done++; setBulkProgress(done);
                    }
                    showMessage(`${done}商品をまとめて記録しました`);
                    setBulkQty({}); setBulkMode(false);
                } catch (e) {
                    showMessage(`${done}商品まで記録しました。残りは記録できませんでした: ${e.message}`, 8000);
                } finally {
                    setBulkRunning(false); setBulkProgress(0); fetchData(viewStartMonth, viewEndMonth);
                }
            };

            const statusChip = (o) => {
                const [cls, label] = o.status === '未対応' ? ['bg-amber-100 text-amber-800', '未対応']
                    : o.status === '準備完了' ? ['bg-green-100 text-nanairo-dark', '準備完了']
                    : o.status === 'キャンセル' ? ['bg-gray-100 text-gray-500', 'キャンセル']
                    : o.paidChecked ? ['bg-green-50 text-nanairo-dark', '集金済'] : ['bg-red-50 text-red-600 border border-red-200', '未集金'];
                return <span className={`text-xs font-bold px-2 py-1 rounded-full whitespace-nowrap ${cls}`}>{label}</span>;
            };

            // 注文の1行（一覧・検索・台帳で共通）
            const orderRow = (o, showDate) => {
                const isDeliv = o.deliveryMethod === '配送';
                const [, m, d] = String(o.pickupDate).split('-').map(Number);
                return (
                    <button key={o.id} type="button" onClick={() => setSelectedOrderId(o.id)} className={`w-full text-left p-3 flex items-center gap-3 active:bg-gray-50 ${selectedOrderId === o.id ? 'bg-nanairo-light' : ''} ${o.status === 'キャンセル' ? 'opacity-50' : ''}`}>
                        <div className="text-center w-12 shrink-0">
                            <div className={`text-xs font-bold ${isDeliv ? 'text-blue-600' : 'text-gray-500'}`}>{isDeliv ? '配送' : '店頭'}</div>
                            <div className="text-sm font-bold text-gray-900">{showDate ? `${m}/${d}` : String(o.pickupTime).split('-')[0]}</div>
                        </div>
                        <div className="flex-1 min-w-0">
                            <div className={`font-bold text-gray-900 truncate ${o.status === 'キャンセル' ? 'line-through' : ''}`}>{o.storeName || o.userName}</div>
                            <div className="text-xs text-gray-500 truncate">{(o.itemsList || []).map(i => `${i.name}×${i.qty}`).join('、')}　¥{Number(o.totalPrice || 0).toLocaleString()}</div>
                        </div>
                        {statusChip(o)}
                    </button>
                );
            };

            const Switch = ({ on }) => (
                <span className={`relative inline-block w-10 h-6 rounded-full transition-colors shrink-0 ${on ? 'bg-nanairo-dark' : 'bg-gray-300'}`}>
                    <span className={`absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all ${on ? 'left-[18px]' : 'left-0.5'}`}></span>
                </span>
            );

            // 注文の詳細
            const renderOrderDetail = (order) => {
                const c = customerOf(order);
                const isDeliv = order.deliveryMethod === '配送';
                const isCancelled = order.status === 'キャンセル';
                const steps = [['未対応', '未対応'], ['準備完了', '準備完了'], ['受渡済', isDeliv ? '配達済' : 'お渡し済']];
                const cur = steps.findIndex(s => s[0] === order.status);
                const next = order.status === '未対応' ? ['準備完了', '準備完了にする'] : order.status === '準備完了' ? ['受渡済', isDeliv ? '配達済にする' : 'お渡し済にする'] : null;
                const valid = c ? c.orders.filter(o => o.status !== 'キャンセル') : [];
                const orderNo = valid.filter(o => o.pickupDate <= order.pickupDate).length;
                const prevOrder = valid.filter(o => o.pickupDate < order.pickupDate).slice(-1)[0];
                return (
                    <div className="space-y-3">
                        <div className="flex items-start justify-between gap-2">
                            <div className="min-w-0">
                                <div className="text-xs text-gray-500">{order.orderDate} に注文</div>
                                <h3 className="text-xl font-bold text-gray-900 leading-tight">{order.storeName || order.userName}</h3>
                                {order.storeName && <div className="text-sm text-gray-500">{order.userName} 様</div>}
                                <div className="flex flex-wrap gap-1 mt-1.5 text-[11px] font-bold">
                                    {orderNo > 0 && <span className="px-2 py-0.5 rounded-full bg-nanairo-light text-nanairo-dark">利用 {orderNo}回目</span>}
                                    {prevOrder && <span className="px-2 py-0.5 rounded-full bg-gray-100 text-gray-600">前回 {shortDate(prevOrder.pickupDate)}</span>}
                                    {c && c.unpaid > 0 && <span className="px-2 py-0.5 rounded-full bg-red-50 text-red-600">未集金 ¥{c.unpaid.toLocaleString()}</span>}
                                </div>
                            </div>
                            <div className="flex gap-1.5 shrink-0">
                                <button type="button" title="納品書" onClick={() => openPrintPreview(order, 'invoice')} className="h-9 px-2.5 rounded-full bg-white border border-gray-200 flex items-center gap-1 text-xs font-bold text-gray-600"><Icons.FileText className="w-4 h-4" />納品書</button>
                                <button type="button" title="領収書" onClick={() => openPrintPreview(order, 'receipt')} className="h-9 px-2.5 rounded-full bg-white border border-gray-200 flex items-center gap-1 text-xs font-bold text-gray-600"><Icons.Printer className="w-4 h-4" />領収書</button>
                            </div>
                        </div>

                        {isCancelled ? (
                            <div className="rounded-xl bg-gray-100 text-gray-500 font-bold text-center py-2.5 text-sm">キャンセルされた注文です</div>
                        ) : (
                            <div className="grid grid-cols-3 gap-1 bg-white rounded-xl p-1 text-xs font-bold border border-gray-200">
                                {steps.map(([st, label], i) => (
                                    <button key={st} type="button" onClick={() => setOrderStatus(order, st)} className={`rounded-lg py-2 ${i === cur ? (i === 0 ? 'bg-amber-100 text-amber-800' : 'bg-nanairo-light text-nanairo-dark') : i < cur ? 'text-nanairo-dark' : 'text-gray-400'}`}>
                                        {i < cur ? '✓ ' : `${'①②③'[i]} `}{label}
                                    </button>
                                ))}
                            </div>
                        )}

                        <div className="bg-white rounded-2xl border border-gray-200 divide-y divide-gray-100">
                            <div className="flex items-center gap-3 px-4 py-3"><span className="text-lg">{isDeliv ? '🚚' : '🏪'}</span><div className="flex-1"><div className="text-xs text-gray-500">{isDeliv ? '配送' : '店頭受取'}</div><div className="font-bold text-gray-900 flex flex-wrap items-center">{fmtWhen(order.pickupDate, order.pickupTime)}{dayBadge(order.pickupDate)}</div></div></div>
                            {isDeliv && (
                                <div className="flex items-center gap-3 px-4 py-3"><span className="text-lg">📍</span><div className="flex-1 min-w-0"><div className="text-xs text-gray-500">お届け先</div><div className="font-bold text-gray-900">{order.address || '（住所未入力）'}</div></div>
                                    {order.address && <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('山形県' + order.address)}`} target="_blank" rel="noopener" className="text-xs font-bold text-nanairo-dark border border-nanairo-dark rounded-full px-3 py-1.5 shrink-0">地図</a>}</div>
                            )}
                            {order.phone && (
                                <div className="flex items-center gap-3 px-4 py-3"><span className="text-lg">📞</span><div className="flex-1"><div className="text-xs text-gray-500">電話</div><div className="font-bold text-gray-900">{order.phone}</div></div><a href={`tel:${order.phone}`} className="text-xs font-bold text-nanairo-dark border border-nanairo-dark rounded-full px-3 py-1.5 shrink-0">発信</a></div>
                            )}
                            {order.memo && order.memo !== 'なし' && (
                                <div className="flex items-start gap-3 px-4 py-3"><span className="text-lg">💬</span><div className="flex-1"><div className="text-xs text-gray-500">お客様からの備考</div><div className="text-sm text-gray-900">{order.memo}</div></div></div>

                        <div className="bg-white rounded-2xl border border-gray-200 px-4 py-3 text-sm">

                            {isDeliv && <div className="flex justify-between py-1 text-gray-500"><span>配送料</span><span>{order.shippingFee > 0 ? `¥${Number(order.shippingFee).toLocaleString()}` : '無料'}</span></div>}
                            <div className="flex justify-between pt-2 mt-1 border-t border-gray-100"><b className="text-gray-900">合計（現金）</b><b className="text-lg text-gray-900">¥{Number(order.totalPrice || 0).toLocaleString()}</b></div>
                        </div>

                        {!isCancelled && (
                            <div className="bg-white rounded-2xl border border-gray-200 divide-y divide-gray-100 text-sm">
                                {[['senmu', '専務確認', 'senmuChecked'], ['cafe', 'カフェ確認', 'cafeChecked'], ['paid', '集金済', 'paidChecked']].map(([role, label, f]) => (
                                    <button key={role} type="button" onClick={() => toggleCheck(order.id, role, !order[f])} className="w-full flex items-center justify-between px-4 py-2.5"><span className="text-gray-700">{label}</span><Switch on={!!order[f]} /></button>
                                ))}
                            </div>
                        )}

                        {c && <button type="button" onClick={() => { setSelectedOrderId(null); setActiveTab('customers'); setSelectedCustomerKey(c.key); }} className="w-full text-right text-xs font-bold text-nanairo-dark">このお客様の台帳を開く ›</button>}
                        {next && <button type="button" onClick={() => setOrderStatus(order, next[0])} className="w-full rounded-xl py-3.5 bg-nanairo-dark text-white font-bold active:opacity-90">{next[1]}</button>}
                        {!isCancelled && cur > 0 && <button type="button" onClick={() => setOrderStatus(order, steps[cur - 1][0])} className="w-full text-center text-xs text-gray-400 underline">ひとつ前の状態に戻す</button>}
                    </div>
                );
            };

            // 注文タブ
            const renderOrdersTab = () => {
                const activeOrders = orders.filter(o => o.status === '未対応' || o.status === '準備完了')
                    .sort((a, b) => (a.pickupDate + a.pickupTime).localeCompare(b.pickupDate + b.pickupTime));
                const q = orderSearch.trim().toLowerCase().replace(/-/g, '');
                const results = q ? orders.filter(o => [o.userName, o.storeName, o.phone].some(v => String(v || '').toLowerCase().replace(/-/g, '').includes(q)))
                    .sort((a, b) => String(b.pickupDate).localeCompare(String(a.pickupDate))) : [];
                const todays = activeOrders.filter(o => o.pickupDate === todayStr);
                const unpaidCount = orders.filter(isUnpaid).length;

                // 準備リスト（今日・明日）
                const prepDate = prepDay === 'today' ? todayStr : tomorrowStr;
                const prepOrders = activeOrders.filter(o => o.pickupDate === prepDate);
                const prepMap = {};
                prepOrders.forEach(o => (o.itemsList || []).forEach(i => { prepMap[i.name] = (prepMap[i.name] || 0) + i.qty; }));
                const prepRows = Object.entries(prepMap).sort((a, b) => b[1] - a[1]).map(([name, qty]) => ({ name, qty, left: (products.find(p => p.name === name) || {}).stock }));

                // 配送日ごとのルート（今日以降・未配達の配送のみ）。出発地は現在地、市町村ごとにまとめて並べる
                const AREA_ORDER = ["鶴岡市", "三川町", "庄内町", "酒田市", "遊佐町"];
                const areaRank = (addr) => { const i = AREA_ORDER.findIndex(a => String(addr).startsWith(a)); return i < 0 ? 99 : i; };
                const routeByDate = {};
                activeOrders.filter(o => o.deliveryMethod === '配送' && o.address && o.pickupDate >= todayStr).forEach(o => { (routeByDate[o.pickupDate] = routeByDate[o.pickupDate] || []).push(o); });
                const deliveryRoutes = Object.keys(routeByDate).sort().map(date => {
                    const stops = [...new Set(routeByDate[date].slice().sort((a, b) => areaRank(a.address) - areaRank(b.address) || a.address.localeCompare(b.address, 'ja')).map(o => '山形県' + o.address))];
                    const url = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(stops[stops.length - 1])
                        + (stops.length > 1 ? '&waypoints=' + encodeURIComponent(stops.slice(0, -1).join('|')) : '');
                    return { date, url, label: date === todayStr ? `今日（${shortDate(date)}）` : shortDate(date), count: routeByDate[date].length };
                });

                const groups = [
                    { key: 'late', label: '日付を過ぎた注文', badge: 'bg-gray-700', list: activeOrders.filter(o => o.pickupDate < todayStr) },
                    { key: 'today', label: '今日', badge: 'bg-red-500', list: todays },
                    { key: 'tomorrow', label: '明日', badge: 'bg-orange-400', list: activeOrders.filter(o => o.pickupDate === tomorrowStr) },
                    { key: 'later', label: 'それ以降', badge: 'bg-gray-400', list: activeOrders.filter(o => o.pickupDate > tomorrowStr) },
                ];
                const markTodayReady = async () => {
                    const list = todays.filter(o => o.status === '未対応');
                    for (const o of list) await setOrderStatus(o, '準備完了');
                    showMessage(`${list.length}件を準備完了にしました`);
                };

                // 済んだ注文
                const done = orders.filter(o => (o.status === '受渡済' || o.status === 'キャンセル') && inViewPeriod(o)).sort((a, b) => String(b.pickupDate).localeCompare(String(a.pickupDate)));
                const doneCounts = { all: done.length, unpaid: done.filter(isUnpaid).length, done: done.filter(o => o.status === '受渡済').length, cancel: done.filter(o => o.status === 'キャンセル').length };
                const doneShown = done.filter(o => doneFilter === 'all' || (doneFilter === 'unpaid' ? isUnpaid(o) : doneFilter === 'done' ? o.status === '受渡済' : o.status === 'キャンセル'));
                const selectedOrder = orders.find(o => o.id === selectedOrderId);

                return (
                    <div className="lg:flex lg:gap-6 lg:items-start">
                        <div className="space-y-4 lg:w-[440px] lg:shrink-0">
                            <div className="flex items-center gap-2">
                                <div className="flex-1 flex items-center gap-2 bg-white border border-gray-200 rounded-xl px-3">
                                    <span className="text-gray-400">🔍</span>
                                    <input type="search" value={orderSearch} onChange={e => setOrderSearch(e.target.value)} placeholder="お名前・店舗名・電話番号で探す" className="flex-1 min-w-0 py-2.5 text-sm outline-none bg-transparent" />
                                    {orderSearch && <button type="button" onClick={() => setOrderSearch('')} className="text-gray-400"><Icons.X className="w-4 h-4" /></button>}
                                </div>
                                <button type="button" onClick={handleRefresh} disabled={isFetchingData} className="p-2.5 bg-white rounded-xl border border-gray-200 text-gray-500" title="最新にする"><Icons.RefreshCw className={`w-5 h-5 ${isFetchingData ? 'animate-spin' : ''}`} /></button>
                            </div>

                            {q ? (
                                <div>
                                    <div className="text-sm font-bold text-gray-700 mb-1.5">「{orderSearch}」の検索結果　{results.length}件</div>
                                    {results.length === 0 ? <div className="text-center py-8 bg-white rounded-2xl border border-gray-200 text-gray-500 text-sm">見つかりませんでした</div>
                                        : <div className="bg-white rounded-2xl border border-gray-200 divide-y divide-gray-100 overflow-hidden">{results.map(o => orderRow(o, true))}</div>}
                                </div>
                            ) : (<>
                                <div className="grid grid-cols-3 gap-2 text-center">
                                    <div className="bg-white rounded-2xl border border-gray-200 py-2"><div className="text-[10px] text-gray-500">今日の受け取り</div><b className="text-xl">{todays.filter(o => o.deliveryMethod !== '配送').length}<span className="text-xs font-normal">件</span></b></div>
                                    <div className="bg-white rounded-2xl border border-gray-200 py-2"><div className="text-[10px] text-gray-500">今日の配送</div><b className="text-xl text-blue-600">{todays.filter(o => o.deliveryMethod === '配送').length}<span className="text-xs font-normal">件</span></b></div>
                                    <button type="button" onClick={() => { setActiveTab('more'); setMoreView('receivables'); }} className={`bg-white rounded-2xl border py-2 ${unpaidCount ? 'border-red-200' : 'border-gray-200'}`}><div className="text-[10px] text-gray-500">未集金</div><b className={`text-xl ${unpaidCount ? 'text-red-500' : ''}`}>{unpaidCount}<span className="text-xs font-normal">件</span></b></button>
                                </div>

                                <div className="bg-white rounded-2xl border border-gray-200 p-3">
                                    <div className="flex items-center justify-between">
                                        <b className="text-sm text-gray-900">📦 準備リスト</b>
                                        <div className="flex items-center gap-1">
                                            <div className="flex bg-gray-100 rounded-lg p-0.5 text-xs font-bold">
                                                {[['today', '今日'], ['tomorrow', '明日']].map(([k, l]) => <button key={k} type="button" onClick={() => setPrepDay(k)} className={`px-2.5 py-1 rounded-md ${prepDay === k ? 'bg-white shadow-sm text-gray-900' : 'text-gray-500'}`}>{l}</button>)}
                                            </div>
                                            {prepRows.length > 0 && <button type="button" onClick={() => printPrepList(shortDate(prepDate), prepRows)} className="text-[11px] font-bold text-gray-500 border border-gray-200 rounded-full px-2 py-1">🖨 印刷</button>}
                                        </div>
                                    </div>
                                    <div className="text-xs text-gray-500 mt-0.5">{shortDate(prepDate)} に渡す {prepOrders.length}件の合計（在庫から取り置き済み）</div>
                                    {prepRows.length === 0 ? <div className="text-sm text-gray-400 text-center py-3">準備するものはありません</div> : (
                                        <div className="mt-1 divide-y divide-gray-100 text-sm">
                                            {prepRows.map(r => <div key={r.name} className="flex justify-between items-center py-1.5"><span>{r.name}</span><span><b className="text-lg">{r.qty}</b> <span className="text-xs text-gray-400">残り {r.left != null ? r.left : '-'}</span></span></div>)}
                                        </div>
                                    )}
                                </div>

                                {deliveryRoutes.length > 0 && (
                                    <div className="flex flex-col gap-2">
                                        {deliveryRoutes.map(r => (
                                            <a key={r.date} href={r.url} target="_blank" rel="noopener" className="flex items-center justify-between bg-nanairo-dark text-white rounded-xl px-4 py-3 font-bold text-sm shadow-sm">
                                                <span className="flex items-center gap-2"><Icons.MapPin className="w-5 h-5" />{r.label} の配送ルートを開く</span>
                                                <span className="text-xs font-normal bg-white/20 px-2 py-0.5 rounded-full">{r.count}件</span>
                                            </a>
                                        ))}
                                    </div>
                                )}

                                {activeOrders.length === 0 ? <div className="text-center py-8 bg-white rounded-2xl border border-gray-200 text-gray-500 text-sm">対応が必要な注文はありません</div>
                                    : groups.filter(g => g.list.length > 0 || g.key === 'today').map(g => (
                                        <div key={g.key}>
                                            <div className="flex items-center gap-2 mb-1.5">
                                                <span className={`text-xs font-bold text-white px-2 py-0.5 rounded ${g.badge}`}>{g.label}</span>
                                                <span className="text-sm font-bold text-gray-700">{g.key === 'today' ? shortDate(todayStr) : g.key === 'tomorrow' ? shortDate(tomorrowStr) : ''}　{g.list.length}件</span>
                                                {g.key === 'today' && g.list.some(o => o.status === '未対応') && <button type="button" onClick={markTodayReady} className="ml-auto text-[11px] font-bold text-nanairo-dark">まとめて準備完了</button>}
                                            </div>
                                            {g.list.length > 0 && <div className="bg-white rounded-2xl border border-gray-200 divide-y divide-gray-100 overflow-hidden">{g.list.map(o => orderRow(o, g.key === 'later' || g.key === 'late'))}</div>}
                                        </div>
                                    ))}

                                <div className="pt-2">
                                    <div className="flex items-center justify-between mb-2">
                                        <h3 className="font-bold text-gray-900">済んだ注文</h3>
                                        <input type="month" value={viewStartMonth} onChange={e => { if (e.target.value) { setViewStartMonth(e.target.value); setViewEndMonth(e.target.value); } }} className="bg-white border border-gray-200 rounded-lg px-2 py-1 text-xs font-bold text-gray-700 min-w-0 appearance-none" />
                                    </div>
                                    <div className="flex gap-1.5 mb-2 text-xs font-bold overflow-x-auto">
                                        {[['all', 'すべて'], ['unpaid', '未集金'], ['done', 'お渡し済'], ['cancel', 'キャンセル']].map(([k, l]) => (
                                            <button key={k} type="button" onClick={() => setDoneFilter(k)} className={`px-3 py-1.5 rounded-full whitespace-nowrap border ${doneFilter === k ? 'bg-gray-900 text-white border-gray-900' : k === 'unpaid' && doneCounts.unpaid ? 'bg-white text-red-600 border-red-200' : 'bg-white text-gray-600 border-gray-200'}`}>{l} {doneCounts[k]}</button>
                                        ))}
                                    </div>
                                    {doneShown.length === 0 ? <div className="text-center py-6 bg-white rounded-2xl border border-gray-200 text-gray-400 text-sm">この月の注文はありません</div>
                                        : <div className="bg-white rounded-2xl border border-gray-200 divide-y divide-gray-100 overflow-hidden">{doneShown.map(o => orderRow(o, true))}</div>}
                                    <div className="flex gap-2 mt-2">
                                        <button type="button" onClick={() => openBulkPrintPreview('invoice')} className="flex-1 bg-white border border-gray-200 rounded-xl py-2 text-xs font-bold text-gray-600">🧾 この月の納品書をまとめて</button>
                                        <button type="button" onClick={() => openBulkPrintPreview('receipt')} className="flex-1 bg-white border border-gray-200 rounded-xl py-2 text-xs font-bold text-gray-600">🧾 この月の領収書をまとめて</button>
                                    </div>
                                </div>
                            </>)}
                        </div>

                        {/* iPad・PC：右側に詳細 */}
                        <aside className="hidden lg:block flex-1 sticky top-20">
                            {selectedOrder ? renderOrderDetail(selectedOrder) : (
                                <div className="bg-white rounded-2xl border border-dashed border-gray-300 p-10 text-center text-gray-400">
                                    <img src="images/logo.png" alt="" className="w-20 h-20 object-contain mx-auto opacity-60" />
                                    <p className="mt-2 text-sm">左の一覧から注文を選ぶと、ここに詳細が出ます</p>
                                </div>
                            )}
                        </aside>
                    </div>
                );
            };

            // 在庫タブ
            const STOCK_TYPES = [['add', '🌱 収穫', 'bg-nanairo-dark'], ['sale', '🛒 販売', 'bg-blue-600'], ['remove', '🗑 ロス', 'bg-red-500']];
            const LOG_META = {
                '収穫': ['🌱', 'bg-nanairo-light', 'text-nanairo-dark', '+'], '店頭販売': ['🛒', 'bg-blue-50', 'text-blue-600', '−'], 'ロス': ['🗑', 'bg-red-50', 'text-red-500', '−'],
                '委託納品': ['🏪', 'bg-orange-50', 'text-orange-600', '−'], '委託ロス': ['🏪', 'bg-orange-50', 'text-orange-600', ''], '納品取消': ['↩', 'bg-gray-100', 'text-gray-600', '+'], '精算取消': ['↩', 'bg-gray-100', 'text-gray-600', '']
            };
            const renderInventoryTab = () => {
                const suggest = (id) => { const r = insights && insights.products ? insights.products.find(x => x.id === id) : null; return r ? r.suggestedWeekly : null; };
                if (bulkMode) {
                    const cur = STOCK_TYPES.find(t => t[0] === bulkType);
                    const picked = products.filter(p => (bulkQty[p.id] || 0) > 0);
                    const total = picked.reduce((a, p) => a + bulkQty[p.id], 0);
                    const setQ = (id, v) => setBulkQty(prev => ({ ...prev, [id]: Math.max(0, v) }));
                    return (
                        <div className="space-y-3 pb-20">
                            <button type="button" onClick={() => { setBulkMode(false); setBulkQty({}); }} className="text-sm font-bold text-nanairo-dark">‹ 在庫にもどる</button>
                            <div className="flex items-center justify-between"><h2 className="text-lg font-bold text-gray-900">まとめて入力</h2><span className="text-xs text-gray-500">{shortDate(todayStr)}</span></div>
                            <div className="grid grid-cols-3 gap-1 bg-gray-100 rounded-xl p-1 text-sm font-bold">
                                {STOCK_TYPES.map(([k, label, bg]) => <button key={k} type="button" onClick={() => setBulkType(k)} className={`rounded-lg py-2.5 ${bulkType === k ? `${bg} text-white shadow-sm` : 'text-gray-600'}`}>{label}</button>)}
                            </div>
                            <div className="bg-white rounded-2xl border border-gray-200 divide-y divide-gray-100">
                                <div className="flex items-center gap-2 px-3 py-2 text-[11px] font-bold text-gray-500"><span className="flex-1">商品</span><span className="w-10 text-center">在庫</span>{bulkType === 'add' && <span className="w-10 text-center">目安</span>}<span className="w-32 text-center">{cur[1].slice(2)}する数</span></div>
                                {products.map(p => {
                                    const v = bulkQty[p.id] || 0;
                                    const over = bulkType !== 'add' && v > p.stock;
                                    return (
                                        <div key={p.id} className="flex items-center gap-2 px-3 py-2">
                                            <span className="flex-1 text-sm font-bold text-gray-900 truncate">{p.name}</span>
                                            <span className={`w-10 text-center text-sm ${p.stock <= 0 ? 'text-gray-300' : p.stock <= 5 ? 'text-orange-500 font-bold' : 'text-gray-700'}`}>{p.stock}</span>
                                            {bulkType === 'add' && <span className="w-10 text-center text-xs text-gray-400">{suggest(p.id) != null ? suggest(p.id) : '-'}</span>}
                                            <div className="w-32 flex items-center justify-between">
                                                <button type="button" onClick={() => setQ(p.id, v - 1)} className="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center text-gray-500"><Icons.Minus className="w-4 h-4" /></button>
                                                <input type="number" inputMode="numeric" min="0" value={v || ''} placeholder="0" onChange={e => setQ(p.id, parseInt(e.target.value, 10) || 0)} className={`w-12 text-center font-bold outline-none bg-transparent ${over ? 'text-red-600' : v ? 'text-nanairo-dark' : 'text-gray-300'}`} />
                                                <button type="button" onClick={() => setQ(p.id, v + 1)} className="w-8 h-8 rounded-full bg-nanairo-dark text-white flex items-center justify-center"><Icons.Plus className="w-4 h-4" /></button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                            {bulkType === 'add' && insights && insights.products && (
                                <button type="button" onClick={() => { const next = {}; products.forEach(p => { const s = suggest(p.id); if (s) next[p.id] = s; }); setBulkQty(next); }} className="w-full text-right text-xs font-bold text-nanairo-dark">目安の数をまとめて入れる</button>
                            )}
                            <div className="fixed left-0 right-0 bottom-[76px] lg:bottom-0 z-30 mx-auto w-full max-w-[600px] lg:max-w-[1120px] px-4 py-3 bg-gradient-to-t from-gray-100 to-transparent">
                                <button type="button" onClick={submitBulk} disabled={bulkRunning || picked.length === 0} className={`w-full rounded-xl py-3.5 text-white font-bold shadow-lg flex justify-center items-center gap-2 ${bulkRunning || picked.length === 0 ? 'bg-gray-300' : cur[2]}`}>
                                    {bulkRunning ? <><div className="spinner"></div> 記録中… {bulkProgress}/{picked.length}</> : picked.length === 0 ? '数を入れてください' : `${picked.length}商品・${cur[1].slice(2)} ${total} をまとめて記録`}
                                </button>
                            </div>
                        </div>
                    );
                }

                // 最近の記録（日ごと）
                const md = (offset) => new Date(Date.now() + 9 * 3600 * 1000 - offset * 86400000).toISOString().slice(5, 10).replace('-', '/');
                const dayLabel = (d) => d === md(0) ? '今日' : d === md(1) ? '昨日' : d.replace(/^0/, '').replace('/0', '/');
                const logGroups = [];
                stockLogs.forEach(log => {
                    const d = String(log.date).slice(0, 5);
                    let g = logGroups.find(x => x.d === d);
                    if (!g) logGroups.push(g = { d, list: [] });
                    g.list.push(log);
                });
                return (
                    <div className="space-y-4">
                        <div className="flex justify-between items-center">
                            <h1 className="text-lg font-bold text-gray-900">在庫</h1>
                            <div className="flex gap-2">
                                <button type="button" onClick={() => { setBulkType('add'); setBulkMode(true); }} className="text-sm font-bold text-white bg-nanairo-dark rounded-full px-4 py-2">まとめて入力</button>
                                <button type="button" onClick={handleRefresh} disabled={isFetchingData} className="p-2 bg-white rounded-full border border-gray-200 text-gray-500"><Icons.RefreshCw className={`w-5 h-5 ${isFetchingData ? 'animate-spin' : ''}`} /></button>
                            </div>
                        </div>
                        <p className="text-xs text-gray-500 -mt-2">商品をタップして1つずつ、または「まとめて入力」で全商品を一度に記録します。</p>
                        <section className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2">
                            {products.map(p => (
                                <button key={p.id} type="button" onClick={() => openStockSheet(p.id)} className="bg-white rounded-xl border border-gray-200 overflow-hidden text-left active:scale-[0.98] transition-transform">
                                    {IMAGE_MAP[p.name] ? <img src={IMAGE_MAP[p.name]} alt="" loading="lazy" className={`w-full h-20 object-cover ${p.stock <= 0 ? 'grayscale opacity-60' : ''}`} /> : <div className="w-full h-20 bg-nanairo-light flex items-center justify-center text-nanairo-dark text-xs font-bold">{p.name}</div>}
                                    <div className="p-2 flex items-end justify-between gap-1">
                                        <div className="min-w-0"><div className="font-bold text-sm text-gray-900 truncate">{p.name}</div><div className="text-xs text-gray-500">{p.weight}</div></div>
                                        <span className={`text-2xl font-bold leading-none ${p.stock <= 0 ? 'text-gray-300' : p.stock <= 5 ? 'text-orange-500' : 'text-gray-900'}`}>{p.stock}</span>
                                    </div>
                                </button>
                            ))}
                        </section>

                        <div>
