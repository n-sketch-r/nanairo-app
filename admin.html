                                        <h3 className="font-bold text-gray-900">済んだ注文{viewStartMonth !== viewEndMonth && <span className="ml-1 text-xs font-normal text-gray-500">（{Number(viewStartMonth.slice(5))}〜{Number(viewEndMonth.slice(5))}月）</span>}</h3>
                                        <input type="month" value={viewStartMonth} onChange={e => { if (e.target.value) { setViewStartMonth(e.target.value); setViewEndMonth(e.target.value); } }} className="bg-white border border-gray-200 rounded-lg px-2 py-1 text-xs font-bold text-gray-700 min-w-0 appearance-none" />
                                    </div>
                                    <div className="flex gap-1.5 mb-2 text-xs font-bold overflow-x-auto">
                                        {[['all', 'すべて'], ['unpaid', '未集金'], ['done', 'お渡し済'], ['cancel', 'キャンセル']].map(([k, l]) => (
                                            <button key={k} type="button" onClick={() => setDoneFilter(k)} className={`px-3 py-1.5 rounded-full whitespace-nowrap border ${doneFilter === k ? 'bg-gray-900 text-white border-gray-900' : k === 'unpaid' && doneCounts.unpaid ? 'bg-white text-red-600 border-red-200' : 'bg-white text-gray-600 border-gray-200'}`}>{l} {doneCounts[k]}</button>
                                        ))}
                                    </div>
                                    {doneShown.length === 0 ? <div className="text-center py-6 bg-white rounded-2xl border border-gray-200 text-gray-400 text-sm">この月の注文はありません</div>
                                        : <div className="bg-white rounded-2xl border border-gray-200 divide-y divide-gray-100 overflow-hidden">{doneShown.map(o => orderRow(o, true))}</div>}
                                    <div className="flex gap-2 mt-2">
                                        <button type="button" onClick={() => openBulkPrintPreview('invoice')} className="flex-1 bg-white border border-gray-200 rounded-xl py-2 text-xs font-bold text-gray-600">🧾 この月の納品書をまとめて</button>
                                        <button type="button" onClick={() => openBulkPrintPreview('receipt')} className="flex-1 bg-white border border-gray-200 rounded-xl py-2 text-xs font-bold text-gray-600">🧾 この月の領収書をまとめて</button>
                                    </div>
                                </div>
                            </>)}
                        </div>

                        {/* iPad・PC：右側に詳細 */}
                        <aside className="hidden lg:block flex-1 sticky top-20">
                            {selectedOrder ? renderOrderDetail(selectedOrder) : (
                                <div className="bg-white rounded-2xl border border-dashed border-gray-300 p-10 text-center text-gray-400">
                                    <img src="images/logo.png" alt="" className="w-20 h-20 object-contain mx-auto opacity-60" />
                                    <p className="mt-2 text-sm">左の一覧から注文を選ぶと、ここに詳細が出ます</p>
                                </div>
                            )}
                        </aside>
                    </div>
                );
            };

            // 在庫タブ
            const STOCK_TYPES = [['add', '🌱 収穫', 'bg-nanairo-dark'], ['sale', '🛒 販売', 'bg-blue-600'], ['remove', '🗑 ロス', 'bg-red-500']];
            const LOG_META = {
                '収穫': ['🌱', 'bg-nanairo-light', 'text-nanairo-dark', '+'], '店頭販売': ['🛒', 'bg-blue-50', 'text-blue-600', '−'], 'ロス': ['🗑', 'bg-red-50', 'text-red-500', '−'],
                '委託納品': ['🏪', 'bg-orange-50', 'text-orange-600', '−'], '委託ロス': ['🏪', 'bg-orange-50', 'text-orange-600', ''], '納品取消': ['↩', 'bg-gray-100', 'text-gray-600', '+'], '精算取消': ['↩', 'bg-gray-100', 'text-gray-600', '']
            };
            const renderInventoryTab = () => {
                const suggest = (id) => { const r = insights && insights.products ? insights.products.find(x => x.id === id) : null; return r ? r.suggestedWeekly : null; };
                if (bulkMode) {
                    const cur = STOCK_TYPES.find(t => t[0] === bulkType);
                    const picked = products.filter(p => (bulkQty[p.id] || 0) > 0);
                    const total = picked.reduce((a, p) => a + bulkQty[p.id], 0);
                    const setQ = (id, v) => setBulkQty(prev => ({ ...prev, [id]: Math.max(0, v) }));
                    return (
                        <div className="space-y-3 pb-20">
                            <button type="button" onClick={() => { setBulkMode(false); setBulkQty({}); }} className="text-sm font-bold text-nanairo-dark">‹ 在庫にもどる</button>
                            <div className="flex items-center justify-between"><h2 className="text-lg font-bold text-gray-900">まとめて入力</h2><span className="text-xs text-gray-500">{shortDate(todayStr)}</span></div>
                            <div className="grid grid-cols-3 gap-1 bg-gray-100 rounded-xl p-1 text-sm font-bold">
                                {STOCK_TYPES.map(([k, label, bg]) => <button key={k} type="button" onClick={() => setBulkType(k)} className={`rounded-lg py-2.5 ${bulkType === k ? `${bg} text-white shadow-sm` : 'text-gray-600'}`}>{label}</button>)}
                            </div>
                            <div className="bg-white rounded-2xl border border-gray-200 divide-y divide-gray-100">
                                <div className="flex items-center gap-2 px-3 py-2 text-[11px] font-bold text-gray-500"><span className="flex-1">商品</span><span className="w-10 text-center">在庫</span>{bulkType === 'add' && <span className="w-10 text-center">目安</span>}<span className="w-32 text-center">{cur[1].slice(2)}する数</span></div>
                                {products.map(p => {
                                    const v = bulkQty[p.id] || 0;
                                    const over = bulkType !== 'add' && v > p.stock;
                                    return (
                                        <div key={p.id} className="flex items-center gap-2 px-3 py-2">
                                            <span className="flex-1 text-sm font-bold text-gray-900 truncate">{p.name}</span>
                                            <span className={`w-10 text-center text-sm ${p.stock <= 0 ? 'text-gray-300' : p.stock <= 5 ? 'text-orange-500 font-bold' : 'text-gray-700'}`}>{p.stock}</span>
                                            {bulkType === 'add' && <span className="w-10 text-center text-xs text-gray-400">{suggest(p.id) != null ? suggest(p.id) : '-'}</span>}
                                            <div className="w-32 flex items-center justify-between">
                                                <button type="button" onClick={() => setQ(p.id, v - 1)} className="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center text-gray-500"><Icons.Minus className="w-4 h-4" /></button>
                                                <input type="number" inputMode="numeric" min="0" value={v || ''} placeholder="0" onChange={e => setQ(p.id, parseInt(e.target.value, 10) || 0)} className={`w-12 text-center font-bold outline-none bg-transparent ${over ? 'text-red-600' : v ? 'text-nanairo-dark' : 'text-gray-300'}`} />
                                                <button type="button" onClick={() => setQ(p.id, v + 1)} className="w-8 h-8 rounded-full bg-nanairo-dark text-white flex items-center justify-center"><Icons.Plus className="w-4 h-4" /></button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                            {bulkType === 'add' && insights && insights.products && (
                                <button type="button" onClick={() => { const next = {}; products.forEach(p => { const s = suggest(p.id); if (s) next[p.id] = s; }); setBulkQty(next); }} className="w-full text-right text-xs font-bold text-nanairo-dark">目安の数をまとめて入れる</button>
                            )}
                            <div className="fixed left-0 right-0 bottom-[76px] lg:bottom-0 z-30 mx-auto w-full max-w-[600px] lg:max-w-[1120px] px-4 py-3 bg-gradient-to-t from-gray-100 to-transparent">
                                <button type="button" onClick={submitBulk} disabled={bulkRunning || picked.length === 0} className={`w-full rounded-xl py-3.5 text-white font-bold shadow-lg flex justify-center items-center gap-2 ${bulkRunning || picked.length === 0 ? 'bg-gray-300' : cur[2]}`}>
                                    {bulkRunning ? <><div className="spinner"></div> 記録中… {bulkProgress}/{picked.length}</> : picked.length === 0 ? '数を入れてください' : `${picked.length}商品・${cur[1].slice(2)} ${total} をまとめて記録`}
                                </button>
                            </div>
                        </div>
                    );
                }

                // 最近の記録：同じ時刻の「全部ロス」「まとめて入力」は1つにまとめる
                const items = [];
                stockLogs.forEach(log => {
                    const d = String(log.date).slice(0, 5), t = String(log.date).slice(6);
                    const groupable = log.memo === '一括ロス' || log.memo === 'まとめて入力';
                    const last = items[items.length - 1];
                    if (groupable && last && last.group && last.d === d && last.t === t && last.type === log.type && last.memo === log.memo) { last.logs.push(log); return; }
                    items.push({ key: log.rowIndex, d, t, type: log.type, memo: log.memo, group: groupable, logs: [log] });
                });
                const md = (offset) => new Date(Date.now() + 9 * 3600 * 1000 - offset * 86400000).toISOString().slice(5, 10).replace('-', '/');
                const dayLabel = (d) => d === md(0) ? '今日' : d === md(1) ? '昨日' : d.replace(/^0/, '').replace('/0', '/');
                const days = [];
                items.forEach(it => { let g = days.find(x => x.d === it.d); if (!g) days.push(g = { d: it.d, items: [] }); g.items.push(it); });
                const DOT = { '収穫': ['bg-nanairo-dark', '＋', 'text-nanairo-dark', '+', 'を収穫'], '店頭販売': ['bg-blue-500', '¥', 'text-blue-600', '−', 'を店頭販売'], 'ロス': ['bg-red-500', '−', 'text-red-500', '−', 'をロス'], '委託納品': ['bg-orange-400', '🏪', 'text-orange-600', '−', 'を委託に納品'], '委託ロス': ['bg-orange-400', '🏪', 'text-orange-600', '', 'の委託ロス（回収）'], '納品取消': ['bg-gray-400', '↩', 'text-gray-600', '+', 'の納品を取消'], '精算取消': ['bg-gray-400', '↩', 'text-gray-600', '', 'の精算を取消'] };
                const daySum = (g) => {
                    const sum = {};
                    g.items.forEach(it => it.logs.forEach(l => { if (l.status !== '取消') sum[l.type] = (sum[l.type] || 0) + l.amount; }));
                    return [['収穫', '収穫 +', 'bg-nanairo-light text-nanairo-dark'], ['店頭販売', '販売 −', 'bg-blue-50 text-blue-600'], ['ロス', 'ロス −', 'bg-red-50 text-red-500'], ['委託納品', '委託 −', 'bg-orange-50 text-orange-600']].filter(([k]) => sum[k]).map(([k, l, cls]) => <span key={k} className={`px-2 py-0.5 rounded-full ${cls}`}>{l}{sum[k]}</span>);
                };
                const records = (
                    <div>
                        <b className="text-gray-900">最近の記録</b>
                        {days.length === 0 && <div className="text-center py-6 bg-white rounded-2xl border border-gray-200 text-gray-400 text-sm mt-2">記録はありません</div>}
                        {days.map((g, gi) => (
                            <div key={g.d} className="mt-3">
                                <div className="flex items-center gap-2 flex-wrap">
                                    <span className={`text-xs font-bold px-2 py-0.5 rounded ${gi === 0 && dayLabel(g.d) === '今日' ? 'bg-gray-900 text-white' : 'bg-gray-200 text-gray-600'}`}>{dayLabel(g.d)}</span>
                                    <div className="flex gap-1 text-[11px] font-bold flex-wrap">{daySum(g)}</div>
                                </div>
                                <div className="relative mt-1.5 pl-1">
                                    <div className="absolute left-[46px] top-3 bottom-3 w-0.5 bg-gray-200"></div>
                                    {g.items.map(it => {
                                        const m = DOT[it.type] || ['bg-gray-400', '•', 'text-gray-600', '', ''];
                                        const cancelled = it.logs.every(l => l.status === '取消');
                                        const total = it.logs.filter(l => l.status !== '取消').reduce((a, l) => a + l.amount, 0) || it.logs.reduce((a, l) => a + l.amount, 0);
                                        const canUndo = !cancelled && ['収穫', '店頭販売', 'ロス'].includes(it.type);
                                        const title = it.logs.length > 1 ? `${it.memo === '一括ロス' ? '残りを全部ロス' : `まとめて${it.type === '店頭販売' ? '販売' : it.type}`}（${it.logs.length}商品）` : null;
                                        return (
                                            <button key={it.key} type="button" disabled={!canUndo} onClick={() => setLogSheet(it)} className={`w-full flex items-center gap-3 py-1 text-left ${cancelled ? 'opacity-40' : ''}`}>
                                                <span className="w-8 text-[10px] text-gray-400 text-right shrink-0">{it.t}</span>
                                                <span className={`relative z-10 w-6 h-6 rounded-full text-white text-xs flex items-center justify-center shrink-0 ${cancelled ? 'bg-gray-300' : m[0]}`}>{cancelled ? '↩' : m[1]}</span>
                                                <div className="flex-1 min-w-0 bg-white rounded-xl border border-gray-200 px-3 py-2">
                                                    <div className="flex items-center justify-between gap-2">
                                                        <span className={`text-sm truncate ${cancelled ? 'line-through' : ''}`}>{title ? <b>{title}</b> : <><b>{it.logs[0].name}</b> {m[4]}</>}</span>
                                                        {cancelled ? <span className="text-[10px] text-gray-500 shrink-0">取り消し済み</span> : <b className={`shrink-0 ${m[2]}`}>{m[3]}{total}</b>}
                                                    </div>
                                                    {title && <div className="text-[10px] text-gray-500 truncate">{it.logs.map(l => `${l.name}${l.amount}`).join('・')}</div>}
                                                    {!title && it.memo && <div className="text-[10px] text-gray-500 truncate">{it.memo}</div>}
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        ))}
                        <p className="text-[11px] text-gray-400 mt-2">記録をタップすると取り消せます</p>
                    </div>
                );
                return (
                    <div className="space-y-3">
                        <div className="flex justify-between items-center">
                            <h1 className="text-lg font-bold text-gray-900">在庫</h1>
                            <div className="flex items-center gap-2"><span className="text-xs text-gray-500">{shortDate(todayStr)}</span>
                                <button type="button" onClick={handleRefresh} disabled={isFetchingData} className="p-2 bg-white rounded-full border border-gray-200 text-gray-500"><Icons.RefreshCw className={`w-5 h-5 ${isFetchingData ? 'animate-spin' : ''}`} /></button></div>
                        </div>
                        <div className="lg:flex lg:gap-6 lg:items-start">
                            <div className="flex-1 space-y-3">
                                <div className="grid grid-cols-2 gap-2 text-sm font-bold">
                                    <button type="button" onClick={() => { setBulkType('add'); setBulkMode(true); }} className="py-3 rounded-xl bg-nanairo-dark text-white">🌱 まとめて入力</button>
                                    <button type="button" onClick={() => setShowBulkLossModal(true)} className="py-3 rounded-xl bg-white border border-red-200 text-red-600">🗑 残りを全部ロス</button>
                                </div>
                                <section className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-3 gap-2">
                                    {products.map(p => (
                                        <button key={p.id} type="button" onClick={() => openStockSheet(p.id)} className="bg-white rounded-xl border border-gray-200 overflow-hidden text-left active:scale-[0.98] transition-transform">
                                            {imgOf(p) ? <img src={imgOf(p)} alt="" loading="lazy" className={`w-full h-20 object-cover ${p.stock <= 0 ? 'grayscale opacity-60' : ''}`} /> : <div className="w-full h-20 bg-nanairo-light flex items-center justify-center text-nanairo-dark text-xs font-bold">{p.name}</div>}
                                            <div className="p-2 flex items-end justify-between gap-1">
                                                <div className="min-w-0"><div className="font-bold text-sm text-gray-900 truncate">{p.name}</div><div className="text-xs text-gray-500">{p.weight}</div></div>
                                                <span className={`text-2xl font-bold leading-none ${p.stock <= 0 ? 'text-gray-300' : p.stock <= 5 ? 'text-orange-500' : 'text-gray-900'}`}>{p.stock}</span>
                                            </div>
                                        </button>
                                    ))}
                                </section>
                                <p className="text-xs text-gray-500">商品をタップすると1つずつ記録できます。</p>
                            </div>
                            <div className="mt-4 lg:mt-0 lg:w-[360px] lg:shrink-0 lg:sticky lg:top-20">{records}</div>
                        </div>
                    </div>
                );
            };

            // お客様タブ
            const renderCustomersTab = () => {
                const sel = customerList.find(c => c.key === selectedCustomerKey);
                if (sel) {
                    const monthOrders = sel.orders.filter(o => inViewPeriod(o) && o.status === '受渡済'); // 請求はお渡し済みの分だけ
                    const unpaidList = sel.orders.filter(isUnpaid);
                    const history = sel.orders.slice().sort((a, b) => String(b.pickupDate).localeCompare(String(a.pickupDate)));
                    return (
                        <div className="space-y-3 max-w-[600px]">
                            <button type="button" onClick={() => setSelectedCustomerKey(null)} className="text-sm font-bold text-nanairo-dark">‹ お客様の一覧</button>
                            <div>
                                <h2 className="text-xl font-bold text-gray-900">{sel.name}</h2>
                                <div className="text-xs text-gray-500">{sel.storeName ? `${sel.userName} 様・` : ''}{sel.first ? `初回 ${shortDate(sel.first)}` : ''}{sel.key.startsWith('name:') ? '・LINE以外の登録' : ''}</div>
                            </div>
                            <div className="grid grid-cols-3 gap-2 text-center">
                                <div className="bg-white rounded-2xl border border-gray-200 py-2"><div className="text-[10px] text-gray-500">利用</div><b>{sel.count}回</b></div>
                                <div className="bg-white rounded-2xl border border-gray-200 py-2"><div className="text-[10px] text-gray-500">合計</div><b>¥{sel.spend.toLocaleString()}</b></div>
                                <div className={`bg-white rounded-2xl border py-2 ${sel.unpaid ? 'border-red-200' : 'border-gray-200'}`}><div className="text-[10px] text-gray-500">未集金</div><b className={sel.unpaid ? 'text-red-600' : ''}>¥{sel.unpaid.toLocaleString()}</b></div>
                            </div>
                            <div className="bg-white rounded-2xl border border-gray-200 divide-y divide-gray-100 text-sm">
                                {sel.phone && <div className="flex items-center gap-3 px-4 py-2.5"><span>📞</span><span className="flex-1">{sel.phone}</span><a href={`tel:${sel.phone}`} className="text-xs font-bold text-nanairo-dark">発信</a></div>}
                                {sel.address && <div className="flex items-center gap-3 px-4 py-2.5"><span>📍</span><span className="flex-1">{sel.address}</span><a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('山形県' + sel.address)}`} target="_blank" rel="noopener" className="text-xs font-bold text-nanairo-dark">地図</a></div>}
                                {sel.favorites.length > 0 && <div className="flex items-center gap-3 px-4 py-2.5"><span>🛒</span><span className="flex-1">よく買う：{sel.favorites.join('・')}</span></div>}
                                {sel.avgGap && <div className="flex items-center gap-3 px-4 py-2.5"><span>🔁</span><span className="flex-1">だいたい {sel.avgGap}日ごと・最終 {shortDate(sel.last)}{sel.followUp ? '（声かけ候補）' : ''}</span></div>}
                            </div>
                            {memoBox({ id: 'c:' + sel.key, value: sel.memo, onSave: m => saveCustomerMemo(sel.key, m), label: 'メモ（スタッフ用）' })}
                            <div className="flex gap-2">
                                <button type="button" onClick={() => openCustomerReport(sel, monthOrders)} className="flex-1 bg-white border border-gray-200 rounded-xl py-2.5 text-xs font-bold text-gray-700">🧾 {viewStartMonth === viewEndMonth ? `${Number(viewStartMonth.slice(5))}月` : `${Number(viewStartMonth.slice(5))}〜${Number(viewEndMonth.slice(5))}月`}の請求書</button>
                                {unpaidList.length > 0 && <button type="button" onClick={() => openCustomerReport(sel, unpaidList)} className="flex-1 bg-white border border-red-200 rounded-xl py-2.5 text-xs font-bold text-red-600">🧾 未集金分の請求書</button>}
                            </div>
                            <div className="flex items-center justify-between pt-1"><b className="text-sm text-gray-900">注文の履歴</b><span className="text-xs text-gray-500">{history.length}件</span></div>
                            <div className="bg-white rounded-2xl border border-gray-200 divide-y divide-gray-100 overflow-hidden">{history.map(o => orderRow(o, true))}</div>
                        </div>
                    );
                }
                const q = customerSearch.trim().toLowerCase().replace(/-/g, '');
                const counts = { all: customerList.length, store: customerList.filter(c => c.storeName).length, unpaid: customerList.filter(c => c.unpaidCount > 0).length, follow: customerList.filter(c => c.followUp).length };
                const shown = customerList.filter(c => {
                    if (q && ![c.userName, c.storeName, c.phone].some(v => String(v || '').toLowerCase().replace(/-/g, '').includes(q))) return false;
                    return customerFilter === 'all' || (customerFilter === 'store' ? c.storeName : customerFilter === 'unpaid' ? c.unpaidCount > 0 : c.followUp);
                });
                return (
                    <div className="space-y-3 max-w-[600px]">
                        <h1 className="text-lg font-bold text-gray-900">お客様</h1>
                        <div className="flex items-center gap-2 bg-white border border-gray-200 rounded-xl px-3">
                            <span className="text-gray-400">🔍</span>
                            <input type="search" value={customerSearch} onChange={e => setCustomerSearch(e.target.value)} placeholder="お名前・店舗名・電話番号" className="flex-1 min-w-0 py-2.5 text-sm outline-none bg-transparent" />
                        </div>
                        <div className="flex gap-1.5 text-xs font-bold overflow-x-auto">
                            {[['all', 'すべて', 'bg-white text-gray-600 border-gray-200'], ['store', 'お店', 'bg-white text-gray-600 border-gray-200'], ['unpaid', '未集金', 'bg-white text-red-600 border-red-200'], ['follow', '声かけ', 'bg-white text-blue-700 border-blue-200']].map(([k, l, cls]) => (
                                <button key={k} type="button" onClick={() => setCustomerFilter(k)} className={`px-3 py-1.5 rounded-full whitespace-nowrap border ${customerFilter === k ? 'bg-gray-900 text-white border-gray-900' : cls}`}>{l} {counts[k]}</button>
                            ))}
                        </div>
                        {shown.length === 0 ? <div className="text-center py-8 bg-white rounded-2xl border border-gray-200 text-gray-400 text-sm">該当するお客様はいません</div> : (
                            <div className="bg-white rounded-2xl border border-gray-200 divide-y divide-gray-100 overflow-hidden">
                                {shown.map(c => (
                                    <button key={c.key} type="button" onClick={() => setSelectedCustomerKey(c.key)} className="w-full text-left flex items-center gap-3 px-3 py-3 active:bg-gray-50">
                                        <span className={`w-9 h-9 rounded-full font-bold flex items-center justify-center shrink-0 ${c.storeName ? 'bg-nanairo-light text-nanairo-dark' : 'bg-gray-100 text-gray-600'}`}>{c.name.slice(0, 1)}</span>
                                        <div className="flex-1 min-w-0"><b className="text-gray-900">{c.name}</b><div className="text-xs text-gray-500 truncate">{c.storeName ? `${c.userName} 様・` : ''}{c.count}回・¥{c.spend.toLocaleString()}{c.last ? `・最終 ${shortDate(c.last)}` : ''}</div></div>
                                        {c.unpaidCount > 0 && <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-50 text-red-600">未集金</span>}
                                        {c.followUp && <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-50 text-blue-700">声かけ</span>}
                                    </button>
                                ))}
                            </div>
                        )}
                        <p className="text-xs text-gray-500">LINEの注文から自動で作られます。専務あての個人注文（店頭販売として記録したもの）は含まれません。</p>
                    </div>
                );
            };

            // 未集金・請求
            const renderReceivables = () => {
                const unpaid = orders.filter(isUnpaid);
                const total = unpaid.reduce((a, o) => a + Number(o.totalPrice || 0), 0);
                const oldest = unpaid.map(o => o.pickupDate).sort()[0];
                const groups = customerList.filter(c => c.unpaidCount > 0).map(c => ({ ...c, list: c.orders.filter(isUnpaid) }))
                    .sort((a, b) => a.list[0].pickupDate.localeCompare(b.list[0].pickupDate));
                const payAll = async (c) => {
                    for (const o of c.list) await toggleCheck(o.id, 'paid', true);
                    showToast(`${c.name}：${c.list.length}件を集金済にしました`, null, async () => { for (const o of c.list) await toggleCheck(o.id, 'paid', false); });
                };
                return (
                    <div className="space-y-3 max-w-[600px]">
                        <h2 className="text-lg font-bold text-gray-900">未集金・請求</h2>
                        <div className={`rounded-2xl border p-4 ${total ? 'bg-red-50/60 border-red-200' : 'bg-white border-gray-200'}`}>
                            <div className="text-xs text-gray-500">まだ回収していないお金</div>
                            <div className={`text-3xl font-bold ${total ? 'text-red-600' : 'text-gray-900'}`}>¥{total.toLocaleString()}</div>
                            <div className="text-xs text-gray-500">{unpaid.length}件{oldest ? `・いちばん古いもの ${shortDate(oldest)}（${daysBetween(oldest, todayStr)}日前）` : ''}</div>
                        </div>
                        {groups.length > 0 && <b className="block text-sm text-gray-900 pt-1">お客様ごと（古い順）</b>}
                        {groups.map(c => (
                            <div key={c.key} className="bg-white rounded-2xl border border-gray-200 p-3">
                                <div className="flex justify-between items-start gap-2">
                                    <div className="min-w-0"><b className="text-gray-900">{c.name}</b><div className="text-xs text-gray-500">{c.list.length}件：{c.list.map(o => shortDate(o.pickupDate)).join('・')}</div></div>
                                    <b className="text-red-600 whitespace-nowrap">¥{c.list.reduce((a, o) => a + Number(o.totalPrice || 0), 0).toLocaleString()}</b>
                                </div>
                                <div className="flex gap-2 mt-2 text-xs font-bold">
                                    <button type="button" onClick={() => payAll(c)} className="flex-1 py-2 rounded-lg bg-nanairo-dark text-white">集金済にする</button>
                                    <button type="button" onClick={() => openCustomerReport(c, c.list)} className="flex-1 py-2 rounded-lg border border-gray-300 text-gray-700">🧾 請求書</button>
                                    {c.phone && <a href={`tel:${c.phone}`} className="px-3 py-2 rounded-lg border border-gray-300 text-gray-700">📞</a>}
                                </div>
                            </div>
                        ))}
                        <div className="bg-white rounded-2xl border border-gray-200 p-3 mt-2">
                            <div className="flex items-center justify-between"><b className="text-sm text-gray-900">月ごとの書き出し</b>
                                <input type="month" value={viewStartMonth} onChange={e => { if (e.target.value) { setViewStartMonth(e.target.value); setViewEndMonth(e.target.value); } }} className="bg-white border border-gray-200 rounded-lg px-2 py-1 text-xs font-bold text-gray-700 min-w-0 appearance-none" /></div>
                            <div className="grid grid-cols-2 gap-2 mt-2 text-xs font-bold">
                                <button type="button" onClick={downloadCsv} className="py-2.5 rounded-xl border border-gray-200 text-gray-700">⬇ 注文をCSVで保存</button>
                                <button type="button" onClick={() => openBulkPrintPreview('invoice')} className="py-2.5 rounded-xl border border-gray-200 text-gray-700">🧾 納品書をまとめて</button>
                            </div>
                            <p className="text-xs text-gray-500 mt-2">お客様ごとの月締め請求書は「お客様」の台帳から作れます。</p>
                        </div>
                    </div>
                );
            };

            // その他
            const renderMoreTab = () => {
                const back = <button type="button" onClick={() => setMoreView(null)} className="text-sm font-bold text-nanairo-dark mb-2">‹ その他</button>;
                if (moreView === 'analytics') return <div>{back}{renderAnalyticsTab()}</div>;
                if (moreView === 'receivables') return <div>{back}{renderReceivables()}</div>;
                if (moreView === 'products') return <div>{back}{renderProducts()}</div>;
                if (moreView === 'settings') return <div>{back}{renderSettings()}</div>;
                if (moreView === 'guide') return <div>{back}{renderGuide()}</div>;
                const unpaid = orders.filter(isUnpaid);
                const items = [
                    ['analytics', '📊', '分析', '売上・廃棄・商品別・お客様', null],
                    ['receivables', '💴', '未集金・請求', unpaid.length ? `未集金 ¥${unpaid.reduce((a, o) => a + Number(o.totalPrice || 0), 0).toLocaleString()}（${unpaid.length}件）` : '未集金はありません', unpaid.length || null],

                const q = systemInfo && systemInfo.lineQuota;

                const pushErr = (() => { try { return systemInfo && systemInfo.lastPushError ? JSON.parse(systemInfo.lastPushError) : null; } catch (e) { return null; } })();
                const backupAt = systemInfo && systemInfo.lastBackupAt;
                const runBackup = async () => {
                    setIsSavingAdmin(true);
                    try { const r = await postAdmin({ action: 'backupNow' }); setSystemInfo(prev => ({ ...(prev || {}), lastBackupAt: r.backup.at })); showMessage('バックアップを取りました（Googleドライブの「マイクロハーブ_バックアップ」）'); }
                    catch (e) { showMessage('バックアップできませんでした: ' + e.message, 8000); }

                return (
                    <div className="max-w-[600px]">
                        <h1 className="text-lg font-bold text-gray-900 mb-2">その他</h1>

                        </div>

                        <h2 className="text-sm font-bold text-gray-700 mt-5 mb-2">システムの状態</h2>
                        <div className="bg-white rounded-2xl border border-gray-200 divide-y divide-gray-100 text-sm">
                            <div className="px-4 py-3">
                                <div className="flex justify-between items-center"><span className="font-bold text-gray-800">💬 LINEの送信数（今月）</span><b className={qRate >= 0.8 ? 'text-red-600' : 'text-gray-900'}>{q ? (q.limit ? `${q.used}／${q.limit}通` : `${q.used}通（上限なし）`) : '—'}</b></div>
                                {q && q.limit && <div className="h-2 bg-gray-100 rounded-full mt-2 overflow-hidden"><div className={`h-full rounded-full ${qRate >= 0.8 ? 'bg-red-500' : qRate >= 0.6 ? 'bg-orange-400' : 'bg-nanairo-dark'}`} style={{ width: `${Math.min(100, qRate * 100)}%` }}></div></div>}
                                <div className="text-[11px] text-gray-500 mt-1">{q && q.limit ? '上限を超えると、お客様への注文完了・リマインドが届かなくなります。80%で公式LINEのグループにお知らせします。' : 'GASを最新版にすると表示されます。'}</div>
                                {pushErr && <div className="text-[11px] text-red-600 mt-1">最後の送信エラー：{new Date(pushErr.at).toLocaleString('ja-JP')}　{pushErr.message}</div>}

                                const mins = seen ? Math.round((Date.now() - seen.getTime()) / 60000) : null;

                                const testPrint = async () => {
                                    try { await postAdmin({ action: 'printTest' }); showMessage('テスト印刷を送りました（1分ほどで出てきます）'); }
                                    catch (e) { showMessage('送れませんでした: ' + e.message, 7000); }
                                };
                                return (
                                    <div className="px-4 py-3 flex items-center justify-between gap-2">

                                        {pr && pr.keySet && <button type="button" onClick={testPrint} className="text-xs font-bold text-nanairo-dark border border-nanairo-dark rounded-full px-3 py-1.5 shrink-0">テスト印刷</button>}
                                    </div>
                                );
                            })()}
                        </div>
                    </div>

            };

            // 使い方ガイド（スタッフ向け）
            const GUIDE = [

                ['👥', 'お客様・未集金・請求書', [
                    '「お客様」で名前・電話で検索できます。お客様ごとに注文の履歴・未集金・メモが見られます。',
                    '月締めの請求書は、お客様の画面の「○月の請求書」から作れます（お渡し済みの注文だけが入ります）。',
                    '「その他 → 未集金・請求」で、まだ回収していないお金の合計とお客様ごとの一覧が見られます。',

                ['🌿', '商品・写真・休業日を変える', [
                    '「その他 → 商品の管理」で、価格・説明の変更、販売の停止（スイッチ）、写真の登録、新しい商品の追加ができます。',
                    '「その他 → 設定」で、配送の曜日・時間・送料、店頭受け取りの時間帯、休業日（カレンダー）を変えられます。変更は注文画面にすぐ反映されます。',

                ['🆘', '困ったとき', [

            const renderGuide = () => (
                <div className="space-y-2 max-w-[600px]">

                                </ol>
                            )}
                        </div>
                    ))}
                </div>
            );

            /* ===================== ★v5 後半：委託・商品の管理・設定・メモ ===================== */
            const agencyPriceOf = (agencyId, pid) => { const ap = agencyPrices.find(p => p.agencyId === agencyId && p.productId === pid); return ap ? Number(ap.storePrice) : 0; };
            const agencyStats = (a) => {
                const all = (agencyDeliveriesAll.length ? agencyDeliveriesAll : agencyDeliveries).filter(d => d.agencyId === a.id && d.status !== '取消');
                const pending = all.filter(d => d.status === '納品済');
                const settled = all.filter(d => d.status === '精算済');
                const pendingAmount = pending.reduce((s, d) => s + agencyPriceOf(a.id, d.productId) * d.deliveryQty, 0);
                const monthSales = settled.filter(d => String(d.date).slice(0, 7) === todayMonth).reduce((s, d) => s + Math.floor(d.pureSalesExTax * 1.08), 0);
                const delivered = settled.reduce((s, d) => s + d.deliveryQty, 0), lost = settled.reduce((s, d) => s + d.lossQty, 0);
                const byMonth = {};
                settled.forEach(d => { const m = String(d.date).slice(0, 7); byMonth[m] = byMonth[m] || { d: 0, l: 0 }; byMonth[m].d += d.deliveryQty; byMonth[m].l += d.lossQty; });
                const trend = Object.keys(byMonth).sort().slice(-6).map(m => ({ m, rate: byMonth[m].d ? Math.round(byMonth[m].l / byMonth[m].d * 100) : 0 }));
                const batches = {};
                all.forEach(d => { const k = String(d.id).split('-')[0]; (batches[k] = batches[k] || { key: k, date: d.date, items: [] }).items.push(d); });
                const batchList = Object.values(batches).sort((x, y) => String(y.date).localeCompare(String(x.date)) || y.key.localeCompare(x.key));
                return { all, pending, settled, pendingAmount, monthSales, lossRate: delivered ? Math.round(lost / delivered * 100) : null, trend, last: all.map(d => d.date).sort().slice(-1)[0], batchList };
            };
            // 委託の書類（納品書の再発行・精算明細書）

                        const ex = Math.floor(storePriceTaxIn / 1.08), fee = Math.floor(ex * a.feeRate);
                        return { name: d.productName, qty: d.deliveryQty, storePriceTaxIn, storePriceExTax: ex, feeAmountExTax: fee, billingExTax: ex - fee };

                }]);
                setPrintType('agency_invoice');

                products.forEach(p => { prices[p.id] = a ? (agencyPriceOf(a.id, p.id) || '') : ''; });

                    await postAdmin({ action: 'saveAgency', id: e.id, name: e.name, feeRate: Number(e.feePct) / 100, contact: e.contact, prices });
                    showMessage(`${e.name} を保存しました`); setAgencyEdit(null); fetchData(viewStartMonth, viewEndMonth);
                } catch (err) { showMessage('保存できませんでした: ' + err.message, 7000); }
                finally { setIsSavingAdmin(false); }
            };

            const renderAgencyTab = () => {
                const sel = agencies.find(a => a.id === agencyViewId);
                if (sel) {
                    const st = agencyStats(sel);
                    const T = st.trend;
                    return (
                        <div className="space-y-3 max-w-[640px]">

                                <button type="button" onClick={() => openAgencyEdit(sel)} className="text-xs font-bold text-gray-600 border border-gray-300 rounded-full px-3 py-1.5 shrink-0">編集</button>
                            </div>
                            <div className="grid grid-cols-3 gap-2 text-center">
                                <div className={`bg-white rounded-2xl border py-2 ${st.pending.length ? 'border-orange-200' : 'border-gray-200'}`}><div className="text-[10px] text-gray-500">未精算</div><b className={st.pending.length ? 'text-orange-600' : ''}>{st.pending.length}件</b><div className="text-[10px] text-gray-500">店頭価格で ¥{st.pendingAmount.toLocaleString()}</div></div>

                                <div className="bg-white rounded-2xl border border-gray-200 py-2"><div className="text-[10px] text-gray-500">ロス率</div><b className={st.lossRate >= 30 ? 'text-red-500' : ''}>{st.lossRate != null ? `${st.lossRate}%` : '—'}</b></div>
                            </div>

                                <div className="text-xs font-bold text-gray-500 mb-1">ロス率の推移（精算済み・月ごと）</div>

                                        <line x1="10" x2="290" y1="62" y2="62" stroke="#E5E7EB" />

                            {!showDeliveryForm ? (

                                    <div className="divide-y divide-gray-100">
                                        {products.map(p => { const qty = deliveryCart[p.id] || 0; const price = agencyPriceOf(sel.id, p.id); return (
                                            <div key={p.id} className="flex items-center justify-between py-2 gap-2">
                                                <div className="min-w-0"><b className="text-sm text-gray-900">{p.name}</b><div className="text-[11px] text-gray-500">店頭 {price ? `¥${price}` : '価格未設定'}・在庫 {p.stock}</div></div>
                                                <div className="flex items-center gap-2 shrink-0">
                                                    <button type="button" onClick={() => updateDeliveryCart(p.id, -1)} className="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center text-gray-500"><Icons.Minus className="w-4 h-4" /></button>
                                                    <b className={`w-6 text-center ${qty ? 'text-nanairo-dark' : 'text-gray-300'}`}>{qty}</b>
                                                    <button type="button" onClick={() => updateDeliveryCart(p.id, 1)} disabled={qty >= p.stock} className={`w-8 h-8 rounded-full flex items-center justify-center text-white ${qty >= p.stock ? 'bg-gray-300' : 'bg-nanairo-dark'}`}><Icons.Plus className="w-4 h-4" /></button>
                                                </div>
                                            </div>); })}
                                    </div>
                                    <button type="button" onClick={handleAgencyDelivery} disabled={Object.keys(deliveryCart).length === 0 || isSubmittingDelivery} className={`w-full py-3 rounded-xl font-bold text-white flex justify-center items-center gap-2 ${Object.keys(deliveryCart).length === 0 || isSubmittingDelivery ? 'bg-gray-300' : 'bg-nanairo-dark'}`}>{isSubmittingDelivery ? <><div className="spinner"></div> 記録中…</> : '納品して納品書を発行'}</button>
                                </div>
                            )}

                    const c = document.createElement('canvas');
                    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);

                    resolve(c.toDataURL('image/jpeg', 0.82));

                            </div>

            const memoBox = ({ id, value, onSave, label }) => {

            const renderAnalyticsTab = () => {
                const I = insights;
                const yen = (n) => `¥${Math.round(Number(n || 0)).toLocaleString()}`;
                const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
                const fmtM = (m) => m ? `${m.slice(0, 4)}年${Number(m.slice(5))}月` : '';
                const addMonths = (m, n) => { const [y, mo] = m.split('-').map(Number); const d = new Date(Date.UTC(y, mo - 1 + n, 1)); return d.toISOString().slice(0, 7); };
                const setPeriod = (a, b) => { setViewStartMonth(a); setViewEndMonth(b); };
                const presets = [
                    ['今月', todayMonth, todayMonth], ['先月', addMonths(todayMonth, -1), addMonths(todayMonth, -1)],
                    ['3か月', addMonths(todayMonth, -2), todayMonth], ['今年', todayMonth.slice(0, 4) + '-01', todayMonth],
                ];
                const periodBar = (
                    <div className="flex flex-wrap items-center justify-between gap-2">
                        <div>
                            <div className="text-lg font-bold text-gray-900">{viewStartMonth === viewEndMonth ? fmtM(viewStartMonth) : `${fmtM(viewStartMonth)}〜${fmtM(viewEndMonth)}`}</div>
                            {I && I.period && <div className="text-xs text-gray-500">{I.period.days}日間　比較：{fmtM(I.period.prevStart)}{I.period.prevStart !== I.period.prevEnd ? `〜${fmtM(I.period.prevEnd)}` : ''}</div>}
                        </div>
                        <div className="flex flex-wrap items-center gap-1 text-xs font-bold">
                            {presets.map(([l, a, b]) => <button key={l} type="button" onClick={() => setPeriod(a, b)} className={`px-3 py-1.5 rounded-full border ${viewStartMonth === a && viewEndMonth === b ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-600 border-gray-200'}`}>{l}</button>)}
                            <input type="month" value={viewStartMonth} onChange={e => e.target.value && setPeriod(e.target.value, e.target.value > viewEndMonth ? e.target.value : viewEndMonth)} className="bg-white border border-gray-200 rounded-lg px-2 py-1 min-w-0 appearance-none" />
                            <span className="text-gray-400">〜</span>
                            <input type="month" value={viewEndMonth} onChange={e => e.target.value && setPeriod(e.target.value < viewStartMonth ? e.target.value : viewStartMonth, e.target.value)} className="bg-white border border-gray-200 rounded-lg px-2 py-1 min-w-0 appearance-none" />
                            <button type="button" onClick={handleRefresh} disabled={isFetchingData} className="p-1.5 bg-white rounded-full border border-gray-200 text-gray-500"><Icons.RefreshCw className={`w-4 h-4 ${isFetchingData ? 'animate-spin' : ''}`} /></button>
                        </div>
                    </div>
                );
                if (!I || !I.current || !I.period) {
                    return <div className="space-y-4">{periodBar}<div className="bg-yellow-50 border border-yellow-200 rounded-2xl p-4 text-sm text-yellow-800">分析データがありません。右上の更新ボタンを押してください。</div></div>;
                }

                const C = I.current, P = I.previous || {};
                const rows = I.products || [];
                const card = 'bg-white rounded-2xl border border-gray-200';
                const Delta = ({ cur, prev, inverse = false, pt = false, money = false }) => {
                    if (prev == null || cur == null || (!pt && !prev)) return <span className="text-xs text-gray-400">前期 —</span>;
                    const diff = cur - prev;
                    if (Math.round(diff) === 0) return <span className="text-xs font-bold text-gray-500">± 0</span>;
                    const good = inverse ? diff < 0 : diff > 0;
                    const pct = Math.round(diff / prev * 100);
                    const text = pt ? `${Math.abs(diff)}pt` : money ? `${diff > 0 ? '+' : '−'}${yen(Math.abs(diff))}（${pct > 0 ? '+' : ''}${pct}%）` : `${diff > 0 ? '+' : '−'}${Math.abs(Math.round(diff))}`;
                    return <span className={`text-xs font-bold ${good ? 'text-nanairo-dark' : 'text-red-600'}`}>{diff > 0 ? '▲' : '▼'} {text}</span>;
                };
                const sumCh = (k) => rows.reduce((a, r) => a + (r[k] || 0), 0);
                const soldLine = sumCh('soldLine'), soldStore = sumCh('soldStore'), soldAgency = sumCh('soldAgency');

                // --- 気づき ---
                const reduceList = rows.filter(p => p.action === 'reduce').sort((a, b) => b.lossAmount - a.lossAmount);
                const increaseList = rows.filter(p => p.action === 'increase');
                const monthlySaving = Math.round(reduceList.reduce((a, p) => a + Math.max(0, p.weeklyHarvest - p.suggestedWeekly) * p.price, 0) * 4.3);
                const wd = I.weekday || [];
                const wdTotal = wd.reduce((a, w) => a + w.sales, 0);
                const wdTop = wd.length ? [...wd].sort((a, b) => b.sales - a.sales)[0] : null;
                const followUp = (I.customers && I.customers.followUp) || [];
                const notes = [];
                if (C.lossAmount > 0 && C.sales > 0 && C.lossAmount >= C.sales * 0.3) notes.push(['🔴', 'bg-red-50 border-red-100', `廃棄 ${yen(C.lossAmount)} は売上の ${Math.round(C.lossAmount / C.sales * 100)}%`, `収穫 ${C.harvest}個のうち ${C.loss}個（${C.lossRate}%）を廃棄。収穫量を合わせるのがいちばんの近道です。`]);
                if (reduceList.length) notes.push(['🟠', 'bg-amber-50 border-amber-100', `収穫を減らす候補：${reduceList.slice(0, 3).map(p => p.name).join('・')}${reduceList.length > 3 ? ` ほか${reduceList.length - 3}品` : ''}`, `下の表の「週の収穫の目安」に合わせると、廃棄を月 約${yen(monthlySaving)} 減らせる見込みです。`]);
                if (increaseList.length) notes.push(['🟢', 'bg-green-50 border-green-100', `品切れ気味：${increaseList.map(p => p.name).join('・')}`, 'ほぼ売り切れています。収穫を少し増やすと売上が伸びる可能性があります。']);
                if (P.sales > 0) { const d = Math.round((C.sales - P.sales) / P.sales * 100); notes.push([d >= 0 ? '🟢' : '⚪', d >= 0 ? 'bg-green-50 border-green-100' : 'bg-gray-50 border-gray-200', `売上は前期比 ${d >= 0 ? '+' : ''}${d}%（${yen(P.sales)} → ${yen(C.sales)}）`, `店頭 ${yen(C.store)}／LINE ${yen(C.line)}／委託 ${yen(C.agency)}${I.period.end === I.period.today.slice(0, 7) ? '　※今月は途中経過' : ''}`]); }
                if (wdTop && wdTotal > 0) notes.push(['⚪', 'bg-gray-50 border-gray-200', `いちばん売れる曜日は ${WEEK[wdTop.day]}曜（売上の ${Math.round(wdTop.sales / wdTotal * 100)}%）`, 'この曜日の前日〜当日に収穫を合わせると、鮮度も廃棄も改善しやすくなります。']);
                if (followUp.length) notes.push(['🔵', 'bg-blue-50 border-blue-100', `${followUp.length}人のお客様がしばらく注文していません`, '「お客様」タブの「声かけ」から、公式LINEで一声かけるのがおすすめです。']);

                // --- 12か月の推移 ---
                const all = I.monthly || [];
                const first = all.findIndex(m => m.line + m.store + m.agency + m.lossAmount + m.harvest > 0);
                const months = first > 0 ? all.slice(first) : all;
                const W = 700, H = 220, pl = 44, pr = 10, pt = 16, pb = 28;
                const qtyMode = anChartMode === 'qty';
                const vals = months.map(m => qtyMode ? Math.max(m.sold, m.harvest) : Math.max(m.line + m.store + m.agency, m.lossAmount));
                const maxY = Math.max(qtyMode ? 10 : 1000, ...vals);
                const step = (() => { const raw = maxY / 4; const pow = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / pow; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * pow; })();
                const yMax = step * Math.ceil(maxY / step);
                const yOf = v => pt + (H - pt - pb) * (1 - v / yMax);
                const slot = (W - pl - pr) / Math.max(1, months.length);
                const bw = Math.min(30, slot * 0.55);
                const xOf = i => pl + slot * i + slot / 2;
                const ticks = []; for (let v = 0; v <= yMax; v += step) ticks.push(v);
                const shortV = v => qtyMode ? v : v >= 10000 ? `${(v / 10000).toFixed(v % 10000 ? 1 : 0)}万` : v.toLocaleString();
                const linePts = months.map((m, i) => `${xOf(i).toFixed(1)},${yOf(qtyMode ? m.harvest : m.lossAmount).toFixed(1)}`).join(' ');
                const hov = trendHover != null ? months[trendHover] : null;

                // --- 商品別の表 ---
                const sortKeys = { name: r => r.name, harvest: r => r.harvest, sold: r => r.sold, loss: r => r.loss, sellThrough: r => r.sellThrough == null ? -1 : r.sellThrough, lossAmount: r => r.lossAmount, sales: r => r.sales, diff: r => r.sales - (r.prevSales || 0) };
                const tableRows = rows.filter(r => anFilter === 'all' || r.action === anFilter)
                    .sort((a, b) => { const f = sortKeys[anSort] || sortKeys.sales; const x = f(a), y = f(b); return (typeof x === 'string' ? x.localeCompare(y, 'ja') : x - y) * (anDir === 'asc' ? 1 : -1); });
                const shownRows = anShowAll ? tableRows : tableRows.slice(0, 6);
                const th = (k, label, cls = '') => <th onClick={() => { if (anSort === k) setAnDir(anDir === 'asc' ? 'desc' : 'asc'); else { setAnSort(k); setAnDir(k === 'name' ? 'asc' : 'desc'); } }} className={`px-2 py-2 text-[11px] font-bold text-gray-500 whitespace-nowrap cursor-pointer select-none ${cls}`}>{label}{anSort === k ? (anDir === 'asc' ? ' ▲' : ' ▼') : ''}</th>;
                const actionChip = (a) => a === 'reduce' ? <span className="text-[10px] font-bold text-white bg-red-500 px-1.5 py-0.5 rounded">減らす</span> : a === 'increase' ? <span className="text-[10px] font-bold text-white bg-nanairo-dark px-1.5 py-0.5 rounded">増やす</span> : <span className="text-[10px] font-bold text-gray-600 bg-gray-100 px-1.5 py-0.5 rounded">そのまま</span>;

                // --- 受け取り時間帯（店頭） ---
                const slots = {};
                orders.filter(o => o.status !== 'キャンセル' && o.deliveryMethod !== '配送' && inViewPeriod(o)).forEach(o => { const h = String(o.pickupTime).slice(0, 2); if (h) slots[h] = (slots[h] || 0) + 1; });
                const slotKeys = ['11', '12', '13', '14', '15', '16'];
                const slotMax = Math.max(1, ...slotKeys.map(h => slots[h] || 0));

                // --- お客様・委託・請求 ---
                const topCust = customerList.filter(c => c.spend > 0).sort((a, b) => b.spend - a.spend).slice(0, 5);
                const agencyRates = (analytics && analytics.agencyLossRates) || [];
                const billing = customerList.map(c => ({ c, list: c.orders.filter(o => o.status === '受渡済' && inViewPeriod(o)) }))
                    .filter(x => x.list.length > 0).map(x => ({ ...x, amount: x.list.reduce((a, o) => a + Number(o.totalPrice || 0), 0), unpaid: x.list.filter(o => !o.paidChecked).length }))
                    .sort((a, b) => b.amount - a.amount);
                const cu = I.customers || {};
                const CHC = { line: '#0F9A44', store: '#3B82F6', agency: '#F59E0B', loss: '#EF4444' };

                return (
                    <div className="space-y-4">
                        {periodBar}

                        {/* 数字のカード */}
                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                            <div className={`${card} p-3`}>
                                <div className="text-xs text-gray-500">売上合計</div><div className="text-2xl font-bold">{yen(C.sales)}</div><Delta cur={C.sales} prev={P.sales} money />
                                <div className="flex h-1.5 rounded-full overflow-hidden mt-2 bg-gray-100">{C.sales > 0 && ['line', 'store', 'agency'].map(k => <div key={k} style={{ width: `${C[k] / C.sales * 100}%`, background: CHC[k] }}></div>)}</div>
                                <div className="flex flex-wrap gap-x-2 text-[10px] text-gray-500 mt-1"><span style={{ color: CHC.line }}>■</span>LINE {yen(C.line)}<span style={{ color: CHC.store }}>■</span>店頭 {yen(C.store)}<span style={{ color: CHC.agency }}>■</span>委託 {yen(C.agency)}</div>
                            </div>
                            <div className={`${card} p-3`}><div className="text-xs text-gray-500">廃棄額</div><div className="text-2xl font-bold text-red-500">{yen(C.lossAmount)}</div><Delta cur={C.lossAmount} prev={P.lossAmount} inverse money /><div className="text-xs text-gray-500 mt-2">廃棄 {C.loss}個</div></div>
                            <div className={`${card} p-3`}><div className="text-xs text-gray-500">廃棄率（廃棄 ÷ 収穫）</div><div className={`text-2xl font-bold ${C.lossRate >= 30 ? 'text-red-500' : ''}`}>{C.lossRate != null ? `${C.lossRate}%` : '—'}</div><Delta cur={C.lossRate} prev={P.lossRate} inverse pt />
                                <div className="relative w-full h-1.5 bg-gray-100 rounded-full mt-2"><div className="h-full bg-red-400 rounded-full" style={{ width: `${Math.min(100, C.lossRate || 0)}%` }}></div><div className="absolute top-[-3px] w-0.5 h-3 bg-gray-700" style={{ left: '30%' }}></div></div><div className="text-[10px] text-gray-500 mt-1">目標 30% 以下（｜の位置）</div></div>
                            <div className={`${card} p-3`}><div className="text-xs text-gray-500">販売率（売れた ÷ 収穫）</div><div className="text-2xl font-bold">{C.sellThrough != null ? `${C.sellThrough}%` : '—'}</div><Delta cur={C.sellThrough} prev={P.sellThrough} pt /><div className="text-xs text-gray-500 mt-2">収穫 {C.harvest}個 → 売れた {C.qty}個</div></div>
                            <div className={`${card} p-3`}><div className="text-xs text-gray-500">LINE注文</div><div className="text-2xl font-bold">{C.lineOrders}件</div><Delta cur={C.lineOrders} prev={P.lineOrders} /><div className="text-xs text-gray-500 mt-2">店頭受取 {C.pickup}件・配送 {C.delivery}件</div></div>
                            <div className={`${card} p-3`}><div className="text-xs text-gray-500">LINE注文の平均単価</div><div className="text-2xl font-bold">{yen(C.avgLineOrder)}</div><Delta cur={C.avgLineOrder} prev={P.avgLineOrder} money /><div className="text-xs text-gray-500 mt-2">配送料の合計 {yen(C.shipping)}</div></div>
                            <div className={`${card} p-3`}><div className="text-xs text-gray-500">店頭販売</div><div className="text-2xl font-bold">{yen(C.store)}</div><Delta cur={C.store} prev={P.store} money /><div className="text-xs text-gray-500 mt-2">会計 {C.storeTx}回・{soldStore}個</div></div>
                            <div className={`${card} p-3`}><div className="text-xs text-gray-500">お客様（LINE）</div><div className="text-2xl font-bold">{cu.active || 0}人</div><div className="text-xs font-bold text-nanairo-dark">新規 +{cu.newCount || 0}人</div><div className="text-xs text-gray-500 mt-2">リピート率 {cu.repeatRate || 0}%・声かけ候補 {followUp.length}人</div></div>
                        </div>

                        {/* 気づき */}
                        {notes.length > 0 && (
                            <div className={`${card} p-4`}>
                                <div className="text-sm font-bold text-gray-700 mb-2">💡 気づきと打ち手</div>
                                <div className="grid lg:grid-cols-2 gap-2">
                                    {notes.map(([icon, cls, title, body], i) => <div key={i} className={`flex gap-2 p-2.5 rounded-xl border ${cls}`}><span>{icon}</span><div><b className="text-sm text-gray-900">{title}</b><div className="text-xs text-gray-600 mt-0.5">{body}</div></div></div>)}
                                </div>
                            </div>
                        )}

                        <div className="grid lg:grid-cols-3 gap-4">
                            {/* 推移 */}
                            <div className={`${card} p-4 lg:col-span-2`}>
                                <div className="flex items-center justify-between mb-2">
                                    <div className="text-sm font-bold text-gray-700">{qtyMode ? '販売数と収穫数の推移' : '売上と廃棄の推移'}（{months.length}か月）</div>
                                    <div className="flex gap-1 text-[11px] font-bold">
                                        {[['amount', '金額'], ['qty', '個数'], ['table', '表で見る']].map(([k, l]) => <button key={k} type="button" onClick={() => setAnChartMode(k)} className={`px-2 py-1 rounded ${anChartMode === k ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-600'}`}>{l}</button>)}
                                    </div>
                                </div>
                                {anChartMode === 'table' ? (
                                    <div className="overflow-x-auto"><table className="w-full text-xs"><thead><tr className="text-gray-500 border-b border-gray-200"><th className="text-left py-1.5">月</th><th className="text-right">LINE</th><th className="text-right">店頭</th><th className="text-right">委託</th><th className="text-right">売上計</th><th className="text-right">廃棄額</th><th className="text-right">収穫</th><th className="text-right">販売数</th></tr></thead>
                                        <tbody className="divide-y divide-gray-100">{months.slice().reverse().map(m => <tr key={m.month}><td className="py-1.5">{fmtM(m.month)}</td><td className="text-right">{yen(m.line)}</td><td className="text-right">{yen(m.store)}</td><td className="text-right">{yen(m.agency)}</td><td className="text-right font-bold">{yen(m.line + m.store + m.agency)}</td><td className="text-right text-red-500">{yen(m.lossAmount)}</td><td className="text-right">{m.harvest}</td><td className="text-right">{m.sold}</td></tr>)}</tbody></table></div>
                                ) : (<>
                                    <svg viewBox={`0 0 ${W} ${H}`} className="w-full">
                                        {ticks.map(v => <g key={v}><line x1={pl} x2={W - pr} y1={yOf(v)} y2={yOf(v)} stroke={v ? '#F3F4F6' : '#E5E7EB'} /><text x={pl - 6} y={yOf(v) + 3} fontSize="10" fill="#9CA3AF" textAnchor="end">{shortV(v)}</text></g>)}
                                        {months.map((m, i) => {
                                            const x = xOf(i) - bw / 2;
                                            const segs = qtyMode ? [['sold', m.sold, CHC.line]] : [['line', m.line, CHC.line], ['store', m.store, CHC.store], ['agency', m.agency, CHC.agency]];
                                            let acc = 0;
                                            return <g key={m.month} onClick={() => setTrendHover(trendHover === i ? null : i)} style={{ cursor: 'pointer' }}>
                                                <rect x={xOf(i) - slot / 2} y={pt} width={slot} height={H - pt - pb} fill={trendHover === i ? '#F9FAFB' : 'transparent'} />
                                                {segs.map(([k, v, col]) => { const y1 = yOf(acc + v), y0 = yOf(acc); acc += v; return v > 0 ? <rect key={k} x={x} y={y1} width={bw} height={y0 - y1} fill={col} /> : null; })}
                                                <text x={xOf(i)} y={H - 10} fontSize="10" fill={m.month === I.period.end ? '#111' : '#6B7280'} fontWeight={m.month === I.period.end ? 700 : 400} textAnchor="middle">{Number(m.month.slice(5))}月</text>
                                            </g>;
                                        })}
                                        <polyline fill="none" stroke={qtyMode ? '#9CA3AF' : CHC.loss} strokeWidth="2.5" strokeDasharray={qtyMode ? '5 4' : ''} points={linePts} />
                                        {months.map((m, i) => <circle key={m.month} cx={xOf(i)} cy={yOf(qtyMode ? m.harvest : m.lossAmount)} r="3" fill={qtyMode ? '#9CA3AF' : CHC.loss} />)}
                                    </svg>
                                    <div className="flex flex-wrap gap-3 text-[11px] text-gray-600">
                                        {qtyMode ? <><span><span style={{ color: CHC.line }}>■</span> 売れた数</span><span className="text-gray-500">- - 収穫数</span></>
                                            : <><span><span style={{ color: CHC.line }}>■</span> LINE注文</span><span><span style={{ color: CHC.store }}>■</span> 店頭販売</span><span><span style={{ color: CHC.agency }}>■</span> 委託</span><span style={{ color: CHC.loss }}>━ 廃棄額</span></>}
                                        <span className="ml-auto text-gray-400">棒をタップで内訳</span>
                                    </div>
                                    {hov && <div className="mt-2 text-xs bg-gray-50 rounded-xl p-2.5 grid grid-cols-2 gap-x-4 gap-y-0.5"><b className="col-span-2">{fmtM(hov.month)}</b><span>LINE {yen(hov.line)}</span><span>店頭 {yen(hov.store)}</span><span>委託 {yen(hov.agency)}</span><span className="text-red-500">廃棄 {yen(hov.lossAmount)}</span><span>収穫 {hov.harvest}個</span><span>売れた {hov.sold}個</span></div>}
                                </>)}
                            </div>

                            {/* 収穫のゆくえ */}
                            <div className={`${card} p-4`}>
                                <div className="text-sm font-bold text-gray-700 mb-3">収穫した{C.harvest}個のゆくえ</div>
                                {C.harvest > 0 ? (
                                    <div className="space-y-2 text-sm">
                                        {[['LINE注文で売れた', soldLine, CHC.line], ['店頭で売れた', soldStore, CHC.store], ['委託で売れた', soldAgency, CHC.agency], ['廃棄', C.loss, CHC.loss]].map(([l, v, col]) => (
                                            <div key={l}><div className="flex justify-between"><span className={l === '廃棄' ? 'text-red-500 font-bold' : ''}>{l}</span><b className={l === '廃棄' ? 'text-red-500' : ''}>{v}個</b></div><div className="h-2.5 bg-gray-100 rounded-full"><div className="h-full rounded-full" style={{ width: `${Math.min(100, v / C.harvest * 100)}%`, background: col }}></div></div></div>
                                        ))}
                                        <div className="flex justify-between text-xs text-gray-500 pt-1"><span>残り（在庫・未記録など）</span><span>{Math.max(0, C.harvest - soldLine - soldStore - soldAgency - C.loss)}個</span></div>
                                    </div>
                                ) : <div className="text-sm text-gray-400">この期間の収穫の記録がありません</div>}
                                {C.lossAmount > 0 && <div className="mt-4 p-2.5 rounded-xl bg-gray-50 text-xs text-gray-600 leading-relaxed">廃棄を半分にすると <b className="text-nanairo-dark">{yen(C.lossAmount / 2)}</b> 相当の損が減ります。</div>}
                            </div>
                        </div>

                        {/* 商品別 */}
                        <div className={`${card} p-4`}>
                            <div className="flex flex-wrap items-center justify-between gap-2 mb-1">
                                <div className="text-sm font-bold text-gray-700">商品別 <span className="text-xs font-normal text-gray-500">見出しをタップで並べ替え</span></div>
                                <div className="flex gap-1 text-[11px] font-bold">
                                    {[['all', 'すべて', rows.length], ['reduce', '減らす', reduceList.length], ['increase', '増やす', increaseList.length]].map(([k, l, n]) => <button key={k} type="button" onClick={() => setAnFilter(k)} className={`px-2 py-1 rounded ${anFilter === k ? 'bg-gray-900 text-white' : k === 'reduce' ? 'bg-red-50 text-red-600' : k === 'increase' ? 'bg-green-50 text-nanairo-dark' : 'bg-gray-100 text-gray-600'}`}>{l} {n}</button>)}
                                </div>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm">
                                    <thead className="border-b border-gray-200"><tr>{th('name', '商品', 'text-left')}{th('harvest', '収穫', 'text-right')}{th('sold', '売れた（LINE／店頭／委託）', 'text-left')}{th('loss', '廃棄', 'text-right')}{th('sellThrough', '販売率', 'text-left')}{th('lossAmount', '廃棄額', 'text-right')}{th('sales', '売上', 'text-right')}{th('diff', '前期比', 'text-right')}<th className="px-2 py-2 text-[11px] font-bold text-gray-500 text-right whitespace-nowrap">週の収穫 → 目安</th></tr></thead>
                                    <tbody className="divide-y divide-gray-100">
                                        {shownRows.map(r => {
                                            const pd = r.prevSales ? Math.round((r.sales - r.prevSales) / r.prevSales * 100) : null;
                                            return (
                                                <tr key={r.id}>
                                                    <td className="px-2 py-2 font-bold whitespace-nowrap">{r.name}</td>
                                                    <td className="px-2 py-2 text-right">{r.harvest}</td>
                                                    <td className="px-2 py-2 min-w-[140px]"><div className="flex h-2 w-full rounded overflow-hidden bg-gray-100">{r.harvest > 0 && [['soldLine', CHC.line], ['soldStore', CHC.store], ['soldAgency', CHC.agency]].map(([k, col]) => <div key={k} style={{ width: `${Math.min(100, r[k] / r.harvest * 100)}%`, background: col }}></div>)}</div><span className="text-[10px] text-gray-500">{r.soldLine}／{r.soldStore}／{r.soldAgency}＝{r.sold}</span></td>
                                                    <td className={`px-2 py-2 text-right ${r.lossRate >= 30 ? 'text-red-500 font-bold' : ''}`}>{r.loss}</td>
                                                    <td className="px-2 py-2"><div className="flex items-center gap-1"><div className="w-14 h-1.5 bg-gray-100 rounded-full"><div className="h-full bg-nanairo-dark rounded-full" style={{ width: `${Math.min(100, r.sellThrough || 0)}%` }}></div></div><span className="text-xs">{r.sellThrough != null ? `${r.sellThrough}%` : '—'}</span></div></td>
                                                    <td className={`px-2 py-2 text-right whitespace-nowrap ${r.lossAmount ? 'text-red-500' : ''}`}>{yen(r.lossAmount)}</td>
                                                    <td className="px-2 py-2 text-right whitespace-nowrap">{yen(r.sales)}</td>
                                                    <td className={`px-2 py-2 text-right text-xs whitespace-nowrap ${pd == null ? 'text-gray-400' : pd >= 0 ? 'text-nanairo-dark' : 'text-red-500'}`}>{pd == null ? '—' : `${pd > 0 ? '+' : ''}${pd}%`}</td>
                                                    <td className="px-2 py-2 text-right whitespace-nowrap"><span className="text-xs text-gray-400">{r.weeklyHarvest}</span> → <b>{r.suggestedWeekly}</b> {actionChip(r.action)}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                            {tableRows.length > 6 && <button type="button" onClick={() => setAnShowAll(!anShowAll)} className="w-full text-center text-xs font-bold text-gray-500 py-2">{anShowAll ? '閉じる' : `すべて表示（ほか${tableRows.length - 6}商品）`}</button>}
                            <p className="text-[11px] text-gray-500 mt-1">目安＝この期間の週平均の販売数 × 1.15（欠品を防ぐ余裕）。「在庫」→「まとめて入力」の目安にも使われます。</p>
                        </div>

                        <div className="grid lg:grid-cols-3 gap-4">
                            {/* 曜日・時間帯 */}
                            <div className={`${card} p-4`}>

                            </div>
                        </div>

                        const cur = TYPES.find(t => t[0] === type);
